# Cluster Intel — Production deployment override
# Reuses external Postgres from the avika namespace, bundles Redis + NATS.
#
# Usage:
#   helm upgrade --install cluster-intel deploy/helm/hetu/ \
#     --namespace cluster-intel --create-namespace \
#     -f values-deploy.yaml

cluster:
  id: "cylon"
  displayName: "Cylon Dev Cluster"

# --- Images on Docker Hub ---
collector:
  image:
    repository: docker.io/hellodk/hetu-collector
    tag: "7.0.0"
    pullPolicy: Always
  prometheusUrl: "http://monitoring-prometheus.monitoring.svc.cluster.local:9090"

analyzer:
  image:
    repository: docker.io/hellodk/hetu-analyzer
    tag: "7.0.0"
    pullPolicy: Always

dashboard:
  image:
    repository: docker.io/hellodk/hetu-dashboard
    tag: "7.0.0"
    pullPolicy: Always

# --- External Postgres (avika namespace) ---
stores:
  postgres:
    bundled: false
    external:
      host: avika-postgresql.avika.svc.cluster.local
      port: 5432
      db: cluster_intel
      user: cluster_intel
      existingSecret: cluster-intel-postgres
      existingSecretPasswordKey: password
    sslMode: disable

  # ClickHouse was removed from the chart in 0.2.0 — not wired to any
  # template. Re-add here when the first CH-backed feature ships.

  # Bundled Redis (no existing instance)
  redis:
    bundled: true

# Bundled NATS
bus:
  nats:
    bundled: true

# --- LLM (ollama local for now) ---
llm:
  provider: ollama
  endpoint: "http://127.0.0.1:11434"
  model: llama3

# --- Safety ---
writeActions:
  enabled: false
exec:
  enabled: true

# --- No ingress for now ---
ingress:
  enabled: false

serviceMonitor:
  enabled: false

logging:
  level: info
  format: json

# Override: disable Redis for now (image not available)
redis:
  enabled: false
