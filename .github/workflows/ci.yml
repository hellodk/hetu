# CI for hetu — verify on every PR/push; build & publish multi-arch images on main/tags.
#
# Design notes:
# - All logic lives in scripts/ci (the repo's unified CLI); this file only
#   orchestrates it. No test/lint steps are duplicated here.
# - Nothing hardcoded that varies per environment: Docker Hub namespace comes
#   from the DOCKERHUB_USERNAME secret, image tag from the git tag (v*) or the
#   VERSION file, platforms/basePath from workflow env below.
# - Multi-arch via QEMU emulation; Go cross-compiles cheaply, Next.js arm64 is
#   the slow leg (~10-15 min) — publish only runs for main/tags.

name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Architectures built by the publish job. raspberrypi node needs arm64.
  IMAGE_PLATFORMS: linux/amd64,linux/arm64
  # Dashboard basePath is a BUILD-TIME Next.js setting; the chart serves /hetu.
  NEXT_BASE_PATH: /hetu

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install golangci-lint (pinned v1.64.8, built from source so its
        Go version matches setup-go's — upstream release binaries are built
        with older Go and refuse modules targeting go >= 1.25)
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          golangci-lint version

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm (version pinned in src/dashboard/package.json)
        run: corepack enable

      - name: Unit tests (all modules, race detector)
        run: scripts/ci test unit

      - name: Lint (gofmt, vet, golangci-lint, helm, tsc)
        run: scripts/ci test lint

  publish:
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tag push v7.5.0 → image tag 7.5.0; main → VERSION file contents.
      - name: Resolve image tag
        id: meta
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # One multi-arch build; main builds also move the :latest pointer.
      - name: Build and push hetu-{collector,analyzer,dashboard}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          EXTRA_IMAGE_TAGS: ${{ github.ref == 'refs/heads/main' && 'latest' || '' }}
          PUSH_IMAGES: 'true'
        run: scripts/ci build image
