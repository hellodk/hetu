# Minimal golangci-lint config used by .githooks/pre-commit.
# Focus: dead code, obvious bugs, security smells. Keep the set small so
# the hook stays fast and actionable.

run:
  timeout: 2m
  tests: true
  # Go 1.25 — use the current language version for staticcheck's analyses.
  go: "1.25"

linters:
  disable-all: true
  enable:
    - errcheck       # unchecked errors
    - govet          # go vet
    - ineffassign    # ineffective assignments (dead stores)
    - staticcheck    # includes a large dead-code / simplification set
    - unused         # unused funcs / vars / consts / types
    - unparam        # unused function parameters
    - gosec          # security smells (hardcoded creds, weak rand, etc.)
    - misspell       # typos in comments / strings

linters-settings:
  gosec:
    # G101 (hardcoded credentials) is the one most relevant to this hook.
    # G104 overlaps with errcheck — skip to avoid double-reports.
    # G401/G505 — sha1 + math/rand are intentional non-cryptographic
    #   uses (fingerprint hashing, mock data generation).
    excludes:
      - G104
      - G401
      - G404
      - G505
  staticcheck:
    checks: ["all"]
  errcheck:
    # Functions whose returned error is genuinely unactionable in our
    # context. json.NewEncoder(w).Encode and w.Write happen AFTER we've
    # already committed status code + content-type — there's no recovery
    # path; the connection is already half-broken. We rely on access logs
    # for these. fmt.Fprintf to a bytes.Buffer never errors.
    exclude-functions:
      - (*encoding/json.Encoder).Encode
      - (*encoding/json.Decoder).Decode
      - (net/http.ResponseWriter).Write
      - io.Copy
      - fmt.Fprintf

issues:
  # Don't hide repeat issues; the hook only blocks net-new problems in
  # the changed module, so seeing everything is fine.
  max-same-issues: 0
  max-issues-per-linter: 0
  exclude-rules:
    # Test files get a pass on unparam / gosec weak-rand style checks
    # AND errcheck (test code often does t.Fatal on a downstream
    # assertion rather than the upstream error directly).
    - path: _test\.go
      linters:
        - unparam
        - gosec
        - errcheck
    # govet "httpresponse" complains about test-only patterns where we
    # rely on Status code being checked downstream — too noisy in tests.
    - path: _test\.go
      linters: [govet]
      text: "httpresponse"
    # Mock data generation uses math/rand and int→uint conversions
    # deliberately (not security-sensitive; not crypto).
    - path: mock_source\.go
      linters: [gosec]
    # Pre-existing unparam findings kept deliberately for API stability
    # or future-extension reasons. See commit history for context.
    - path: correlator\.go
      linters: [unparam]
      text: "IngestSignal"
    - path: main\.go
      linters: [unparam]
      text: "NewAnalyzer|\\(\\*Analyzer\\)\\.Start"
