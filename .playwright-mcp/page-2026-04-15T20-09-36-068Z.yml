      - generic [ref=e55]:
        - paragraph [ref=e56]: At 08:42 UTC the Tailscale DERP relay on node calico-node-2bba1 dropped packets for ~11s. Calico's BGP session timer is 10s, so sessions flapped across three peers in quick succession. Each peer triggered a VXLAN FDB flush; the resulting re-learn storm spiked east-west latency.
        - paragraph [ref=e57]: Auto-drain kicked in at T+6m once the pod-health scorer crossed the drain threshold on the first affected node. Remaining two nodes were drained preemptively. Workloads re-scheduled cleanly onto the four healthy nodes. No customer traffic was shed thanks to the ingress tier being on separate dedicated nodes.
