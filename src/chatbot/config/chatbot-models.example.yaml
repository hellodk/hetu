# Chatbot Model Configuration
# Copy this to chatbot-models.yaml and customize for your environment

embedding:
  provider: "local"  # Options: local, openai, huggingface

  local:
    # Your local model server (Ollama, vLLM, or Text Generation WebUI)
    endpoint: "http://192.168.1.19:8080/embeddings"
    model_name: "all-MiniLM-L6-v2"  # Fast, 384 dims
    # Alternative: "all-mpnet-base-v2"  # Accurate, 768 dims
    timeout_seconds: 10
    retry_max: 3

  # Cloud fallback (optional)
  cloud:
    enabled: false
    provider: "openai"
    api_key: "${OPENAI_API_KEY}"
    model_name: "text-embedding-3-small"

  # Caching
  cache:
    enabled: true
    ttl_seconds: 86400
    backend: "redis"  # redis or memory
    host: "redis.chatbot.svc.cluster.local"
    port: 6379

# ============================================================================
# LLM Configuration
# ============================================================================

llm:
  provider: "local"  # Options: local, anthropic, openai

  # Primary: Local LLM (your 192.168.1.19:8080 server)
  local:
    endpoint: "http://192.168.1.19:8080/v1/chat/completions"
    model_name: "mistral-7b"
    # Other options:
    # - "llama2-13b"        (slower, more accurate)
    # - "neural-chat-7b"    (optimized for conversations)
    # - "openchat-3.5"      (fast, good quality)

    timeout_seconds: 30
    max_tokens: 2048
    temperature: 0.7
    top_p: 0.95
    retry_max: 2
    stream: true

  # Fallback to cloud provider if local is unavailable
  cloud:
    enabled: false
    provider: "anthropic"
    api_key: "${ANTHROPIC_API_KEY}"
    model_name: "claude-3-sonnet-20240229"
    timeout_seconds: 30
    max_tokens: 2048

  # Fallback chain (try each in order if previous fails)
  fallback_chain:
    - provider: "openai"
      api_key: "${OPENAI_API_KEY}"
      model_name: "gpt-4-turbo"
      timeout_seconds: 30
    - provider: "anthropic"
      api_key: "${ANTHROPIC_API_KEY}"
      model_name: "claude-3-haiku-20240307"
      timeout_seconds: 30

# ============================================================================
# Model Discovery
# ============================================================================

discovery:
  enabled: true
  # Endpoint that lists available models
  registry_endpoint: "http://192.168.1.19:8080/models"
  refresh_interval_seconds: 300
  cache_local_models: true

# ============================================================================
# Tool Execution
# ============================================================================

tools:
  timeout_per_tool: 5
  parallel_execution: true
  max_retries: 2

# ============================================================================
# Feature Flags
# ============================================================================

features:
  enable_local_models: true
  enable_cloud_fallback: true
  enable_model_routing: true
  enable_usage_tracking: true

# ============================================================================
# Cluster Configuration
# ============================================================================

cluster:
  # Kubernetes API endpoint (auto-detect from kubeconfig if not set)
  api_endpoint: ""

  # Prometheus endpoint for metrics queries
  prometheus_endpoint: "http://prometheus.monitoring.svc.cluster.local:9090"

  # Loki endpoint for logs
  loki_endpoint: "http://loki.monitoring.svc.cluster.local:3100"

  # Dashboard API endpoint
  dashboard_endpoint: "http://dashboard.default.svc.cluster.local:3000"

  # Qdrant vector DB endpoint
  qdrant_endpoint: "http://qdrant.default.svc.cluster.local:6333"

# ============================================================================
# Security & Authentication
# ============================================================================

auth:
  # Token format: Bearer <token>
  # In production, validate against an OAuth2/OIDC provider
  validate_tokens: false  # Set to true in production
  token_secret: "${AUTH_SECRET}"

# ============================================================================
# Logging & Debugging
# ============================================================================

logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "json"  # json or text

  # Log tool calls and responses
  log_tools: true

  # Log LLM requests/responses (verbose)
  log_llm: false
