<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cluster Intelligence | Security Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=SF+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        /* ═══════════════════════════════════════════════════════════════════
           GLASSMORPHISM DESIGN SYSTEM
           Enterprise Security Dashboard
           ═══════════════════════════════════════════════════════════════════ */
        
        :root {
            /* Glass Properties */
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-bg-hover: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-border-light: rgba(255, 255, 255, 0.12);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --glass-blur: 20px;
            
            /* Colors */
            --bg-dark: #050510;
            --text-primary: rgba(255, 255, 255, 0.95);
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-tertiary: rgba(255, 255, 255, 0.4);
            
            /* Accent Colors */
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --accent-orange: #f97316;
            --accent-red: #ef4444;
            --accent-pink: #ec4899;
            
            /* Gradients */
            --gradient-primary: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            --gradient-success: linear-gradient(135deg, var(--accent-green), var(--accent-cyan));
            --gradient-warning: linear-gradient(135deg, var(--accent-yellow), var(--accent-orange));
            --gradient-danger: linear-gradient(135deg, var(--accent-red), var(--accent-pink));
            
            /* Spacing */
            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 20px;
            --space-6: 24px;
            --space-8: 32px;
            --space-10: 40px;
            --space-12: 48px;
            
            /* Border Radius */
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-2xl: 32px;
            
            /* Transitions */
            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-base: 250ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 400ms cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* ═══════════════════════════════════════════════════════════════════
           RESET & BASE
           ═══════════════════════════════════════════════════════════════════ */
        
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        html {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-feature-settings: 'cv11', 'ss01';
        }
        
        body {
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* ═══════════════════════════════════════════════════════════════════
           ANIMATED BACKGROUND
           ═══════════════════════════════════════════════════════════════════ */
        
        .bg-mesh {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            background: var(--bg-dark);
        }
        
        .bg-mesh::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(139, 92, 246, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 40% 80%, rgba(6, 182, 212, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(236, 72, 153, 0.08) 0%, transparent 50%);
            animation: meshMove 30s ease-in-out infinite;
        }
        
        @keyframes meshMove {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(2%, 2%) rotate(1deg); }
            50% { transform: translate(-1%, 3%) rotate(-1deg); }
            75% { transform: translate(3%, -1%) rotate(2deg); }
        }
        
        .bg-noise {
            position: fixed;
            inset: 0;
            z-index: -1;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }
        
        /* ═══════════════════════════════════════════════════════════════════
           GLASS COMPONENTS
           ═══════════════════════════════════════════════════════════════════ */
        
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }
        
        .glass-subtle {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            box-shadow: var(--glass-shadow);
            transition: all var(--transition-base);
        }
        
        .glass-card:hover {
            background: var(--glass-bg-hover);
            border-color: var(--glass-border-light);
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }
        
        /* ═══════════════════════════════════════════════════════════════════
           LAYOUT
           ═══════════════════════════════════════════════════════════════════ */
        
        .app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: var(--space-4) var(--space-6);
            background: rgba(5, 5, 16, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
        }
        
        .header-inner {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-6);
        }
        
        .main {
            flex: 1;
            padding: var(--space-8) var(--space-6);
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }
        
        /* ═══════════════════════════════════════════════════════════════════
           HEADER
           ═══════════════════════════════════════════════════════════════════ */
        
        .logo {
            display: flex;
            align-items: center;
            gap: var(--space-3);
        }
        
        .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--gradient-primary);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.3);
        }
        
        .logo-icon svg {
            width: 22px;
            height: 22px;
            color: white;
        }
        
        .logo-text {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, rgba(255,255,255,0.7));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .nav {
            display: flex;
            align-items: center;
            gap: var(--space-1);
            padding: var(--space-1);
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-lg);
            border: 1px solid var(--glass-border);
        }
        
        .nav-item {
            padding: var(--space-2) var(--space-4);
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            gap: var(--space-2);
            white-space: nowrap;
        }
        
        .nav-item:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }
        
        .nav-item.active {
            color: white;
            background: var(--gradient-primary);
            box-shadow: 0 2px 12px rgba(59, 130, 246, 0.3);
        }
        
        .nav-item svg {
            width: 16px;
            height: 16px;
            opacity: 0.7;
        }
        
        .nav-item.active svg {
            opacity: 1;
        }
        
        .nav-badge {
            padding: 2px 6px;
            font-size: 10px;
            font-weight: 600;
            background: var(--accent-red);
            color: white;
            border-radius: 20px;
            margin-left: var(--space-1);
        }
        
        .header-actions {
            display: flex;
            align-items: center;
            gap: var(--space-3);
        }
        
        .header-btn {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-md);
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-fast);
        }
        
        .header-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            border-color: var(--glass-border-light);
        }
        
        .header-btn svg {
            width: 18px;
            height: 18px;
        }
        
        .status-badge {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            padding: var(--space-2) var(--space-3);
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: var(--radius-md);
            font-size: 12px;
            color: var(--accent-green);
        }
        
        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.9); }
        }
        
        /* ═══════════════════════════════════════════════════════════════════
           HERO SECTION
           ═══════════════════════════════════════════════════════════════════ */
        
        .hero {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: var(--space-6);
            margin-bottom: var(--space-8);
        }
        
        .score-card {
            padding: var(--space-8);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        
        .score-ring-wrapper {
            position: relative;
            margin-bottom: var(--space-6);
        }
        
        .score-ring {
            width: 200px;
            height: 200px;
            transform: rotate(-90deg);
        }
        
        .score-ring-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.08);
            stroke-width: 12;
        }
        
        .score-ring-value {
            fill: none;
            stroke-width: 12;
            stroke-linecap: round;
            filter: drop-shadow(0 0 8px currentColor);
            transition: stroke-dashoffset 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .score-center {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .score-value {
            font-size: 56px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -2px;
        }
        
        .score-label {
            font-size: 13px;
            color: var(--text-tertiary);
            font-weight: 500;
            margin-top: var(--space-2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .score-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: var(--space-2);
        }
        
        .score-subtitle {
            font-size: 13px;
            color: var(--text-tertiary);
        }
        
        .score-grade {
            display: inline-flex;
            padding: var(--space-1) var(--space-3);
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 600;
            margin-top: var(--space-3);
        }
        
        /* Metrics Panel */
        .metrics-panel {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--space-4);
        }
        
        .metric-card {
            padding: var(--space-5);
        }
        
        .metric-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--space-4);
        }
        
        .metric-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .metric-icon svg {
            width: 20px;
            height: 20px;
        }
        
        .metric-title {
            font-size: 13px;
            color: var(--text-tertiary);
            font-weight: 500;
        }
        
        .metric-value {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: var(--space-3);
            letter-spacing: -1px;
        }
        
        .metric-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            overflow: hidden;
        }
        
        .metric-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* ═══════════════════════════════════════════════════════════════════
           STATS ROW
           ═══════════════════════════════════════════════════════════════════ */
        
        .stats-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: var(--space-4);
            margin-bottom: var(--space-8);
        }
        
        .stat-card {
            padding: var(--space-5);
            cursor: pointer;
        }
        
        .stat-card:hover .stat-icon {
            transform: scale(1.1);
        }
        
        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: var(--space-4);
            transition: transform var(--transition-base);
        }
        
        .stat-icon svg {
            width: 24px;
            height: 24px;
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: var(--space-1);
            letter-spacing: -0.5px;
        }
        
        .stat-label {
            font-size: 13px;
            color: var(--text-tertiary);
            font-weight: 500;
        }
        
        .stat-trend {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            font-weight: 500;
            margin-top: var(--space-2);
            padding: 2px 8px;
            border-radius: var(--radius-sm);
        }
        
        .stat-trend.up {
            color: var(--accent-green);
            background: rgba(16, 185, 129, 0.1);
        }
        
        .stat-trend.down {
            color: var(--accent-red);
            background: rgba(239, 68, 68, 0.1);
        }
        
        /* ═══════════════════════════════════════════════════════════════════
           PANELS
           ═══════════════════════════════════════════════════════════════════ */
        
        .panels {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: var(--space-6);
        }
        
        .panel {
            border-radius: var(--radius-xl);
            overflow: hidden;
        }
        
        .panel-header {
            padding: var(--space-5) var(--space-6);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .panel-title {
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: var(--space-3);
        }
        
        .panel-count {
            font-size: 13px;
            color: var(--text-tertiary);
            font-weight: 500;
        }
        
        .panel-body {
            padding: var(--space-4);
            max-height: 480px;
            overflow-y: auto;
        }
        
        .panel-body::-webkit-scrollbar {
            width: 4px;
        }
        
        .panel-body::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .panel-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
        }
        
        /* ═══════════════════════════════════════════════════════════════════
           ISSUES LIST
           ═══════════════════════════════════════════════════════════════════ */
        
        .issues-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
        }
        
        .issue-item {
            display: flex;
            align-items: flex-start;
            gap: var(--space-4);
            padding: var(--space-4);
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        
        .issue-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--glass-border);
        }
        
        .issue-severity {
            padding: 4px 10px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-radius: var(--radius-sm);
            flex-shrink: 0;
        }
        
        .issue-severity.critical {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(236, 72, 153, 0.2));
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        
        .issue-severity.high {
            background: rgba(249, 115, 22, 0.15);
            color: #fb923c;
            border: 1px solid rgba(249, 115, 22, 0.3);
        }
        
        .issue-severity.medium {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        
        .issue-severity.low {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        
        .issue-content {
            flex: 1;
            min-width: 0;
        }
        
        .issue-title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .issue-meta {
            font-size: 12px;
            color: var(--text-tertiary);
        }
        
        .issue-count {
            font-size: 13px;
            color: var(--text-tertiary);
            flex-shrink: 0;
        }
        
        /* ═══════════════════════════════════════════════════════════════════
           VULNERABILITY CHART
           ═══════════════════════════════════════════════════════════════════ */
        
        .vuln-chart {
            display: flex;
            flex-direction: column;
            gap: var(--space-4);
        }
        
        .vuln-row {
            display: flex;
            align-items: center;
            gap: var(--space-4);
        }
        
        .vuln-label {
            width: 70px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }
        
        .vuln-bar-bg {
            flex: 1;
            height: 32px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-md);
            overflow: hidden;
            position: relative;
        }
        
        .vuln-bar {
            height: 100%;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            padding-left: var(--space-3);
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        
        .vuln-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(180deg, rgba(255,255,255,0.1), transparent);
            border-radius: var(--radius-md) var(--radius-md) 0 0;
        }
        
        .vuln-bar.critical { background: var(--gradient-danger); }
        .vuln-bar.high { background: linear-gradient(135deg, var(--accent-orange), #ea580c); }
        .vuln-bar.medium { background: linear-gradient(135deg, var(--accent-yellow), #d97706); }
        .vuln-bar.low { background: linear-gradient(135deg, var(--accent-blue), #2563eb); }
        
        .vuln-bar-value {
            font-size: 12px;
            font-weight: 600;
            color: white;
            position: relative;
            z-index: 1;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        
        .vuln-count {
            width: 60px;
            text-align: right;
            font-size: 14px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
        
        /* ═══════════════════════════════════════════════════════════════════
           EMPTY STATE
           ═══════════════════════════════════════════════════════════════════ */
        
        .empty-state {
            text-align: center;
            padding: var(--space-12);
            color: var(--text-tertiary);
        }
        
        .empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: var(--space-4);
            opacity: 0.3;
        }
        
        .empty-state p {
            font-size: 14px;
        }
        
        /* ═══════════════════════════════════════════════════════════════════
           LOADING
           ═══════════════════════════════════════════════════════════════════ */
        
        .loading-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .loading-logo {
            width: 64px;
            height: 64px;
            background: var(--gradient-primary);
            border-radius: var(--radius-xl);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: var(--space-6);
            animation: loadingPulse 2s ease-in-out infinite;
        }
        
        .loading-logo svg {
            width: 32px;
            height: 32px;
            color: white;
        }
        
        @keyframes loadingPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(59, 130, 246, 0); }
        }
        
        .loading-text {
            font-size: 14px;
            color: var(--text-tertiary);
        }
        
        .loading-bar {
            width: 200px;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin-top: var(--space-4);
        }
        
        .loading-bar-fill {
            width: 40%;
            height: 100%;
            background: var(--gradient-primary);
            border-radius: 2px;
            animation: loadingBar 1.5s ease-in-out infinite;
        }
        
        @keyframes loadingBar {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(350%); }
        }
        
        /* ═══════════════════════════════════════════════════════════════════
           MODAL
           ═══════════════════════════════════════════════════════════════════ */
        
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 5, 16, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: var(--space-6);
        }
        
        .modal-overlay.show {
            display: flex;
        }
        
        .modal {
            width: 100%;
            max-width: 560px;
            max-height: 80vh;
            overflow: hidden;
            animation: modalIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
        }
        
        .modal-header {
            padding: var(--space-5) var(--space-6);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .modal-title {
            font-size: 18px;
            font-weight: 600;
        }
        
        .modal-close {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-md);
            border: none;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-tertiary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-fast);
        }
        
        .modal-close:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }
        
        .modal-body {
            padding: var(--space-6);
            max-height: calc(80vh - 70px);
            overflow-y: auto;
        }
        
        /* ═══════════════════════════════════════════════════════════════════
           RESPONSIVE
           ═══════════════════════════════════════════════════════════════════ */
        
        @media (max-width: 1200px) {
            .panels { grid-template-columns: 1fr; }
            .hero { grid-template-columns: 1fr; }
            .stats-row { grid-template-columns: repeat(3, 1fr); }
        }
        
        @media (max-width: 900px) {
            .nav { display: none; }
            .stats-row { grid-template-columns: repeat(2, 1fr); }
            .metrics-panel { grid-template-columns: 1fr; }
        }
        
        @media (max-width: 600px) {
            .header-inner { flex-wrap: wrap; justify-content: center; }
            .stats-row { grid-template-columns: 1fr; }
            .main { padding: var(--space-4); }
        }
        
        /* ═══════════════════════════════════════════════════════════════════
           UTILITIES
           ═══════════════════════════════════════════════════════════════════ */
        
        .text-gradient {
            background: linear-gradient(135deg, #fff, rgba(255,255,255,0.6));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .glow-blue { filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.5)); }
        .glow-green { filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.5)); }
        .glow-red { filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.5)); }
        .glow-yellow { filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.5)); }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-mesh"></div>
    <div class="bg-noise"></div>
    
    <!-- Loading Screen -->
    <div id="loading" class="loading-screen">
        <div class="loading-logo">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
            </svg>
        </div>
        <div class="loading-text">Initializing Security Analysis...</div>
        <div class="loading-bar"><div class="loading-bar-fill"></div></div>
    </div>
    
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="header-inner">
                <div class="logo">
                    <div class="logo-icon">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                        </svg>
                    </div>
                    <span class="logo-text">Cluster Intelligence</span>
                </div>
                
                <nav class="nav" id="nav"></nav>
                
                <div class="header-actions">
                    <div class="status-badge">
                        <span class="status-dot"></span>
                        <span id="cluster-status">Connected</span>
                    </div>
                    <button class="header-btn" onclick="refresh()" title="Refresh">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                        </svg>
                    </button>
                    <button class="header-btn" onclick="exportData()" title="Export">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                        </svg>
                    </button>
                </div>
            </div>
        </header>
        
        <!-- Main Content -->
        <main class="main" id="content"></main>
    </div>
    
    <!-- Modal -->
    <div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
        <div class="modal glass-card">
            <div class="modal-header">
                <h2 class="modal-title" id="modal-title"></h2>
                <button class="modal-close" onclick="closeModal()">
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <script>
    // ═══════════════════════════════════════════════════════════════════════════
    // STATE
    // ═══════════════════════════════════════════════════════════════════════════
    
    let DATA = null;
    let currentView = 'overview';
    
    const VIEWS = [
        { id: 'overview', label: 'Overview', icon: 'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6' },
        { id: 'vulnerabilities', label: 'Vulnerabilities', icon: 'M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z', badge: true },
        { id: 'compliance', label: 'Compliance', icon: 'M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z' },
        { id: 'workloads', label: 'Workloads', icon: 'M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01' },
        { id: 'cleanup', label: 'Cleanup', icon: 'M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16' }
    ];
    
    // ═══════════════════════════════════════════════════════════════════════════
    // UTILITIES
    // ═══════════════════════════════════════════════════════════════════════════
    
    function getScoreColor(score) {
        if (score >= 80) return 'var(--accent-green)';
        if (score >= 60) return 'var(--accent-yellow)';
        if (score >= 40) return 'var(--accent-orange)';
        return 'var(--accent-red)';
    }
    
    function getScoreGradient(score) {
        if (score >= 80) return 'var(--gradient-success)';
        if (score >= 60) return 'var(--gradient-warning)';
        return 'var(--gradient-danger)';
    }
    
    function getScoreGrade(score) {
        if (score >= 90) return { grade: 'A', label: 'Excellent', color: 'var(--accent-green)', bg: 'rgba(16,185,129,0.15)' };
        if (score >= 80) return { grade: 'B', label: 'Good', color: 'var(--accent-green)', bg: 'rgba(16,185,129,0.15)' };
        if (score >= 70) return { grade: 'C', label: 'Fair', color: 'var(--accent-yellow)', bg: 'rgba(245,158,11,0.15)' };
        if (score >= 60) return { grade: 'D', label: 'Poor', color: 'var(--accent-orange)', bg: 'rgba(249,115,22,0.15)' };
        return { grade: 'F', label: 'Critical', color: 'var(--accent-red)', bg: 'rgba(239,68,68,0.15)' };
    }
    
    function formatNumber(n) {
        if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
        if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
        return n.toString();
    }
    
    // ═══════════════════════════════════════════════════════════════════════════
    // NAVIGATION
    // ═══════════════════════════════════════════════════════════════════════════
    
    function initNav() {
        var criticalCount = DATA && DATA.vulnerabilities && DATA.vulnerabilities.stats ? 
            (DATA.vulnerabilities.stats.critical || 0) : 0;
        
        var html = '';
        VIEWS.forEach(function(v) {
            var badge = v.badge && criticalCount > 0 ? 
                '<span class="nav-badge">' + criticalCount + '</span>' : '';
            html += '<div class="nav-item' + (v.id === currentView ? ' active' : '') + '" onclick="switchView(\'' + v.id + '\')">' +
                '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="' + v.icon + '"/></svg>' +
                '<span>' + v.label + '</span>' + badge + '</div>';
        });
        document.getElementById('nav').innerHTML = html;
    }
    
    function switchView(view) {
        currentView = view;
        initNav();
        render();
    }
    
    // ═══════════════════════════════════════════════════════════════════════════
    // RENDER FUNCTIONS
    // ═══════════════════════════════════════════════════════════════════════════
    
    function renderOverview() {
        if (!DATA) return '<div class="empty-state"><p>No data available</p></div>';
        
        var scores = DATA.scores || {};
        var overall = scores.overall || 0;
        var circumference = 2 * Math.PI * 88;
        var offset = circumference - (overall / 100) * circumference;
        var gradeInfo = getScoreGrade(overall);
        
        var vs = DATA.vulnerabilities && DATA.vulnerabilities.stats ? DATA.vulnerabilities.stats : {};
        var cs = DATA.cisBenchmark && DATA.cisBenchmark.stats ? DATA.cisBenchmark.stats : {};
        var summary = DATA.summary || {};
        var issues = DATA.topIssues || [];
        var cisPct = cs.total ? Math.round((cs.pass || 0) / cs.total * 100) : 0;
        
        var html = '<div class="hero">';
        
        // Score Card
        html += '<div class="glass-card score-card">';
        html += '<div class="score-ring-wrapper">';
        html += '<svg class="score-ring" viewBox="0 0 200 200">';
        html += '<circle class="score-ring-bg" cx="100" cy="100" r="88"/>';
        html += '<circle class="score-ring-value" cx="100" cy="100" r="88" stroke="' + getScoreColor(overall) + '" style="stroke-dasharray:' + circumference + ';stroke-dashoffset:' + offset + '"/>';
        html += '</svg>';
        html += '<div class="score-center">';
        html += '<span class="score-value" style="color:' + getScoreColor(overall) + '">' + overall + '</span>';
        html += '<span class="score-label">Health Score</span>';
        html += '</div></div>';
        html += '<div class="score-title">Security Posture</div>';
        html += '<div class="score-subtitle">Overall cluster health assessment</div>';
        html += '<span class="score-grade" style="background:' + gradeInfo.bg + ';color:' + gradeInfo.color + '">Grade ' + gradeInfo.grade + ' • ' + gradeInfo.label + '</span>';
        html += '</div>';
        
        // Metrics Panel
        html += '<div class="metrics-panel">';
        var metrics = [
            { label: 'Reliability', value: scores.reliability || 0, icon: 'M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z' },
            { label: 'Security', value: scores.security || 0, icon: 'M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z' },
            { label: 'Cost Efficiency', value: scores.cost || 0, icon: 'M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z' },
            { label: 'Architecture', value: scores.architecture || 0, icon: 'M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10' }
        ];
        
        metrics.forEach(function(m) {
            var color = getScoreColor(m.value);
            html += '<div class="glass-card metric-card">';
            html += '<div class="metric-header">';
            html += '<span class="metric-title">' + m.label + '</span>';
            html += '<div class="metric-icon" style="background:' + color.replace(')', ',0.15)').replace('var(', 'rgba(').replace('--accent-', '') + '">';
            html += '<svg style="color:' + color + '" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="' + m.icon + '"/></svg>';
            html += '</div></div>';
            html += '<div class="metric-value" style="color:' + color + '">' + m.value + '</div>';
            html += '<div class="metric-bar"><div class="metric-bar-fill" style="width:' + m.value + '%;background:' + color + '"></div></div>';
            html += '</div>';
        });
        html += '</div></div>';
        
        // Stats Row
        html += '<div class="stats-row">';
        var stats = [
            { label: 'Total Pods', value: summary.totalPods || 0, color: 'var(--accent-blue)', bg: 'rgba(59,130,246,0.15)', icon: 'M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10' },
            { label: 'Healthy', value: summary.healthyPods || 0, color: 'var(--accent-green)', bg: 'rgba(16,185,129,0.15)', icon: 'M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z' },
            { label: 'Issues', value: summary.unhealthyPods || 0, color: 'var(--accent-red)', bg: 'rgba(239,68,68,0.15)', icon: 'M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z' },
            { label: 'Vulnerabilities', value: vs.total || 0, color: 'var(--accent-orange)', bg: 'rgba(249,115,22,0.15)', icon: 'M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z', onclick: "switchView('vulnerabilities')" },
            { label: 'Compliance', value: cisPct + '%', color: cisPct >= 80 ? 'var(--accent-green)' : 'var(--accent-yellow)', bg: cisPct >= 80 ? 'rgba(16,185,129,0.15)' : 'rgba(245,158,11,0.15)', icon: 'M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z', onclick: "switchView('compliance')" }
        ];
        
        stats.forEach(function(s) {
            html += '<div class="glass-card stat-card"' + (s.onclick ? ' onclick="' + s.onclick + '"' : '') + '>';
            html += '<div class="stat-icon" style="background:' + s.bg + ';color:' + s.color + '">';
            html += '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="' + s.icon + '"/></svg>';
            html += '</div>';
            html += '<div class="stat-value">' + s.value + '</div>';
            html += '<div class="stat-label">' + s.label + '</div>';
            html += '</div>';
        });
        html += '</div>';
        
        // Panels
        html += '<div class="panels">';
        
        // Issues Panel
        html += '<div class="glass-card panel">';
        html += '<div class="panel-header"><span class="panel-title">Active Issues <span class="panel-count">(' + issues.length + ')</span></span></div>';
        html += '<div class="panel-body">';
        if (issues.length > 0) {
            html += '<div class="issues-list">';
            issues.slice(0, 8).forEach(function(issue) {
                html += '<div class="issue-item">';
                html += '<span class="issue-severity ' + issue.severity + '">' + issue.severity + '</span>';
                html += '<div class="issue-content"><div class="issue-title">' + issue.title + '</div><div class="issue-meta">' + issue.category + '</div></div>';
                if (issue.affectedPods) html += '<span class="issue-count">' + issue.affectedPods.length + ' pods</span>';
                html += '</div>';
            });
            html += '</div>';
        } else {
            html += '<div class="empty-state"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><p>No active issues</p></div>';
        }
        html += '</div></div>';
        
        // Vulnerability Chart
        html += '<div class="glass-card panel">';
        html += '<div class="panel-header"><span class="panel-title">Vulnerability Distribution</span></div>';
        html += '<div class="panel-body"><div class="vuln-chart">';
        
        var maxVuln = Math.max(vs.critical || 0, vs.high || 0, vs.medium || 0, vs.low || 0, 1);
        var vulns = [
            { label: 'Critical', value: vs.critical || 0, class: 'critical' },
            { label: 'High', value: vs.high || 0, class: 'high' },
            { label: 'Medium', value: vs.medium || 0, class: 'medium' },
            { label: 'Low', value: vs.low || 0, class: 'low' }
        ];
        
        vulns.forEach(function(v) {
            var pct = Math.max((v.value / maxVuln) * 100, v.value > 0 ? 15 : 0);
            html += '<div class="vuln-row">';
            html += '<span class="vuln-label">' + v.label + '</span>';
            html += '<div class="vuln-bar-bg"><div class="vuln-bar ' + v.class + '" style="width:' + pct + '%">';
            if (v.value > 0) html += '<span class="vuln-bar-value">' + v.value + '</span>';
            html += '</div></div>';
            html += '<span class="vuln-count">' + formatNumber(v.value) + '</span>';
            html += '</div>';
        });
        
        html += '</div></div></div>';
        html += '</div>';
        
        return html;
    }
    
    function renderVulnerabilities() {
        if (!DATA || !DATA.vulnerabilities) return '<div class="empty-state"><p>No vulnerability data</p></div>';
        
        var vs = DATA.vulnerabilities.stats || {};
        var items = DATA.vulnerabilities.items || [];
        
        var html = '<div class="stats-row" style="grid-template-columns: repeat(4, 1fr);">';
        [
            { label: 'Critical', value: vs.critical || 0, color: 'var(--accent-red)', bg: 'rgba(239,68,68,0.15)' },
            { label: 'High', value: vs.high || 0, color: 'var(--accent-orange)', bg: 'rgba(249,115,22,0.15)' },
            { label: 'Medium', value: vs.medium || 0, color: 'var(--accent-yellow)', bg: 'rgba(245,158,11,0.15)' },
            { label: 'Low', value: vs.low || 0, color: 'var(--accent-blue)', bg: 'rgba(59,130,246,0.15)' }
        ].forEach(function(s) {
            html += '<div class="glass-card stat-card">';
            html += '<div class="stat-icon" style="background:' + s.bg + ';color:' + s.color + '">';
            html += '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg></div>';
            html += '<div class="stat-value" style="color:' + s.color + '">' + formatNumber(s.value) + '</div>';
            html += '<div class="stat-label">' + s.label + '</div></div>';
        });
        html += '</div>';
        
        html += '<div class="glass-card panel"><div class="panel-header"><span class="panel-title">All Vulnerabilities <span class="panel-count">(' + (vs.total || 0) + ')</span></span></div>';
        html += '<div class="panel-body"><div class="issues-list">';
        
        if (items.length > 0) {
            items.slice(0, 50).forEach(function(v) {
                html += '<div class="issue-item" onclick="showVulnDetail(\'' + v.cve + '\')">';
                html += '<span class="issue-severity ' + v.severity + '">' + v.severity + '</span>';
                html += '<div class="issue-content"><div class="issue-title" style="font-family:\'SF Mono\',monospace;font-size:13px;">' + v.cve + '</div><div class="issue-meta">' + v.package + '</div></div>';
                if (v.score) html += '<span class="issue-count">' + v.score + '</span>';
                html += '</div>';
            });
        } else {
            html += '<div class="empty-state"><p>No vulnerabilities detected</p></div>';
        }
        
        html += '</div></div></div>';
        return html;
    }
    
    function renderCompliance() {
        if (!DATA || !DATA.cisBenchmark) return '<div class="empty-state"><p>No compliance data</p></div>';
        
        var cs = DATA.cisBenchmark.stats || {};
        var checks = DATA.cisBenchmark.checks || [];
        var total = cs.total || 1;
        var pct = Math.round((cs.pass || 0) / total * 100);
        var color = pct >= 80 ? 'var(--accent-green)' : pct >= 60 ? 'var(--accent-yellow)' : 'var(--accent-red)';
        
        var html = '<div class="stats-row" style="grid-template-columns: repeat(3, 1fr);">';
        html += '<div class="glass-card stat-card"><div class="stat-icon" style="background:rgba(16,185,129,0.15);color:var(--accent-green)"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div><div class="stat-value" style="color:var(--accent-green)">' + (cs.pass || 0) + '</div><div class="stat-label">Passed</div></div>';
        html += '<div class="glass-card stat-card"><div class="stat-icon" style="background:rgba(245,158,11,0.15);color:var(--accent-yellow)"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg></div><div class="stat-value" style="color:var(--accent-yellow)">' + (cs.warn || 0) + '</div><div class="stat-label">Warning</div></div>';
        html += '<div class="glass-card stat-card"><div class="stat-icon" style="background:rgba(239,68,68,0.15);color:var(--accent-red)"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></div><div class="stat-value" style="color:var(--accent-red)">' + (cs.fail || 0) + '</div><div class="stat-label">Failed</div></div>';
        html += '</div>';
        
        html += '<div class="glass-card panel"><div class="panel-header"><span class="panel-title">CIS Benchmark Compliance <span class="panel-count" style="color:' + color + '">' + pct + '%</span></span></div>';
        html += '<div class="panel-body"><div class="issues-list">';
        
        checks.forEach(function(c) {
            var severity = c.status === 'PASS' ? 'low' : c.status === 'FAIL' ? 'critical' : 'medium';
            html += '<div class="issue-item" onclick="showCISDetail(\'' + c.id + '\')">';
            html += '<span class="issue-severity ' + severity + '">' + c.status + '</span>';
            html += '<div class="issue-content"><div class="issue-title">' + c.id + ': ' + c.title + '</div><div class="issue-meta">' + c.category + '</div></div>';
            html += '</div>';
        });
        
        html += '</div></div></div>';
        return html;
    }
    
    function renderWorkloads() {
        if (!DATA || !DATA.allPods) return '<div class="empty-state"><p>No workload data</p></div>';
        
        var pods = DATA.allPods || [];
        var unhealthy = pods.filter(function(p) { return p.phase !== 'Running' || p.restarts >= 5; });
        var healthy = pods.length - unhealthy.length;
        
        var html = '<div class="stats-row" style="grid-template-columns: repeat(3, 1fr);">';
        html += '<div class="glass-card stat-card"><div class="stat-icon" style="background:rgba(59,130,246,0.15);color:var(--accent-blue)"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg></div><div class="stat-value">' + pods.length + '</div><div class="stat-label">Total Pods</div></div>';
        html += '<div class="glass-card stat-card"><div class="stat-icon" style="background:rgba(16,185,129,0.15);color:var(--accent-green)"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div><div class="stat-value" style="color:var(--accent-green)">' + healthy + '</div><div class="stat-label">Healthy</div></div>';
        html += '<div class="glass-card stat-card"><div class="stat-icon" style="background:rgba(239,68,68,0.15);color:var(--accent-red)"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div><div class="stat-value" style="color:var(--accent-red)">' + unhealthy.length + '</div><div class="stat-label">Issues</div></div>';
        html += '</div>';
        
        if (unhealthy.length > 0) {
            html += '<div class="glass-card panel" style="margin-bottom:var(--space-6);"><div class="panel-header"><span class="panel-title" style="color:var(--accent-red);">Unhealthy Workloads</span></div>';
            html += '<div class="panel-body"><div class="issues-list">';
            unhealthy.slice(0, 20).forEach(function(p) {
                html += '<div class="issue-item" onclick="diagnosePod(\'' + p.namespace + '\',\'' + p.name + '\')">';
                html += '<span class="issue-severity critical">' + p.phase + '</span>';
                html += '<div class="issue-content"><div class="issue-title" style="font-family:\'SF Mono\',monospace;">' + p.namespace + '/' + p.name + '</div><div class="issue-meta">Node: ' + p.node + ' • Restarts: ' + p.restarts + '</div></div>';
                html += '</div>';
            });
            html += '</div></div></div>';
        }
        
        html += '<div class="glass-card panel"><div class="panel-header"><span class="panel-title">All Pods</span></div>';
        html += '<div class="panel-body"><div class="issues-list">';
        pods.slice(0, 30).forEach(function(p) {
            var ok = p.phase === 'Running' && p.restarts < 5;
            html += '<div class="issue-item">';
            html += '<span class="issue-severity ' + (ok ? 'low' : 'critical') + '">' + p.phase + '</span>';
            html += '<div class="issue-content"><div class="issue-title" style="font-family:\'SF Mono\',monospace;font-size:12px;">' + p.name + '</div><div class="issue-meta">' + p.namespace + '</div></div>';
            html += '<span class="issue-count">' + p.restarts + '</span>';
            html += '</div>';
        });
        html += '</div></div></div>';
        
        return html;
    }
    
    function renderCleanup() {
        if (!DATA || !DATA.cleanup) return '<div class="empty-state"><p>No cleanup data</p></div>';
        
        var s = DATA.cleanup.summary || {};
        var total = s.total || 0;
        
        var html = '<div class="stats-row" style="grid-template-columns: repeat(4, 1fr);">';
        [
            { label: 'Stale ReplicaSets', value: s.staleReplicaSets || 0, icon: '📦' },
            { label: 'Evicted Pods', value: s.evictedPods || 0, icon: '💀' },
            { label: 'Completed Jobs', value: s.completedJobs || 0, icon: '✅' },
            { label: 'Failed Jobs', value: s.failedJobs || 0, icon: '❌' }
        ].forEach(function(item) {
            html += '<div class="glass-card stat-card">';
            html += '<div style="font-size:32px;margin-bottom:var(--space-2);">' + item.icon + '</div>';
            html += '<div class="stat-value">' + item.value + '</div>';
            html += '<div class="stat-label">' + item.label + '</div></div>';
        });
        html += '</div>';
        
        if (total === 0) {
            html += '<div class="glass-card panel"><div class="panel-body"><div class="empty-state"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><p>Cluster is clean!</p></div></div></div>';
        }
        
        return html;
    }
    
    // ═══════════════════════════════════════════════════════════════════════════
    // MODALS
    // ═══════════════════════════════════════════════════════════════════════════
    
    function showModal(title, html) {
        document.getElementById('modal-title').textContent = title;
        document.getElementById('modal-body').innerHTML = html;
        document.getElementById('modal').classList.add('show');
    }
    
    function closeModal() {
        document.getElementById('modal').classList.remove('show');
    }
    
    function showVulnDetail(cve) {
        var items = DATA.vulnerabilities && DATA.vulnerabilities.items ? DATA.vulnerabilities.items : [];
        var v = items.find(function(x) { return x.cve === cve; });
        if (!v) return;
        
        var html = '<div style="display:flex;gap:var(--space-3);margin-bottom:var(--space-5);">';
        html += '<span class="issue-severity ' + v.severity + '">' + v.severity + '</span>';
        if (v.score) html += '<span style="color:var(--text-tertiary);">CVSS ' + v.score + '</span>';
        html += '</div>';
        html += '<p style="color:var(--text-secondary);margin-bottom:var(--space-5);line-height:1.7;">' + (v.description || 'No description available') + '</p>';
        html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4);">';
        html += '<div class="glass-subtle" style="padding:var(--space-4);border-radius:var(--radius-md);"><div style="font-size:11px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:var(--space-2);">Package</div><code style="color:var(--text-primary);">' + v.package + '</code></div>';
        html += '<div style="padding:var(--space-4);border-radius:var(--radius-md);background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.2);"><div style="font-size:11px;color:var(--accent-green);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:var(--space-2);">Fixed In</div><code style="color:var(--accent-green);">' + (v.fixedVersion || 'N/A') + '</code></div>';
        html += '</div>';
        
        showModal(cve, html);
    }
    
    function showCISDetail(id) {
        var checks = DATA.cisBenchmark && DATA.cisBenchmark.checks ? DATA.cisBenchmark.checks : [];
        var c = checks.find(function(x) { return x.id === id; });
        if (!c) return;
        
        var severity = c.status === 'PASS' ? 'low' : c.status === 'FAIL' ? 'critical' : 'medium';
        var html = '<div style="margin-bottom:var(--space-5);"><span class="issue-severity ' + severity + '">' + c.status + '</span></div>';
        html += '<h3 style="margin-bottom:var(--space-4);font-size:16px;">' + c.title + '</h3>';
        if (c.description) html += '<p style="color:var(--text-secondary);margin-bottom:var(--space-5);line-height:1.7;">' + c.description + '</p>';
        html += '<div class="glass-subtle" style="padding:var(--space-4);border-radius:var(--radius-md);margin-bottom:var(--space-4);"><div style="font-size:11px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:var(--space-2);">Details</div><p style="color:var(--text-secondary);line-height:1.6;">' + c.details + '</p></div>';
        if (c.status !== 'PASS' && c.remediation) {
            html += '<div style="padding:var(--space-4);border-radius:var(--radius-md);background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.2);"><div style="font-size:11px;color:var(--accent-green);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:var(--space-2);">Remediation</div><code style="color:var(--text-primary);font-size:13px;">' + c.remediation + '</code></div>';
        }
        
        showModal('CIS ' + c.id, html);
    }
    
    function diagnosePod(ns, name) {
        showModal('Analyzing...', '<div class="empty-state"><div class="loading-logo" style="width:48px;height:48px;margin:0 auto var(--space-4);"><svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg></div><p>Diagnosing ' + ns + '/' + name + '...</p></div>');
        
        fetch('/api/v1/diagnose/pod', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ namespace: ns, name: name })
        })
        .then(function(r) { return r.json(); })
        .then(function(d) {
            if (d.error) { showModal('Error', '<p style="color:var(--accent-red);">' + d.error + '</p>'); return; }
            var a = d.analysis || {};
            var html = '<div style="padding:var(--space-5);background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);border-radius:var(--radius-lg);margin-bottom:var(--space-5);">';
            html += '<div style="font-weight:600;color:var(--accent-red);margin-bottom:var(--space-2);">' + (a.rootCause || 'Unknown Issue') + '</div>';
            html += '<div style="font-size:13px;color:var(--text-secondary);">' + (a.category || 'unknown') + ' • ' + (a.severity || 'unknown') + '</div></div>';
            if (d.recommendations && d.recommendations.length) {
                html += '<div style="font-weight:600;margin-bottom:var(--space-4);">Recommendations</div>';
                d.recommendations.forEach(function(r, i) {
                    html += '<div class="glass-subtle" style="padding:var(--space-4);border-radius:var(--radius-md);margin-bottom:var(--space-3);">';
                    html += '<div style="font-weight:500;">' + (i+1) + '. ' + r.action + '</div>';
                    html += '<p style="font-size:13px;color:var(--text-secondary);margin-top:var(--space-2);">' + r.detail + '</p>';
                    if (r.command) html += '<code style="display:block;margin-top:var(--space-3);padding:var(--space-3);background:var(--bg-dark);border-radius:var(--radius-sm);font-size:12px;color:var(--accent-green);">' + r.command + '</code>';
                    html += '</div>';
                });
            }
            showModal('Diagnosis: ' + ns + '/' + name, html);
        })
        .catch(function(e) { showModal('Error', '<p style="color:var(--accent-red);">' + e + '</p>'); });
    }
    
    // ═══════════════════════════════════════════════════════════════════════════
    // MAIN
    // ═══════════════════════════════════════════════════════════════════════════
    
    function render() {
        var content = '';
        switch (currentView) {
            case 'overview': content = renderOverview(); break;
            case 'vulnerabilities': content = renderVulnerabilities(); break;
            case 'compliance': content = renderCompliance(); break;
            case 'workloads': content = renderWorkloads(); break;
            case 'cleanup': content = renderCleanup(); break;
            default: content = renderOverview();
        }
        document.getElementById('content').innerHTML = content;
    }
    
    function refresh() { load(); }
    function exportData() { window.open('/api/v1/export?format=json', '_blank'); }
    
    function load() {
        fetch('/api/v1/health')
            .then(function(r) { if (!r.ok) throw new Error('Failed'); return r.json(); })
            .then(function(data) {
                DATA = data;
                document.getElementById('loading').style.display = 'none';
                document.getElementById('cluster-status').textContent = (data.clusterId || 'cluster') + ' • Live';
                initNav();
                render();
            })
            .catch(function(e) {
                console.error(e);
                document.getElementById('loading').innerHTML = '<div style="color:var(--accent-red);">Connection failed</div>';
            });
    }
    
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });
    load();
    setInterval(load, 30000);
    </script>
</body>
</html>
