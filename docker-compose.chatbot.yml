version: "3.8"

services:
  # Chatbot API Server
  chatbot-api:
    build:
      context: ./src/chatbot
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - LLM_ENDPOINT=http://192.168.1.19:8080/v1/chat/completions
      - EMBEDDING_ENDPOINT=http://192.168.1.19:8080/embeddings
    volumes:
      - ./src/chatbot/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock  # For kubectl
      - ~/.kube/config:/root/.kube/config:ro       # Kubernetes config
    networks:
      - chatbot
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      - redis

  # Redis for conversation caching
  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - chatbot
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  chatbot:
    driver: bridge

volumes:
  redis_data:
