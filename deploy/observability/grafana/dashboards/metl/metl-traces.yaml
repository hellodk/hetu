apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-metl-traces
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: hetu
    app.kubernetes.io/managed-by: kubectl
    # Picked up by the kube-prometheus-stack Grafana sidecar.
    grafana_dashboard: "1"
  annotations:
    # Sidecar files this dashboard into the "METL" Grafana folder.
    grafana_folder: "hetu"
data:
  metl-traces-overview.json: |-
    {
      "annotations": {"list": []},
      "editable": true,
      "schemaVersion": 38,
      "version": 1,
      "uid": "metl-traces-overview",
      "title": "METL · Traces Overview",
      "tags": ["metl", "traces", "tempo"],
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "templating": {"list": []},
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Request Rate (req/s)",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "unit": "reqps", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}}},
          "options": {"colorMode": "value", "graphMode": "area", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [
            {"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(rate(cluster_intel_llm_request_total[5m]))", "legendFormat": "req/s"}
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Error Rate",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "unit": "percentunit", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 0.01}, {"color": "red", "value": 0.05}]}}},
          "options": {"colorMode": "background", "graphMode": "area", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [
            {"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(rate(cluster_intel_llm_request_total{status=\"error\"}[5m])) / clamp_min(sum(rate(cluster_intel_llm_request_total[5m])), 1)", "legendFormat": "error rate"}
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Latency p95",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "unit": "s", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 2}, {"color": "red", "value": 10}]}}},
          "options": {"colorMode": "value", "graphMode": "area", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [
            {"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "histogram_quantile(0.95, sum(rate(cluster_intel_llm_request_duration_seconds_bucket[5m])) by (le))", "legendFormat": "p95"}
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Latency p99",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "unit": "s", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 5}, {"color": "red", "value": 20}]}}},
          "options": {"colorMode": "value", "graphMode": "area", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [
            {"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "histogram_quantile(0.99, sum(rate(cluster_intel_llm_request_duration_seconds_bucket[5m])) by (le))", "legendFormat": "p99"}
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Request Latency Percentiles",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 9, "w": 16, "x": 0, "y": 4},
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "unit": "s", "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2}}},
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["mean", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [
            {"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "histogram_quantile(0.50, sum(rate(cluster_intel_llm_request_duration_seconds_bucket[5m])) by (le))", "legendFormat": "p50"},
            {"refId": "B", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "histogram_quantile(0.95, sum(rate(cluster_intel_llm_request_duration_seconds_bucket[5m])) by (le))", "legendFormat": "p95"},
            {"refId": "C", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "histogram_quantile(0.99, sum(rate(cluster_intel_llm_request_duration_seconds_bucket[5m])) by (le))", "legendFormat": "p99"}
          ]
        },
        {
          "id": 6,
          "type": "text",
          "title": "Service Map",
          "gridPos": {"h": 9, "w": 8, "x": 16, "y": 4},
          "options": {"mode": "markdown", "content": "### Service Map / Traces\n\nThe interactive **service graph** and **trace search** live in the **Hetu → LLM Request Traces** dashboard and in **Explore → Tempo**.\n\nTempo is wired with:\n- `tracesToLogs` → **Loki** (jump to logs for a span)\n- `tracesToMetrics` → **Prometheus** (request/error rate)\n- `serviceMap` + `nodeGraph` (built from span metrics)\n\nOpen **Explore**, pick the **Tempo** datasource, and use *Service Graph* to view the live dependency map."}
        }
      ]
    }
