apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-metl-metrics
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: hetu
    app.kubernetes.io/managed-by: kubectl
    # Picked up by the kube-prometheus-stack Grafana sidecar.
    grafana_dashboard: "1"
  annotations:
    # Sidecar files this dashboard into the "METL" Grafana folder.
    grafana_folder: "hetu"
data:
  metl-metrics-overview.json: |-
    {
      "annotations": {"list": []},
      "editable": true,
      "schemaVersion": 38,
      "version": 1,
      "uid": "metl-metrics-overview",
      "title": "METL · Metrics Overview",
      "tags": ["metl", "metrics", "prometheus"],
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "templating": {"list": []},
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Running Pods",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}}},
          "options": {"colorMode": "value", "graphMode": "area", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [
            {"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(kube_pod_status_phase{phase=\"Running\"})", "legendFormat": "running"}
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Ready Nodes",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}}},
          "options": {"colorMode": "value", "graphMode": "area", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [
            {"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})", "legendFormat": "ready"}
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Pending Pods",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}, {"color": "red", "value": 10}]}}},
          "options": {"colorMode": "background", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [
            {"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(kube_pod_status_phase{phase=\"Pending\"})", "legendFormat": "pending"}
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Namespaces",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}}},
          "options": {"colorMode": "value", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [
            {"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "count(kube_namespace_created)", "legendFormat": "namespaces"}
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Cluster CPU Usage (cores)",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "unit": "short", "custom": {"drawStyle": "line", "fillOpacity": 15, "lineWidth": 2}}},
          "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi"}},
          "targets": [
            {"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(rate(container_cpu_usage_seconds_total{container!=\"\"}[5m]))", "legendFormat": "used cores"},
            {"refId": "B", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(machine_cpu_cores)", "legendFormat": "capacity cores"}
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Cluster Memory Working Set (bytes)",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "unit": "bytes", "custom": {"drawStyle": "line", "fillOpacity": 15, "lineWidth": 2}}},
          "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi"}},
          "targets": [
            {"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(container_memory_working_set_bytes{container!=\"\"})", "legendFormat": "used"},
            {"refId": "B", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(machine_memory_bytes)", "legendFormat": "capacity"}
          ]
        }
      ]
    }
