apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-metl-events
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: hetu
    app.kubernetes.io/managed-by: kubectl
    # Picked up by the kube-prometheus-stack Grafana sidecar.
    grafana_dashboard: "1"
  annotations:
    # Sidecar files this dashboard into the "METL" Grafana folder.
    grafana_folder: "hetu"
data:
  metl-events-overview.json: |-
    {
      "annotations": {"list": []},
      "editable": true,
      "schemaVersion": 38,
      "version": 1,
      "uid": "metl-events-overview",
      "title": "METL · Events Overview",
      "tags": ["metl", "events", "kubernetes"],
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "templating": {"list": []},
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Warning Event Rate (/s)",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 4, "w": 8, "x": 0, "y": 0},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 0.1}, {"color": "red", "value": 1}]}}},
          "options": {"colorMode": "background", "graphMode": "area", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [
            {"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(rate(kube_event_count{type=\"Warning\"}[5m])) or sum(rate(cluster_intel_pod_health_total{category=~\"crashloop|oomkilled|failed|evicted\"}[5m]))", "legendFormat": "warning/s"}
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Normal Event Rate (/s)",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 4, "w": 8, "x": 8, "y": 0},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}}},
          "options": {"colorMode": "value", "graphMode": "area", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [
            {"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(rate(kube_event_count{type=\"Normal\"}[5m]))", "legendFormat": "normal/s"}
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Problem Pods (current)",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 4, "w": 8, "x": 16, "y": 0},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}, {"color": "red", "value": 10}]}}},
          "options": {"colorMode": "background", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [
            {"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(cluster_intel_pod_health_total{category=~\"crashloop|oomkilled|failed|evicted|pending\"})", "legendFormat": "problem pods"}
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Event Rate by Type",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 9, "w": 12, "x": 0, "y": 4},
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "unit": "short", "custom": {"drawStyle": "line", "fillOpacity": 15, "lineWidth": 2}}},
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["sum"]}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [
            {"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum by (type) (rate(kube_event_count[5m]))", "legendFormat": "{{type}}"}
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Pod Health Problems by Category (hetu)",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 9, "w": 12, "x": 12, "y": 4},
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "unit": "short", "custom": {"drawStyle": "bars", "fillOpacity": 60, "lineWidth": 1, "stacking": {"group": "A", "mode": "normal"}}}},
          "options": {"legend": {"displayMode": "table", "placement": "right", "showLegend": true, "calcs": ["lastNotNull"]}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [
            {"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum by (category) (cluster_intel_pod_health_total{category=~\"crashloop|oomkilled|failed|evicted|pending\"})", "legendFormat": "{{category}}"}
          ]
        }
      ]
    }
