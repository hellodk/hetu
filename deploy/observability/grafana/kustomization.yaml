apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# All Grafana datasource + dashboard ConfigMaps for the hetu METL stack.
# The kube-prometheus-stack Grafana sidecar discovers these by label and files
# every dashboard into a single Grafana folder via `grafana_folder: "hetu"`.
#
# Endpoints/namespace are driven by contract.yaml — run ./render.sh after
# editing it to regenerate datasources/*.yaml. Keep `namespace` below in sync
# with contract.yaml's monitoringNamespace (where Grafana + its sidecar run).
namespace: monitoring

resources:
  # Datasources (label grafana_datasource: "1") — generated by render.sh
  - datasources/prometheus.yaml
  - datasources/loki.yaml
  - datasources/tempo.yaml
  # App dashboards → Grafana folder "hetu"
  - dashboards/hetu/hetu-cluster-intel.yaml
  - dashboards/hetu/hetu-ollama.yaml
  - dashboards/hetu/hetu-llm-traces.yaml
  # METL pillar overviews → same "hetu" folder
  - dashboards/metl/metl-metrics.yaml
  - dashboards/metl/metl-logs.yaml
  - dashboards/metl/metl-traces.yaml
  - dashboards/metl/metl-events.yaml
