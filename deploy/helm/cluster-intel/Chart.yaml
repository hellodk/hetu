apiVersion: v2
name: cluster-intel
description: Kubernetes Cluster Intelligence Engine — Go collector, Go analyzer, Next.js dashboard
type: application
version: 0.2.0
appVersion: "7.0.0"

maintainers:
  - name: cluster-intel team

dependencies:
  - name: postgresql
    version: "~15"
    repository: https://charts.bitnami.com/bitnami
    condition: stores.postgres.bundled
  - name: redis
    version: "~19"
    repository: https://charts.bitnami.com/bitnami
    condition: stores.redis.bundled
  - name: nats
    version: "~1"
    repository: https://nats-io.github.io/k8s/helm/charts/
    condition: bus.nats.bundled
