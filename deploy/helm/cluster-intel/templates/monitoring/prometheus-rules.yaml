{{- if and .Values.monitoring.enabled .Values.monitoring.alerts.enabled }}
{{/*
PrometheusRule — Ollama + LLM application alerts. Ported verbatim from
manifests/monitoring/alerts/ollama-alerts.yaml. Operators can append extra
rules via monitoring.alerts.extraRules (rendered as an additional group).
*/}}
{{- $ns := include "cluster-intel.monitoringNamespace" . }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ollama-alerts
  namespace: {{ $ns }}
  labels:
    {{- include "cluster-intel.labels" . | nindent 4 }}
    app: ollama
    prometheus: kube-prometheus
spec:
  groups:
    - name: ollama.rules
      rules:
        - alert: OllamaDown
          expr: up{job="ollama"} == 0
          for: 2m
          labels: { severity: critical, team: platform }
          annotations:
            summary: "Ollama service is down"
            description: "Ollama at {{ `{{ $labels.instance }}` }} has been down for more than 2 minutes."
        - alert: OllamaHighLatency
          expr: histogram_quantile(0.95, rate(ollama_request_duration_seconds_bucket[5m])) > 30
          for: 5m
          labels: { severity: warning, team: platform }
          annotations:
            summary: "Ollama request latency is high"
            description: "Ollama P95 latency is {{ `{{ $value | humanizeDuration }}` }} (threshold: 30s)"
        - alert: OllamaCriticalLatency
          expr: histogram_quantile(0.95, rate(ollama_request_duration_seconds_bucket[5m])) > 60
          for: 5m
          labels: { severity: critical, team: platform }
          annotations:
            summary: "Ollama request latency is critically high"
            description: "Ollama P95 latency is {{ `{{ $value | humanizeDuration }}` }} (threshold: 60s). Users are experiencing severe delays."
        - alert: OllamaQueueBacklog
          expr: ollama_queued_requests > 10
          for: 5m
          labels: { severity: warning, team: platform }
          annotations:
            summary: "Ollama request queue is backing up"
            description: "Ollama has {{ `{{ $value }}` }} queued requests."
        - alert: OllamaVRAMWarning
          expr: (ollama_gpu_memory_used_bytes / ollama_gpu_memory_total_bytes) * 100 > 80
          for: 5m
          labels: { severity: warning, team: platform }
          annotations:
            summary: "Ollama VRAM usage is high"
            description: "Ollama GPU memory usage is {{ `{{ $value | printf \"%.1f\" }}` }}%."
        - alert: OllamaVRAMCritical
          expr: (ollama_gpu_memory_used_bytes / ollama_gpu_memory_total_bytes) * 100 > 95
          for: 2m
          labels: { severity: critical, team: platform }
          annotations:
            summary: "Ollama VRAM is nearly exhausted"
            description: "Ollama GPU memory usage is {{ `{{ $value | printf \"%.1f\" }}` }}%. OOM imminent."
        - alert: OllamaNoModelsLoaded
          expr: ollama_models_loaded == 0
          for: 5m
          labels: { severity: warning, team: platform }
          annotations:
            summary: "No Ollama models are loaded"
            description: "Ollama has no models loaded. First request will have high latency."
        - alert: OllamaHighErrorRate
          expr: |
            (
              sum(rate(ollama_requests_total{status="error"}[5m]))
              /
              sum(rate(ollama_requests_total[5m]))
            ) > 0.05
          for: 5m
          labels: { severity: warning, team: platform }
          annotations:
            summary: "Ollama error rate is high"
            description: "Ollama error rate is {{ `{{ $value | humanizePercentage }}` }}."
        - alert: OllamaErrorRateCritical
          expr: |
            (
              sum(rate(ollama_requests_total{status="error"}[5m]))
              /
              sum(rate(ollama_requests_total[5m]))
            ) > 0.20
          for: 3m
          labels: { severity: critical, team: platform }
          annotations:
            summary: "Ollama error rate is critically high"
            description: "Ollama error rate is {{ `{{ $value | humanizePercentage }}` }}. Service is degraded."
    - name: llm-application.rules
      rules:
        - alert: LLMRequestFailureRate
          expr: |
            (
              sum(rate(llm_request_total{status="error"}[5m]))
              /
              sum(rate(llm_request_total[5m]))
            ) > 0.10
          for: 5m
          labels: { severity: warning, team: platform }
          annotations:
            summary: "LLM request failure rate is high"
            description: "Application LLM failure rate is {{ `{{ $value | humanizePercentage }}` }}."
        - alert: LLMSlowResponses
          expr: histogram_quantile(0.95, rate(llm_request_duration_seconds_bucket[5m])) > 45
          for: 10m
          labels: { severity: warning, team: platform }
          annotations:
            summary: "LLM responses are slow"
            description: "LLM P95 response time is {{ `{{ $value | humanizeDuration }}` }}."
        - alert: LLMTokenUsageSpike
          expr: |
            (
              sum(rate(llm_tokens_input_total[5m])) + sum(rate(llm_tokens_output_total[5m]))
            ) > 10000
          for: 10m
          labels: { severity: info, team: platform }
          annotations:
            summary: "High LLM token usage detected"
            description: "Token usage rate is {{ `{{ $value | printf \"%.0f\" }}` }} tokens/5min."
        - alert: LLMNoRequests
          expr: sum(rate(llm_request_total[15m])) == 0
          for: 30m
          labels: { severity: warning, team: platform }
          annotations:
            summary: "No LLM requests in the last 30 minutes"
            description: "The cluster intelligence system hasn't made any LLM requests."
    {{- with .Values.monitoring.alerts.extraRules }}
    - name: cluster-intel-extra.rules
      rules:
        {{- toYaml . | nindent 8 }}
    {{- end }}
{{- end }}
