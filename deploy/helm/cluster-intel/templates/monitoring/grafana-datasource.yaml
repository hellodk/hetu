{{- if and .Values.monitoring.enabled .Values.monitoring.tempo.enabled }}
{{/*
Grafana Tempo datasource. Auto-provisioned by Grafana's sidecar when
labeled `grafana_datasource: "1"`.

Ported from manifests/monitoring/tempo/grafana-datasource.yaml; the
prometheus/loki datasource UIDs are configurable.
*/}}
{{- $ns := include "cluster-intel.monitoringNamespace" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-tempo
  namespace: {{ $ns }}
  labels:
    {{- include "cluster-intel.labels" . | nindent 4 }}
    grafana_datasource: "1"
    app: tempo
data:
  tempo-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Tempo
        type: tempo
        uid: {{ .Values.monitoring.grafana.tempoDatasourceUid | quote }}
        access: proxy
        url: http://tempo.{{ $ns }}.svc:3200
        jsonData:
          httpMethod: GET
          tracesToLogs:
            datasourceUid: loki
            filterBySpanID: true
            filterByTraceID: true
            tags: [service.name]
          tracesToMetrics:
            datasourceUid: {{ .Values.monitoring.grafana.prometheusDatasourceUid | quote }}
            spanStartTimeShift: '-1h'
            spanEndTimeShift: '1h'
            tags:
              - { key: service.name, value: service }
              - { key: http.method,  value: method }
            queries:
              - name: 'Request rate'
                query: 'sum(rate(llm_request_total{$$__tags}[5m]))'
              - name: 'Error rate'
                query: 'sum(rate(llm_request_total{$$__tags,status="error"}[5m])) / sum(rate(llm_request_total{$$__tags}[5m]))'
          serviceMap:
            datasourceUid: {{ .Values.monitoring.grafana.prometheusDatasourceUid | quote }}
          search:
            hide: false
          nodeGraph:
            enabled: true
        isDefault: false
        editable: true
{{- end }}
