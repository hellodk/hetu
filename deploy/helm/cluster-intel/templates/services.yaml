apiVersion: v1
kind: Service
metadata:
  name: {{ include "cluster-intel.fullname" . }}-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-intel.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
    - port: 9090
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "cluster-intel.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: collector
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cluster-intel.fullname" . }}-analyzer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-intel.labels" . | nindent 4 }}
    app.kubernetes.io/component: analyzer
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: http
      protocol: TCP
      name: http
    - port: 9091
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "cluster-intel.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: analyzer
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cluster-intel.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-intel.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  type: {{ .Values.dashboard.service.type | default "ClusterIP" }}
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq (.Values.dashboard.service.type | default "ClusterIP") "NodePort") .Values.dashboard.service.nodePort }}
      nodePort: {{ .Values.dashboard.service.nodePort }}
      {{- end }}
  selector:
    {{- include "cluster-intel.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
