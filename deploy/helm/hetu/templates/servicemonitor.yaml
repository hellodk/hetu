{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "hetu.fullname" . }}-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hetu.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
spec:
  selector:
    matchLabels:
      {{- include "hetu.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: collector
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "hetu.fullname" . }}-analyzer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hetu.labels" . | nindent 4 }}
    app.kubernetes.io/component: analyzer
spec:
  selector:
    matchLabels:
      {{- include "hetu.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: analyzer
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
{{- end }}
