{{- if .Values.chatbot.enabled }}
{{- if .Values.chatbot.rbac.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hetu.fullname" . }}-chatbot
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hetu.labels" . | nindent 4 }}
    app.kubernetes.io/component: chatbot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "hetu.fullname" . }}-chatbot
  labels:
    {{- include "hetu.labels" . | nindent 4 }}
    app.kubernetes.io/component: chatbot
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - events
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "hetu.fullname" . }}-chatbot
  labels:
    {{- include "hetu.labels" . | nindent 4 }}
    app.kubernetes.io/component: chatbot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "hetu.fullname" . }}-chatbot
subjects:
  - kind: ServiceAccount
    name: {{ include "hetu.fullname" . }}-chatbot
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
