apiVersion: v1
kind: Secret
metadata:
  name: hetu-llm-apikey
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hetu.labels" . | nindent 4 }}
    hetu.io/managed: llm-api-key
type: Opaque
# Intentionally NO data block. RBAC cannot authorize a create against a
# resourceNames-scoped rule (the object name is absent from a POST request),
# so the analyzer adopts this empty shell via update instead. Rendering the
# data here would also make helm a competing field manager for the key — the
# same class of conflict as issue #16 on the runtime ConfigMap.
