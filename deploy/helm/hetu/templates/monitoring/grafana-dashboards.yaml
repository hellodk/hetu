{{- if .Values.monitoring.enabled }}
{{/*
Grafana dashboard ConfigMaps. Requires Grafana's sidecar to auto-
provision ConfigMaps with `grafana_dashboard: "1"`.

The JSON blobs are loaded from files bundled with the chart at
dashboards/*.json. Each one is gated by its own toggle.

Grafana folder placement is controlled by the `grafana_folder` annotation
on the ConfigMap (honoured by the kube-prometheus-stack sidecar). By default
all dashboards — the app dashboards and the four METL pillar overviews — land
in a single "hetu" folder (both folder keys point at it in values.yaml).
*/}}
{{- $ns := include "hetu.monitoringNamespace" . }}
{{- $hetuFolder := .Values.monitoring.grafana.folders.hetu }}
{{- $metlFolder := .Values.monitoring.grafana.folders.metl }}

{{- if .Values.monitoring.grafana.dashboards.clusterIntel }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-hetu
  namespace: {{ $ns }}
  labels:
    {{- include "hetu.labels" . | nindent 4 }}
    grafana_dashboard: "1"
  annotations:
    grafana_folder: {{ $hetuFolder | quote }}
data:
  cluster-intel.json: |-
    {{- .Files.Get "dashboards/cluster-intel.json" | nindent 4 }}
{{- end }}

