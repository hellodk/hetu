{{- if and .Values.monitoring.enabled .Values.monitoring.alertmanager.enabled }}
{{- if not .Values.monitoring.alertmanager.slackWebhookSecret.name }}
{{- fail "monitoring.alertmanager.enabled=true requires monitoring.alertmanager.slackWebhookSecret.name (existing secret with the Slack webhook URL)" }}
{{- end }}
{{/*
AlertManager Slack routing template. Requires that the Slack webhook URL
secret already exists in the monitoring namespace — we mount it, we
don't create it.
*/}}
{{- $ns := include "hetu.monitoringNamespace" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config-template
  namespace: {{ $ns }}
  labels:
    {{- include "hetu.labels" . | nindent 4 }}
    app: alertmanager
data:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
      slack_api_url_file: /etc/alertmanager/secrets/{{ .Values.monitoring.alertmanager.slackWebhookSecret.key }}

    route:
      receiver: slack-notifications
      group_by: [alertname, severity, team]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: slack-critical
          match: { severity: critical }
          group_wait: 10s
          repeat_interval: 1h
          continue: true
        - receiver: slack-warnings
          match: { severity: warning }
          group_wait: 1m
          repeat_interval: 4h
          continue: true
        - receiver: slack-ollama
          match_re: { alertname: "^Ollama.*" }
          continue: true
        - receiver: slack-llm
          match_re: { alertname: "^LLM.*" }
          continue: true

    inhibit_rules:
      - source_match: { severity: critical }
        target_match: { severity: warning }
        equal: [alertname]
      - source_match: { alertname: OllamaDown }
        target_match_re: { alertname: "^Ollama.*" }
        equal: [instance]

    receivers:
      - name: slack-notifications
        slack_configs:
          - channel: {{ .Values.monitoring.alertmanager.channels.warning | quote }}
            title: '{{ `{{ template "slack.title" . }}` }}'
            text:  '{{ `{{ template "slack.text" . }}` }}'
      - name: slack-critical
        slack_configs:
          - channel: {{ .Values.monitoring.alertmanager.channels.critical | quote }}
            color: danger
            title: '{{ `{{ template "slack.title" . }}` }}'
            text:  '{{ `{{ template "slack.text" . }}` }}'
      - name: slack-warnings
        slack_configs:
          - channel: {{ .Values.monitoring.alertmanager.channels.warning | quote }}
            color: warning
            title: '{{ `{{ template "slack.title" . }}` }}'
            text:  '{{ `{{ template "slack.text" . }}` }}'
      - name: slack-ollama
        slack_configs:
          - channel: {{ .Values.monitoring.alertmanager.channels.ollama | quote }}
            title: '{{ `{{ template "slack.title" . }}` }}'
            text:  '{{ `{{ template "slack.text" . }}` }}'
      - name: slack-llm
        slack_configs:
          - channel: {{ .Values.monitoring.alertmanager.channels.llm | quote }}
            title: '{{ `{{ template "slack.title" . }}` }}'
            text:  '{{ `{{ template "slack.text" . }}` }}'
{{- end }}
