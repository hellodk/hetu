{{- if and .Values.monitoring.enabled .Values.monitoring.alerts.enabled }}
{{/*
PrometheusRule — hetu LLM client alerts.

All rules are based on hetu's OWN client-side metrics (cluster_intel_llm_*),
NOT on scraping an Ollama/vLLM server. hetu never scrapes the model server, so
there are no `ollama_*` series, no `up{job="ollama"}`, and no GPU/VRAM/queue
server gauges to alert on. Provider-specific rules filter on the `provider`
label (e.g. provider="ollama").

Operators can append extra rules via monitoring.alerts.extraRules (rendered as
an additional group).
*/}}
{{- $ns := include "hetu.monitoringNamespace" . }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ollama-alerts
  namespace: {{ $ns }}
  labels:
    {{- include "hetu.labels" . | nindent 4 }}
    app: ollama
    prometheus: kube-prometheus
spec:
  groups:
    - name: llm-provider-ollama.rules
      rules:
        - alert: OllamaProviderUnreachable
          expr: sum(rate(cluster_intel_llm_errors_total{provider="ollama",error_type="connection_refused"}[5m])) > 0
          for: 2m
          labels: { severity: critical, team: platform }
          annotations:
            summary: "Ollama provider appears unreachable"
            description: "hetu is seeing connection_refused errors when calling the Ollama provider for more than 2 minutes. The Ollama endpoint may be down or misconfigured."
        - alert: OllamaHighLatency
          expr: histogram_quantile(0.95, sum by (le) (rate(cluster_intel_llm_request_duration_seconds_bucket{provider="ollama"}[5m]))) > 30
          for: 5m
          labels: { severity: warning, team: platform }
          annotations:
            summary: "Ollama request latency is high"
            description: "hetu's P95 LLM latency for the Ollama provider is {{ `{{ $value | humanizeDuration }}` }} (threshold: 30s)"
        - alert: OllamaCriticalLatency
          expr: histogram_quantile(0.95, sum by (le) (rate(cluster_intel_llm_request_duration_seconds_bucket{provider="ollama"}[5m]))) > 60
          for: 5m
          labels: { severity: critical, team: platform }
          annotations:
            summary: "Ollama request latency is critically high"
            description: "hetu's P95 LLM latency for the Ollama provider is {{ `{{ $value | humanizeDuration }}` }} (threshold: 60s). Users are experiencing severe delays."
        - alert: OllamaHighErrorRate
          expr: |
            (
              sum(rate(cluster_intel_llm_request_total{provider="ollama",status="error"}[5m]))
              /
              sum(rate(cluster_intel_llm_request_total{provider="ollama"}[5m]))
            ) > 0.05
          for: 5m
          labels: { severity: warning, team: platform }
          annotations:
            summary: "Ollama error rate is high"
            description: "hetu's LLM error rate for the Ollama provider is {{ `{{ $value | humanizePercentage }}` }}."
        - alert: OllamaErrorRateCritical
          expr: |
            (
              sum(rate(cluster_intel_llm_request_total{provider="ollama",status="error"}[5m]))
              /
              sum(rate(cluster_intel_llm_request_total{provider="ollama"}[5m]))
            ) > 0.20
          for: 3m
          labels: { severity: critical, team: platform }
          annotations:
            summary: "Ollama error rate is critically high"
            description: "hetu's LLM error rate for the Ollama provider is {{ `{{ $value | humanizePercentage }}` }}. Service is degraded."
    - name: llm-application.rules
      rules:
        - alert: LLMRequestFailureRate
          expr: |
            (
              sum(rate(cluster_intel_llm_request_total{status="error"}[5m]))
              /
              sum(rate(cluster_intel_llm_request_total[5m]))
            ) > 0.10
          for: 5m
          labels: { severity: warning, team: platform }
          annotations:
            summary: "LLM request failure rate is high"
            description: "Application LLM failure rate is {{ `{{ $value | humanizePercentage }}` }}."
        - alert: LLMSlowResponses
          expr: histogram_quantile(0.95, sum by (le) (rate(cluster_intel_llm_request_duration_seconds_bucket[5m]))) > 45
          for: 10m
          labels: { severity: warning, team: platform }
          annotations:
            summary: "LLM responses are slow"
            description: "LLM P95 response time is {{ `{{ $value | humanizeDuration }}` }}."
        - alert: LLMErrorSpike
          expr: sum(rate(cluster_intel_llm_errors_total[5m])) > 1
          for: 5m
          labels: { severity: warning, team: platform }
          annotations:
            summary: "LLM error spike detected"
            description: "hetu is emitting {{ `{{ $value | printf \"%.2f\" }}` }} LLM errors/sec across all providers."
        - alert: LLMTokenUsageSpike
          expr: |
            (
              sum(rate(cluster_intel_llm_tokens_input_total[5m])) + sum(rate(cluster_intel_llm_tokens_output_total[5m]))
            ) > 10000
          for: 10m
          labels: { severity: info, team: platform }
          annotations:
            summary: "High LLM token usage detected"
            description: "Token usage rate is {{ `{{ $value | printf \"%.0f\" }}` }} tokens/sec."
        - alert: LLMNoRequests
          expr: sum(rate(cluster_intel_llm_request_total[15m])) == 0
          for: 30m
          labels: { severity: warning, team: platform }
          annotations:
            summary: "No LLM requests in the last 30 minutes"
            description: "The cluster intelligence system hasn't made any LLM requests."
    {{- with .Values.monitoring.alerts.extraRules }}
    - name: hetu-extra.rules
      rules:
        {{- toYaml . | nindent 8 }}
    {{- end }}
{{- end }}
