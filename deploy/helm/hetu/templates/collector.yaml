apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hetu.fullname" . }}-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hetu.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
spec:
  replicas: {{ .Values.collector.replicas }}
  selector:
    matchLabels:
      {{- include "hetu.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: collector
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print .Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "hetu.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: collector
    spec:
      serviceAccountName: hetu
      securityContext:
        {{- include "hetu.podSecurityContext" (dict "top" .Values.podSecurityContext "override" (default dict .Values.collector.podSecurityContext)) | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.affinity .Values.collector.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.topologySpreadConstraints .Values.collector.topologySpreadConstraints) }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.nodeSelector .Values.collector.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.collector.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.collector.dnsPolicy }}
      dnsPolicy: {{ . }}
      {{- end }}
      containers:
        - name: collector
          image: "{{ .Values.collector.image.repository }}:{{ .Values.collector.image.tag }}"
          imagePullPolicy: {{ .Values.collector.image.pullPolicy }}
          securityContext:
            {{- include "hetu.securityContext" (dict "top" .Values.securityContext "override" .Values.collector.securityContext) | nindent 12 }}
          env:
            - name: CI_CONFIG
              value: /etc/hetu/config.yaml
            - name: CI_COLLECTOR_PROMETHEUS_URL
              value: {{ .Values.collector.prometheusUrl | quote }}
            - name: ENABLE_PODLOGS
              value: {{ .Values.collector.podlogs.enabled | quote }}
            - name: WATCH_NAMESPACES
              value: {{ .Values.collector.podlogs.watchNamespaces | quote }}
            - name: ENABLE_LBLOGS
              value: {{ .Values.collector.lblogs.enabled | quote }}
            - name: DELIVERY_MODE
              value: {{ .Values.collector.lblogs.deliveryMode | quote }}
            {{- if .Values.collector.lblogs.awsRegion }}
            - name: AWS_REGION
              value: {{ .Values.collector.lblogs.awsRegion | quote }}
            {{- end }}
            {{- if .Values.collector.lblogs.cwLogGroups }}
            - name: CW_LOG_GROUPS
              value: {{ .Values.collector.lblogs.cwLogGroups | quote }}
            {{- end }}
            {{- if .Values.collector.lblogs.lbConfigs }}
            - name: LB_CONFIGS
              value: {{ .Values.collector.lblogs.lbConfigs | quote }}
            {{- end }}
            - name: ANALYZER_URL
              value: "http://{{ include "hetu.fullname" . }}-analyzer:8081"
            {{- with .Values.collector.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/hetu
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: hetu-config
