apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hetu.fullname" . }}-analyzer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hetu.labels" . | nindent 4 }}
    app.kubernetes.io/component: analyzer
spec:
  replicas: {{ .Values.analyzer.replicas }}
  selector:
    matchLabels:
      {{- include "hetu.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: analyzer
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print .Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "hetu.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: analyzer
    spec:
      serviceAccountName: hetu
      securityContext:
        {{- include "hetu.podSecurityContext" (dict "top" .Values.podSecurityContext "override" (default dict .Values.analyzer.podSecurityContext)) | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.affinity .Values.analyzer.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.topologySpreadConstraints .Values.analyzer.topologySpreadConstraints) }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: analyzer
          image: "{{ .Values.analyzer.image.repository }}:{{ .Values.analyzer.image.tag }}"
          imagePullPolicy: {{ .Values.analyzer.image.pullPolicy }}
          securityContext:
            {{- include "hetu.securityContext" (dict "top" .Values.securityContext "override" .Values.analyzer.securityContext) | nindent 12 }}
          env:
            - name: CI_CONFIG
              value: /etc/hetu/config.yaml
            - name: CI_CONFIG_OVERRIDE
              value: /etc/hetu-runtime/runtime.yaml
            {{- with .Values.analyzer.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 9091
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.analyzer.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/hetu
              readOnly: true
            - name: runtime-config
              mountPath: /etc/hetu-runtime
              readOnly: true
            {{- if .Values.stores.postgres.external.existingSecret }}
            - name: postgres-secret
              mountPath: /etc/hetu/secrets/postgres
              readOnly: true
            {{- end }}
            {{- if .Values.stores.redis.external.existingSecret }}
            - name: redis-secret
              mountPath: /etc/hetu/secrets/redis
              readOnly: true
            {{- end }}
            {{- if .Values.llm.apiKeySecret.name }}
            - name: llm-secret
              mountPath: /etc/hetu/secrets/llm
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: hetu-config
        - name: runtime-config
          configMap:
            name: hetu-runtime
            optional: true
        {{- if .Values.stores.postgres.external.existingSecret }}
        - name: postgres-secret
          secret:
            secretName: {{ .Values.stores.postgres.external.existingSecret }}
            items:
              - key: {{ .Values.stores.postgres.external.existingSecretPasswordKey }}
                path: password
        {{- end }}
        {{- if .Values.stores.redis.external.existingSecret }}
        - name: redis-secret
          secret:
            secretName: {{ .Values.stores.redis.external.existingSecret }}
            items:
              - key: password
                path: password
        {{- end }}
        {{- if .Values.llm.apiKeySecret.name }}
        - name: llm-secret
          secret:
            secretName: {{ .Values.llm.apiKeySecret.name }}
            items:
              - key: {{ .Values.llm.apiKeySecret.key }}
                path: api-key
        {{- end }}
