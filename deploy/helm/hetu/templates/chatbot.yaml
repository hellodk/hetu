{{- if .Values.chatbot.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hetu.fullname" . }}-chatbot
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hetu.labels" . | nindent 4 }}
    app.kubernetes.io/component: chatbot
spec:
  replicas: {{ .Values.chatbot.replicas }}
  selector:
    matchLabels:
      {{- include "hetu.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: chatbot
  template:
    metadata:
      labels:
        {{- include "hetu.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: chatbot
    spec:
      {{- if .Values.chatbot.serviceAccount.create }}
      serviceAccountName: {{ include "hetu.fullname" . }}-chatbot
      {{- end }}
      securityContext:
        {{- include "hetu.podSecurityContext" (dict "top" .Values.podSecurityContext "override" (default dict .Values.chatbot.podSecurityContext)) | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.affinity .Values.chatbot.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.topologySpreadConstraints .Values.chatbot.topologySpreadConstraints) }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: chatbot
          image: "{{ .Values.chatbot.image.repository }}:{{ .Values.chatbot.image.tag }}"
          imagePullPolicy: {{ .Values.chatbot.image.pullPolicy }}
          securityContext:
            {{- include "hetu.securityContext" (dict "top" .Values.securityContext "override" (default dict .Values.chatbot.securityContext)) | nindent 12 }}
          env:
            - name: LLM_ENDPOINT
              value: {{ .Values.chatbot.llm.endpoint | quote }}
            - name: LLM_MODEL
              value: {{ .Values.chatbot.llm.model | quote }}
            - name: LLM_PROVIDER
              value: {{ .Values.chatbot.llm.provider | quote }}
            - name: EMBEDDING_ENDPOINT
              value: {{ .Values.chatbot.llm.embeddingEndpoint | quote }}
            - name: EMBEDDING_MODEL
              value: {{ .Values.chatbot.llm.embeddingModel | quote }}
            - name: OIDC_ISSUER
              value: {{ .Values.chatbot.oidc.issuer | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.chatbot.oidc.clientId | quote }}
            - name: OIDC_AUDIENCE
              value: {{ .Values.chatbot.oidc.audience | quote }}
            - name: AUTH_ENABLED
              value: {{ .Values.chatbot.oidc.authEnabled | toString | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.chatbot.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.chatbot.otel.serviceName | quote }}
            {{- with .Values.chatbot.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.chatbot.resources | nindent 12 }}
          volumeMounts:
            - name: kubeconfig
              mountPath: /root/.kube
              readOnly: true
      volumes:
        - name: kubeconfig
          secret:
            secretName: {{ include "hetu.fullname" . }}-kubeconfig
            optional: true
{{- end }}
