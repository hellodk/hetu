{{- include "hetu.validate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: hetu-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hetu.labels" . | nindent 4 }}
data:
  config.yaml: |
    cluster:
      id: {{ .Values.cluster.id | quote }}
      displayName: {{ include "hetu.displayName" . | quote }}

    analyzer:
      collectorUrl: {{ .Values.analyzer.collectorUrl | quote }}
      {{- if .Values.analyzer.prometheusUrl }}
      prometheusUrl: {{ .Values.analyzer.prometheusUrl | quote }}
      {{- end }}
      corsAllowedOrigins:
        {{- toYaml .Values.analyzer.corsAllowedOrigins | nindent 8 }}

    stores:
      postgres:
        enabled: true
        host: {{ include "hetu.postgres.host" . | quote }}
        port: {{ include "hetu.postgres.port" . }}
        database: {{ .Values.stores.postgres.external.db | quote }}
        user: {{ .Values.stores.postgres.external.user | quote }}
        sslMode: {{ .Values.stores.postgres.sslMode | quote }}
        {{- if or .Values.stores.postgres.standalone .Values.stores.postgres.external.existingSecret }}
        passwordFile: /etc/hetu/secrets/postgres/password
        {{- else if .Values.stores.postgres.external.password }}
        password: {{ .Values.stores.postgres.external.password | quote }}
        {{- end }}

      redis:
        enabled: true
        addr: {{ include "hetu.redis.addr" . | quote }}
        {{- if .Values.stores.redis.external.existingSecret }}
        passwordFile: /etc/hetu/secrets/redis/password
        {{- end }}

    bus:
      nats:
        enabled: true
        url: {{ include "hetu.nats.url" . | quote }}

    llm:
      provider: {{ .Values.llm.provider | quote }}
      {{- if .Values.llm.endpoint }}
      endpoint: {{ .Values.llm.endpoint | quote }}
      {{- end }}
      model: {{ .Values.llm.model | quote }}
      {{- if .Values.llm.apiKeySecret.name }}
      apiKeyFile: /etc/hetu/secrets/llm/api-key
      {{- end }}
      maxTokens: {{ .Values.llm.maxTokens }}
      temperature: {{ .Values.llm.temperature }}
      dailyTokenBudget: {{ .Values.llm.dailyTokenBudget }}

    logging:
      level: {{ .Values.logging.level | quote }}
      format: {{ .Values.logging.format | quote }}
