# values-local.yaml — operator overrides for a single-node home-lab cluster.
#
# Copy and fill in every REQUIRED value before deploying:
#   helm upgrade --install cluster-intel deploy/helm/cluster-intel/ \
#     --namespace cluster-intel --create-namespace \
#     -f deploy/helm/values-local.yaml --wait
#
# Helm will refuse to install if any REQUIRED value is left blank.

# ── Cluster identity (REQUIRED) ───────────────────────────────────────────────
cluster:
  id: ""            # REQUIRED  e.g. "homelab" | "prod-eu-1"
  displayName: ""   # Optional; defaults to cluster.id

# ── LLM (all three REQUIRED for self-hosted) ──────────────────────────────────
llm:
  provider: ollama  # ollama | anthropic | openai
  endpoint: ""      # REQUIRED for ollama/openai  e.g. "http://192.168.1.10:11434"
  model: ""         # REQUIRED  e.g. "llama3.2" | "Qwen2.5-Coder:14B-Instruct"
  maxTokens: 4096
  dailyTokenBudget: 1000000
  apiKeySecret:
    name: ""        # Leave blank for Ollama; create a Secret for Anthropic/OpenAI

# ── Dashboard access ──────────────────────────────────────────────────────────
dashboard:
  image:
    tag: "7.0.0"
  service:
    type: NodePort
    nodePort: null  # REQUIRED when type=NodePort  e.g. 30303

# ── Images ────────────────────────────────────────────────────────────────────
collector:
  image:
    tag: "7.0.0"

analyzer:
  image:
    tag: "7.0.0"

# ── NATS — disable debug sidecar not needed in production ─────────────────────
nats:
  natsBox:
    enabled: false

# ── Monitoring — reuse existing kube-prometheus-stack ────────────────────────
monitoring:
  enabled: false

# ── Stores — official images; NFS default StorageClass used for PVCs ─────────
stores:
  postgres:
    bundled: false
    standalone: true
    image:
      repository: postgres
      tag: "16-alpine"
    external:
      db: cluster_intel
      user: cluster_intel
      password: ""   # auto-generated on first install; preserved on upgrade

  redis:
    bundled: false
    standalone: true
    image:
      repository: redis
      tag: "7-alpine"

# ── Ingress — fill in if an IngressClass is available ────────────────────────
ingress:
  enabled: false
  # className: nginx
  # host: cluster-intel.example.com
