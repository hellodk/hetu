# nginx reverse-proxy config for abc.com
# Hosts Hetu at /hetu alongside other apps (Grafana, etc.)
#
# Place in /etc/nginx/sites-available/abc.com and symlink to sites-enabled/,
# or include from your main nginx.conf.
#
# Assumes:
#   - Hetu dashboard NodePort reachable at 127.0.0.1:30303
#   - Hetu analyzer reachable at 127.0.0.1:30808 (optional — only if you want
#     direct API access; the dashboard already proxies /hetu/api/v1/*)
#   - SSL certificates already in place (adjust paths below)

# ── Upstreams ────────────────────────────────────────────────────────────────

upstream hetu_dashboard {
    server 127.0.0.1:30303;
    keepalive 32;
}

# Uncomment if you need a separate Grafana upstream
# upstream grafana {
#     server 127.0.0.1:3000;
#     keepalive 16;
# }

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────

server {
    listen      80;
    listen      [::]:80;
    server_name abc.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Main HTTPS server ────────────────────────────────────────────────────────

server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name abc.com;

    # ── TLS ────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/abc.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/abc.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security headers ───────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff                                always;
    add_header Referrer-Policy           strict-origin-when-cross-origin        always;

    # ── Hetu (/hetu) ───────────────────────────────────────────────────────
    #
    # With basePath='/hetu' in next.config.js, Next.js serves everything
    # (pages, _next/static, api routes) under /hetu — a single location
    # block is all that's needed.
    #
    location /hetu {
        proxy_pass         http://hetu_dashboard;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket + SSE (live health stream at /hetu/api/v1/health/stream)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        # SSE requires disabled buffering and a long read timeout
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }

    # ── Grafana (/grafana) — example, adjust port as needed ───────────────
    # location /grafana {
    #     proxy_pass         http://grafana;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Host              $host;
    #     proxy_set_header   X-Real-IP         $remote_addr;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $scheme;
    # }

    # ── Default ────────────────────────────────────────────────────────────
    location / {
        return 404;
    }
}

# ── WebSocket upgrade map (add once in http {} block if not already there) ──
# Put this in /etc/nginx/conf.d/websocket.conf or your main nginx.conf:
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
