    def worker():
        init_db()
        if not init_k8s():print("[Worker] K8s init failed");return
        while True:
            try:
                print(f"\n[{datetime.now(timezone.utc).isoformat()}] Scanning...")
                pod_health=collect_pod_health()
                with lock:state["pod_health"]=pod_health
                
                data=collect_cluster_data()
                if data:
                    vulns=get_trivy_vulns()or scan_fallback(data["images"])
                    cis=run_cis_checks(data["pods"])
                    analysis=analyze_cluster(data,vulns,cis)
                    report=build_report(data,analysis,vulns,cis)
                    
                    resources=analyze_resources(data["pods"])
                    
                    with lock:
                        state["report"]=report
                        state["resources"]=resources
                    
                    save_history(analysis["scores"],len(vulns),report["cisBenchmark"]["stats"])
                    check_and_send_alerts(report,pod_health,resources)
                
                ph=pod_health["summary"]if pod_health else{}
                res=state.get("resources",{}).get("summary",{})
                print(f"[{datetime.now(timezone.utc).isoformat()}] Done. Unhealthy:{ph.get('total',0)} Over:{res.get('over_provisioned',0)} Under:{res.get('under_provisioned',0)}")
            except Exception as e:
                import traceback;traceback.print_exc()
            time.sleep(CFG["interval"])
    
