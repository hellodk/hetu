    llm_cache={}
    
    def get_model_for_task(task_type):
        """Get the best model for a specific task type."""
        task_models=CFG.get("llm_models",{})
        model=task_models.get(task_type,"")
        if model:
            return model
        return CFG["llm_model"]
    
    def call_llm(prompt,max_tokens=1000,task_type=None):
        """Call LLM API with task-specific model selection."""
        if not CFG["llm_provider"]or not CFG["llm_api_key"]:
            return None
        
        # Select model based on task type
        model=get_model_for_task(task_type)if task_type else CFG["llm_model"]
        
        # Check cache
        cache_key=hashlib.md5((prompt+model).encode()).hexdigest()
        if cache_key in llm_cache:
            cached=llm_cache[cache_key]
            if time.time()-cached["time"]<300:
                return cached["response"]
        
        # Build request
        if CFG["llm_provider"]=="openai":
            url=CFG.get("llm_base_url","https://api.openai.com/v1")+"/chat/completions"
        elif CFG["llm_provider"]=="anthropic":
            url="https://api.anthropic.com/v1/messages"
        elif CFG["llm_provider"]=="ollama":
            url=CFG.get("llm_base_url","http://localhost:11434")+"/api/chat"
        else:
            url=CFG.get("llm_base_url","")+"/chat/completions"
        
        headers={"Content-Type":"application/json"}
        
        if CFG["llm_provider"]=="ollama":
            payload={"model":model,"messages":[{"role":"user","content":prompt}],"stream":False}
            print(f"[LLM] Using model: {model} for task: {task_type or 'default'}")
        elif CFG["llm_provider"]=="anthropic":
            headers["x-api-key"]=CFG["llm_api_key"]
            headers["anthropic-version"]="2023-06-01"
            payload={"model":CFG["llm_model"],"max_tokens":max_tokens,"messages":[{"role":"user","content":prompt}]}
        else:
            headers["Authorization"]=f"Bearer {CFG['llm_api_key']}"
            payload={"model":CFG["llm_model"],"messages":[{"role":"user","content":prompt}],"max_tokens":max_tokens,"temperature":0.3}
        
        try:
            req=Request(url,data=json.dumps(payload).encode(),headers=headers)
            with urlopen(req,timeout=60)as r:
                data=json.loads(r.read())
                if CFG["llm_provider"]=="ollama":
                    response=data.get("message",{}).get("content","")
                elif CFG["llm_provider"]=="anthropic":
                    response=data.get("content",[{}])[0].get("text","")
                else:
                    response=data.get("choices",[{}])[0].get("message",{}).get("content","")
                llm_cache[cache_key]={"time":time.time(),"response":response}
                return response
        except Exception as e:
            print(f"[LLM] Error: {e}")
            return None
    
    def analyze_with_llm(context_type,context_data):
        """Use LLM for intelligent analysis with task-specific model selection."""
        prompts={
            "root_cause":f"""Analyze these Kubernetes pod events and determine the root cause of the failure.
    Return a JSON response with: {{"root_cause": "...", "confidence": 0-1, "recommendations": ["...", "..."]}}
    
    Context:
    {json.dumps(context_data,indent=2)}""",
            
            "security":f"""Assess the security implications of these Kubernetes vulnerabilities and CIS benchmark failures.
    Return a JSON response with: {{"risk_level": "critical/high/medium/low", "summary": "...", "top_actions": ["...", "..."]}}
    
    Context:
    {json.dumps(context_data,indent=2)}""",
            
            "optimization":f"""Based on this resource usage data, recommend optimizations.
    Return a JSON response with: {{"potential_savings": "...", "recommendations": ["...", "..."], "priority_fixes": ["...", "..."]}}
    
    Context:
    {json.dumps(context_data,indent=2)}""",
            
            "code":f"""Analyze this Kubernetes configuration and suggest fixes or improvements.
    Return a JSON response with: {{"issues": ["...", "..."], "fixes": ["...", "..."], "yaml_patches": ["...", "..."]}}
    
    Context:
    {json.dumps(context_data,indent=2)}"""
        }
        
        prompt=prompts.get(context_type)
        if not prompt:return None
        
        response=call_llm(prompt,task_type=context_type)
        if not response:return None
        
        # Try to parse JSON from response
        try:
            # Find JSON in response
            start=response.find('{')
            end=response.rfind('}')+1
            if start>=0 and end>start:
                return json.loads(response[start:end])
        except:pass
        
        return {"raw_response":response}
    
    def get_ai_insights():
        """Generate AI insights for the current cluster state."""
        if not CFG["llm_provider"]:
            return {"enabled":False,"message":"LLM not configured"}
        
        report=state.get("report")
        ph=state.get("pod_health")
        res=state.get("resources")
        
        insights=[]
        
        # Security insight
        if report:
            vs=report.get("vulnerabilities",{}).get("stats",{})
            cs=report.get("cisBenchmark",{}).get("stats",{})
            if vs.get("critical",0)>0 or cs.get("fail",0)>3:
                result=analyze_with_llm("security",{"vulnerabilities":vs,"cis":cs})
                if result:
                    insights.append({"type":"security","analysis":result})
        
        # Resource insight
        if res and res.get("summary",{}).get("over_provisioned",0)>5:
            result=analyze_with_llm("optimization",{"summary":res["summary"],"samples":res["over_provisioned"][:5]})
            if result:
                insights.append({"type":"optimization","analysis":result})
        
        return {"enabled":True,"insights":insights}
    
