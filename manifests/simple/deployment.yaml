    def collect_pod_health():
        if not core_api:return None
        categories={k:[]for k in["evicted","failed","pending","crashloop","imagepull","oomkilled","terminating","completed","error","configerror","unknown"]}
        try:
            for p in core_api.list_pod_for_all_namespaces(limit=1000).items:
                cat=categorize_pod(p)
                if cat=="running":continue
                owner=p.metadata.owner_references[0]if p.metadata.owner_references else None
                restarts=sum(cs.restart_count for cs in(p.status.container_statuses or[]))
                last_status=None
                for cs in(p.status.container_statuses or[]):
                    if cs.state.terminated:last_status={"exitCode":cs.state.terminated.exit_code,"reason":cs.state.terminated.reason}
                    elif cs.state.waiting:last_status={"reason":cs.state.waiting.reason}
                events=get_pod_events(p.metadata.namespace,p.metadata.name)if cat in["pending","failed","crashloop","oomkilled","configerror","imagepull"]else[]
                # Analyze root cause based on category
                if cat=="pending":
                    root_cause=analyze_pending_reason(events)
                elif cat in["crashloop","oomkilled"]:
                    root_cause=analyze_crashloop_reason(p,events,last_status)
                elif cat=="imagepull":
                    root_cause={"reason":"Image Pull Failed","detail":"Cannot pull container image","remediation":"imagepull"}
                elif cat=="configerror":
                    root_cause={"reason":"Config Error","detail":"ConfigMap or Secret missing","remediation":"configerror"}
                else:
                    root_cause=None
                # Get remediation for this category
                remediation=REMEDIATIONS.get(root_cause.get("remediation") if root_cause else None) or REMEDIATIONS.get(cat)
                categories[cat].append({
                    "name":p.metadata.name,"namespace":p.metadata.namespace,"category":cat,"phase":p.status.phase,
                    "reason":p.status.reason,"node":p.spec.node_name or"","age":get_age(p.metadata.creation_timestamp),
                    "ageSeconds":get_age_seconds(p.metadata.creation_timestamp),"restarts":restarts,
                    "owner":{"kind":owner.kind,"name":owner.name}if owner else None,
                    "lastStatus":last_status,"events":events[:3],"rootCause":root_cause,
                    "remediation":remediation,
                    "protected":is_protected(p.metadata.namespace),"safeToDelete":cat in["evicted","completed","failed"]and not is_protected(p.metadata.namespace)
                })
        except Exception as e:print(f"[PodHealth] {e}")
        summary={k:len(v)for k,v in categories.items()}
        summary["total"]=sum(summary.values())
        return{"timestamp":datetime.now(timezone.utc).isoformat()+"Z","summary":summary,"categories":categories,"actionLog":get_action_log(20)}
    
