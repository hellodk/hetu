        css="body{font-family:Arial,sans-serif;margin:40px;color:#333}h1{color:#2563eb;border-bottom:2px solid #2563eb;padding-bottom:10px}h2{color:#374151;margin-top:30px}.summary{display:flex;gap:20px;margin:20px 0}.summary-card{background:#f3f4f6;padding:20px;border-radius:8px;text-align:center;flex:1}.summary-card.savings{background:#dcfce7}.summary-card h3{margin:0;font-size:24px}.summary-card p{margin:5px 0 0;color:#6b7280}table{width:100%;border-collapse:collapse;margin:15px 0;font-size:12px}th,td{border:1px solid #e5e7eb;padding:8px;text-align:left}th{background:#f9fafb;font-weight:600}.over{background:#fef3c7}.under{background:#fee2e2}.nolim{background:#fecaca}.optimal{background:#d1fae5}.issues{color:#dc2626;font-size:11px}.recommended{color:#059669;font-weight:600}.yaml{background:#1e293b;color:#4ade80;padding:15px;border-radius:8px;font-family:monospace;font-size:11px;white-space:pre;overflow-x:auto}.footer{margin-top:40px;padding-top:20px;border-top:1px solid #e5e7eb;color:#6b7280;font-size:12px}@media print{.no-print{display:none}body{margin:20px}}"
        ts=datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
        html=f'<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Resource Optimization Report</title><style>{css}</style></head><body>'
        html+=f'<h1>Resource Optimization Report</h1><p>Generated: {ts} | Cluster: {CFG["cluster_id"]}</p>'
        html+=f'<div class="summary"><div class="summary-card"><h3>{summary.get("over_provisioned",0)}</h3><p>Over-Provisioned</p></div>'
        html+=f'<div class="summary-card"><h3>{summary.get("under_provisioned",0)}</h3><p>Under-Provisioned</p></div>'
        html+=f'<div class="summary-card"><h3>{summary.get("no_limits",0)}</h3><p>No Limits</p></div>'
        html+=f'<div class="summary-card"><h3>{summary.get("optimal",0)}</h3><p>Optimal</p></div>'
        html+=f'<div class="summary-card savings"><h3>~{total_cpu_sav:.0f}m / {format_memory(total_mem_sav)}</h3><p>Potential Savings</p></div></div>'
        for cat,label,cls in[("over_provisioned","Over-Provisioned (Cost Optimization)","over"),("under_provisioned","Under-Provisioned (Risk)","under"),("no_limits","Missing Resource Limits","nolim")]:
            items=res.get(cat,[])
            if items:
                html+=f'<h2>{label} ({len(items)})</h2><table><tr><th>Namespace/Pod</th><th>Container</th><th>Current Resources</th><th>Actual Usage</th><th>Recommended</th><th>Issues</th></tr>'
                for r in items:
                    cur,rec,act=r.get("current",{}),r.get("recommended",{}),r.get("actual",{})
                    html+=f'<tr class="{cls}"><td>{r.get("namespace","")}/{r.get("pod","")}</td><td>{r.get("container","")}</td><td>CPU: {cur.get("cpu_request","")}/{cur.get("cpu_limit","")}<br>Mem: {cur.get("memory_request","")}/{cur.get("memory_limit","")}</td><td>CPU: {act.get("cpu","")}<br>Mem: {act.get("memory","")}</td><td class="recommended">CPU: {rec.get("cpu_request","")}/{rec.get("cpu_limit","")}<br>Mem: {rec.get("memory_request","")}/{rec.get("memory_limit","")}</td><td class="issues">{"; ".join(r.get("issues",[]))}</td></tr>'
