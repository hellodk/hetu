    # POD DIAGNOSIS - Actually fetch and analyze pod issues
    # ═══════════════════════════════════════════════════════════════
    def diagnose_pod(ns,name):
        """Comprehensive pod diagnosis with AI-powered analysis"""
        result={"namespace":ns,"name":name,"logs":None,"events":[],"status":{},"analysis":{},"recommendations":[],"aiInsight":None,"quickFixes":[]}
        try:
            pod=core_api.read_namespaced_pod(name,ns)
            
            # Get detailed container status
            result["status"]={"phase":pod.status.phase,"reason":pod.status.reason,"message":pod.status.message,
                "startTime":pod.status.start_time.isoformat() if pod.status.start_time else None,"containers":[],"podIP":pod.status.pod_ip,"node":pod.spec.node_name}
            
            # Get resource configuration
            result["resources"]=[]
            for c in pod.spec.containers:
                res=c.resources
                result["resources"].append({"name":c.name,"image":c.image,
                    "requests":{"cpu":res.requests.get("cpu","none") if res.requests else "none","memory":res.requests.get("memory","none") if res.requests else "none"},
                    "limits":{"cpu":res.limits.get("cpu","none") if res.limits else "none","memory":res.limits.get("memory","none") if res.limits else "none"}})
            
            for cs in(pod.status.container_statuses or[]):
                cinfo={"name":cs.name,"ready":cs.ready,"restarts":cs.restart_count,"state":None,"lastState":None}
                if cs.state.running:cinfo["state"]={"status":"running","startedAt":cs.state.running.started_at.isoformat() if cs.state.running.started_at else None}
                elif cs.state.waiting:cinfo["state"]={"status":"waiting","reason":cs.state.waiting.reason,"message":cs.state.waiting.message}
                elif cs.state.terminated:cinfo["state"]={"status":"terminated","reason":cs.state.terminated.reason,"exitCode":cs.state.terminated.exit_code,"message":cs.state.terminated.message}
                if cs.last_state and cs.last_state.terminated:
                    lt=cs.last_state.terminated
                    cinfo["lastState"]={"reason":lt.reason,"exitCode":lt.exit_code,"message":lt.message,"finishedAt":lt.finished_at.isoformat() if lt.finished_at else None}
                result["status"]["containers"].append(cinfo)
            
            # Get logs from previous and current containers
            all_logs=""
            for c in pod.spec.containers:
                try:
                    logs=core_api.read_namespaced_pod_log(name,ns,container=c.name,previous=True,tail_lines=100)
                    if logs:all_logs+=f"=== {c.name} (previous) ===\n{logs}\n"
                except:pass
                try:
                    logs=core_api.read_namespaced_pod_log(name,ns,container=c.name,tail_lines=50)
                    if logs:all_logs+=f"=== {c.name} (current) ===\n{logs}\n"
                except:pass
            result["logs"]=all_logs[-5000:] if all_logs else None
            
            # Get all events (not just pod events - also check replicaset, deployment)
            events=core_api.list_namespaced_event(ns,field_selector=f"involvedObject.name={name}")
            for e in sorted(events.items,key=lambda x:x.metadata.creation_timestamp or datetime.min.replace(tzinfo=timezone.utc),reverse=True)[:15]:
                result["events"].append({"type":e.type,"reason":e.reason,"message":e.message,"count":e.count,
                    "age":get_age(e.last_timestamp or e.metadata.creation_timestamp),"source":e.source.component if e.source else "unknown"})
            
            # Get resource usage from metrics API if available
            try:
                metrics=custom_api.get_namespaced_custom_object("metrics.k8s.io","v1beta1",ns,"pods",name)
                result["metrics"]={"containers":[{"name":c["name"],"cpu":c["usage"]["cpu"],"memory":c["usage"]["memory"]} for c in metrics.get("containers",[])]}
            except:result["metrics"]=None
            
            # Perform analysis
            result["analysis"]=analyze_pod_problem(result)
            result["recommendations"]=generate_recommendations(result["analysis"],result,ns,name,pod)
            result["quickFixes"]=generate_quick_fixes(result["analysis"],ns,name,pod)
            
            # Get AI insight if LLM is available and the analysis is complex
            if CFG.get("llm_base_url") and result["analysis"].get("category") in ["application","unknown"]:
                try:
                    ai_result=analyze_with_llm("root_cause",{
                        "pod":name,"namespace":ns,
                        "status":result["status"],
                        "events":[{"reason":e["reason"],"message":e["message"],"count":e["count"]} for e in result["events"][:5]],
                        "logs":result["logs"][-2000:] if result["logs"] else None,
                        "resources":result["resources"]
                    })
                    if ai_result and ai_result.get("root_cause"):
                        result["aiInsight"]=ai_result
                except Exception as e:
                    result["aiInsight"]={"error":str(e)}
                    
        except Exception as e:
            import traceback
            result["error"]=str(e)
            result["traceback"]=traceback.format_exc()
        return result
    
    def analyze_pod_problem(diag):
        """Deep analysis of pod problems with pattern matching"""
        analysis={"rootCause":"Unknown","severity":"medium","details":"","category":"unknown","confidence":0.5}
        containers=diag.get("status",{}).get("containers",[])
        logs=diag.get("logs","") or ""
        events=diag.get("events",[])
        resources=diag.get("resources",[])
        metrics=diag.get("metrics")
        
        # 1. Check for OOMKilled - most common issue
        for c in containers:
            state,last_state=c.get("state",{}),c.get("lastState",{})
            restarts=c.get("restarts",0)
            
            if last_state.get("reason")=="OOMKilled" or state.get("reason")=="OOMKilled":
                # Find the memory limit
                mem_limit="unknown"
                for r in resources:
                    if r["name"]==c["name"]:
                        mem_limit=r["limits"]["memory"]
                        break
                return{"rootCause":"Out of Memory (OOMKilled)","severity":"critical","category":"oom","confidence":1.0,
                    "details":f"Container '{c['name']}' killed due to memory limit ({mem_limit}). Restarts: {restarts}",
                    "container":c["name"],"memLimit":mem_limit}
            
            exit_code=last_state.get("exitCode") or state.get("exitCode")
            if exit_code==137 and not last_state.get("reason"):
                return{"rootCause":"Out of Memory (SIGKILL)","severity":"critical","category":"oom","confidence":0.9,
                    "details":"Container received SIGKILL (exit 137) - typically OOM. Check memory usage.","container":c["name"]}
        
        # 2. Check for specific exit codes
        for c in containers:
            state,last_state=c.get("state",{}),c.get("lastState",{})
            exit_code=last_state.get("exitCode") or state.get("exitCode")
            if exit_code:
                if exit_code==1:
                    error_patterns=[
                        (r'(?i)(error|exception|fatal|panic|traceback).*?[\n].*?[\n]?.*?[\n]?',logs),
                        (r'(?i)failed to.*',logs),
                        (r'(?i)cannot.*',logs),
                    ]
                    errors=[]
                    for pattern,text in error_patterns:
                        import re
                        matches=re.findall(pattern,text)
                        errors.extend(matches[:3])
                    error_summary='\n'.join(errors[:5]) if errors else "Application crashed - check logs for details"
                    return{"rootCause":"Application Error (Exit 1)","severity":"high","category":"application","confidence":0.85,
                        "details":f"Application failed with exit code 1.\n\nDetected errors:\n{error_summary}","container":c["name"]}
                elif exit_code==127:
                    return{"rootCause":"Command Not Found","severity":"critical","category":"configuration","confidence":1.0,
                        "details":"The container command or entrypoint was not found (exit 127). Check image and command.","container":c["name"]}
                elif exit_code==126:
                    return{"rootCause":"Permission Denied on Entrypoint","severity":"critical","category":"configuration","confidence":1.0,
                        "details":"Command exists but is not executable (exit 126). Check file permissions.","container":c["name"]}
                elif exit_code==2:
                    return{"rootCause":"Shell Command Error","severity":"high","category":"configuration","confidence":0.8,
                        "details":"Shell returned error (exit 2). Usually indicates invalid arguments or syntax.","container":c["name"]}
                elif exit_code==143:
                    return{"rootCause":"Graceful Termination (SIGTERM)","severity":"low","category":"lifecycle","confidence":0.9,
                        "details":"Container terminated gracefully via SIGTERM (exit 143). Normal during scaling/updates.","container":c["name"]}
        
        # 3. Check waiting state reasons
        for c in containers:
            state=c.get("state",{})
            wait_reason=state.get("reason","")
            wait_msg=state.get("message","")
            
            if wait_reason=="CrashLoopBackOff":
                # Analyze crash loop pattern
                crash_info=[]
                if c.get("lastState",{}).get("exitCode"):
                    crash_info.append(f"Last exit code: {c['lastState']['exitCode']}")
                if c.get("lastState",{}).get("reason"):
                    crash_info.append(f"Reason: {c['lastState']['reason']}")
                crash_info.append(f"Restarts: {c.get('restarts',0)}")
                
                # Extract errors from logs
                error_lines=[l.strip() for l in logs.split('\n') if any(x in l.lower() for x in ['error','exception','fatal','panic','failed','cannot','refused'])][-10:]
                
                return{"rootCause":"CrashLoopBackOff","severity":"critical","category":"crashloop","confidence":0.95,
                    "details":f"Container crashing repeatedly.\n\n{chr(10).join(crash_info)}\n\nRecent errors:\n{chr(10).join(error_lines) if error_lines else 'No clear errors - check full logs'}",
                    "container":c["name"],"restarts":c.get("restarts",0)}
            
            elif wait_reason in["ImagePullBackOff","ErrImagePull"]:
                img_events=[e["message"] for e in events if "pull" in e.get("message","").lower() or "image" in e.get("reason","").lower()]
                return{"rootCause":"Image Pull Failure","severity":"critical","category":"image","confidence":1.0,
                    "details":f"Cannot pull container image.\n\nError: {img_events[0] if img_events else wait_msg or 'Check image name and registry access'}",
                    "container":c["name"]}
            
            elif wait_reason=="CreateContainerConfigError":
                cfg_events=[e["message"] for e in events if any(x in e.get("message","").lower() for x in ["configmap","secret","volume","mount"])]
                return{"rootCause":"Configuration Error","severity":"critical","category":"configuration","confidence":1.0,
                    "details":f"Container config error.\n\nError: {cfg_events[0] if cfg_events else wait_msg or 'Missing ConfigMap, Secret, or Volume'}",
                    "container":c["name"]}
            
            elif wait_reason=="CreateContainerError":
                return{"rootCause":"Container Creation Failed","severity":"critical","category":"configuration","confidence":0.9,
                    "details":f"Failed to create container.\n\nError: {wait_msg or 'Check container spec'}","container":c["name"]}
        
        # 4. Check events for issues
        for e in events:
            msg=e.get("message","").lower()
            reason=e.get("reason","").lower()
            
            if "oom" in msg or "memory" in reason:
                return{"rootCause":"Memory Pressure","severity":"high","category":"oom","confidence":0.85,
                    "details":f"Memory issue detected.\n\nEvent: {e.get('message','')}"}
            
            if "evicted" in reason or "evict" in msg:
                return{"rootCause":"Pod Evicted","severity":"high","category":"eviction","confidence":1.0,
                    "details":f"Pod was evicted from node.\n\nReason: {e.get('message','Node resource pressure')}"}
            
            if "failed" in reason and "liveness" in msg:
                return{"rootCause":"Liveness Probe Failure","severity":"high","category":"health","confidence":0.95,
                    "details":f"Liveness probe failing ({e.get('count',1)} times).\n\n{e.get('message','')}\n\nKubernetes will restart the container."}
            
            if "failed" in reason and "readiness" in msg:
                return{"rootCause":"Readiness Probe Failure","severity":"medium","category":"health","confidence":0.9,
                    "details":f"Readiness probe failing ({e.get('count',1)} times).\n\n{e.get('message','')}\n\nPod removed from service endpoints."}
            
            if "back-off" in msg and "restart" in msg:
                return{"rootCause":"Container Restart Back-off","severity":"high","category":"crashloop","confidence":0.9,
                    "details":f"Container in restart back-off.\n\n{e.get('message','')}"}
            
            if "failed to" in msg and "mount" in msg:
                return{"rootCause":"Volume Mount Failure","severity":"critical","category":"storage","confidence":0.95,
                    "details":f"Volume mount failed.\n\n{e.get('message','')}"}
            
            if "insufficient" in msg:
                resource=msg.split("insufficient")[-1].strip().split()[0] if "insufficient" in msg else "resources"
                return{"rootCause":f"Insufficient {resource.title()}","severity":"high","category":"scheduling","confidence":0.95,
                    "details":f"Node doesn't have enough {resource}.\n\n{e.get('message','')}"}
        
        # 5. Analyze logs for patterns
        if logs:
            log_lower=logs.lower()
            
            # Connection issues
            if "connection refused" in log_lower or "connection reset" in log_lower:
                conn_lines=[l for l in logs.split('\n') if 'connection' in l.lower()][-3:]
                return{"rootCause":"Connection Failure","severity":"high","category":"network","confidence":0.85,
                    "details":f"Cannot connect to required service.\n\n{chr(10).join(conn_lines)}"}
            
            # Database issues
            if any(x in log_lower for x in ["database","postgres","mysql","mongodb","redis"]) and any(x in log_lower for x in ["error","failed","refused","timeout"]):
                db_lines=[l for l in logs.split('\n') if any(x in l.lower() for x in ["database","postgres","mysql","mongodb","redis","connection"])][-5:]
                return{"rootCause":"Database Connection Issue","severity":"high","category":"dependency","confidence":0.8,
                    "details":f"Database connectivity problem.\n\n{chr(10).join(db_lines)}"}
            
            # Permission issues
            if "permission denied" in log_lower or "access denied" in log_lower:
                return{"rootCause":"Permission Denied","severity":"high","category":"security","confidence":0.85,
                    "details":"Application lacks required permissions. Check RBAC, file permissions, or security context."}
            
            # Missing config
            if any(x in log_lower for x in ["config not found","missing config","no such file","env var"]) and "error" in log_lower:
                return{"rootCause":"Missing Configuration","severity":"high","category":"configuration","confidence":0.8,
                    "details":"Required configuration file or environment variable is missing."}
        
        # 6. Check if pod is pending for long time
        if diag.get("status",{}).get("phase")=="Pending":
            pending_events=[e for e in events if e.get("reason") in ["FailedScheduling","Unschedulable"]]
            if pending_events:
                return{"rootCause":"Scheduling Failure","severity":"high","category":"scheduling","confidence":0.9,
                    "details":f"Cannot schedule pod.\n\n{pending_events[0].get('message','')}"}
        
        # Default: try to extract any useful info
        if logs:
            error_lines=[l.strip() for l in logs.split('\n') if any(x in l.lower() for x in ['error','exception','fatal','panic'])][-5:]
            if error_lines:
                return{"rootCause":"Application Issues Detected","severity":"medium","category":"application","confidence":0.6,
                    "details":f"Errors found in logs:\n\n{chr(10).join(error_lines)}"}
        
        return analysis
    
    def generate_recommendations(analysis,diag,ns,name,pod):
        """Generate specific, actionable recommendations with real fixes"""
        recs=[]
        cat=analysis.get("category","unknown")
        container=analysis.get("container",pod.spec.containers[0].name if pod.spec.containers else "main")
        
        # Find the deployment/statefulset owner
        owner_kind,owner_name=None,None
        for ref in (pod.metadata.owner_references or []):
            if ref.kind=="ReplicaSet":
                try:
                    rs=apps_api.read_namespaced_replica_set(ref.name,ns)
                    for rs_ref in (rs.metadata.owner_references or []):
                        if rs_ref.kind=="Deployment":
                            owner_kind,owner_name="Deployment",rs_ref.name
                            break
                except:pass
            elif ref.kind in["StatefulSet","DaemonSet"]:
                owner_kind,owner_name=ref.kind,ref.name
        
        if cat=="oom":
            # Get current memory limit
            mem_limit=analysis.get("memLimit","256Mi")
            # Suggest 2x increase
            try:
                val=int(''.join(filter(str.isdigit,str(mem_limit))))
                unit=mem_limit.replace(str(val),"")
                new_val=val*2
                new_limit=f"{new_val}{unit}"
            except:
                new_limit="512Mi"
            
            recs.append({"priority":"critical","action":"Increase Memory Limit","detail":f"Container exceeded {mem_limit}. Increase to {new_limit} or higher.",
                "command":f"kubectl set resources {owner_kind.lower()}/{owner_name} -n {ns} -c {container} --limits=memory={new_limit}" if owner_kind else f"# Edit deployment to increase memory limit to {new_limit}",
                "canAutoFix":bool(owner_kind)})
            recs.append({"priority":"high","action":"Check Memory Usage Pattern","detail":"Understand why memory is growing.",
                "command":f"kubectl top pod {name} -n {ns} --containers"})
            recs.append({"priority":"medium","action":"Review Application Memory","detail":"Check for memory leaks or unbounded caches."})
        
        elif cat=="crashloop":
            recs.append({"priority":"critical","action":"Check Previous Container Logs","detail":"See what happened before crash.",
                "command":f"kubectl logs {name} -n {ns} -c {container} --previous --tail=100"})
            recs.append({"priority":"high","action":"Check Container Exit Code","detail":"Understand crash reason.",
                "command":f"kubectl get pod {name} -n {ns} -o jsonpath='{{.status.containerStatuses[?(@.name==\"{container}\")].lastState.terminated}}'"})
            recs.append({"priority":"high","action":"Verify Startup Command","detail":"Check if entrypoint is correct.",
                "command":f"kubectl get pod {name} -n {ns} -o jsonpath='{{.spec.containers[?(@.name==\"{container}\")].command}}'"})
            recs.append({"priority":"medium","action":"Check Resource Availability","detail":"Ensure pod has enough resources.",
                "command":f"kubectl describe node {diag.get('status',{}).get('node','')}" if diag.get('status',{}).get('node') else "kubectl describe nodes"})
        
        elif cat=="image":
            img=[r["image"] for r in diag.get("resources",[]) if r["name"]==container]
            recs.append({"priority":"critical","action":"Verify Image Exists","detail":f"Check if image is accessible: {img[0] if img else 'unknown'}",
                "command":f"docker pull {img[0]}" if img else "# Verify image name and tag"})
            recs.append({"priority":"high","action":"Check Image Pull Secrets","detail":"Verify registry credentials.",
                "command":f"kubectl get pod {name} -n {ns} -o jsonpath='{{.spec.imagePullSecrets}}' && kubectl get secrets -n {ns}"})
            recs.append({"priority":"high","action":"Check Registry Access","detail":"Test connectivity to registry."})
        
        elif cat=="configuration":
            recs.append({"priority":"critical","action":"Check ConfigMaps/Secrets","detail":"Verify all referenced configs exist.",
                "command":f"kubectl describe pod {name} -n {ns} | grep -E 'ConfigMap|Secret|configMapRef|secretRef' -A2"})
            recs.append({"priority":"high","action":"List Available ConfigMaps","detail":"See what's available.",
                "command":f"kubectl get configmaps -n {ns}"})
            recs.append({"priority":"high","action":"List Available Secrets","detail":"See what secrets exist.",
                "command":f"kubectl get secrets -n {ns}"})
        
        elif cat=="health":
            # Get probe config
            probe_type="liveness" if "Liveness" in analysis.get("rootCause","") else "readiness"
            recs.append({"priority":"critical","action":"Test Health Endpoint Manually","detail":"Check if the endpoint responds.",
                "command":f"kubectl exec {name} -n {ns} -c {container} -- curl -s http://localhost:8080/health || echo 'endpoint not responding'"})
            recs.append({"priority":"high","action":"Check Probe Configuration","detail":"Review timeout and threshold settings.",
                "command":f"kubectl get {owner_kind.lower()}/{owner_name} -n {ns} -o jsonpath='{{.spec.template.spec.containers[?(@.name==\"{container}\")].{probe_type}Probe}}'" if owner_kind else f"kubectl describe pod {name} -n {ns}"})
            recs.append({"priority":"high","action":"Increase Probe Timeout","detail":"Give the app more time to respond.",
                "canAutoFix":False})
            recs.append({"priority":"medium","action":"Check Application Startup Time","detail":"App may need longer initialDelaySeconds."})
        
        elif cat=="eviction":
            recs.append({"priority":"critical","action":"Check Node Resources","detail":"See node resource pressure.",
                "command":f"kubectl describe node {diag.get('status',{}).get('node','')} | grep -A10 'Conditions:'" if diag.get('status',{}).get('node') else "kubectl top nodes"})
            recs.append({"priority":"high","action":"Check Pod Priority","detail":"Consider setting PriorityClass.",
                "command":f"kubectl get priorityclasses"})
            recs.append({"priority":"high","action":"Review Resource Requests","detail":"Pods with requests are less likely to be evicted."})
        
        elif cat=="network" or cat=="dependency":
            recs.append({"priority":"critical","action":"Check Service Connectivity","detail":"Test if dependent services are reachable.",
                "command":f"kubectl exec {name} -n {ns} -c {container} -- nslookup kubernetes.default || echo 'DNS not working'"})
            recs.append({"priority":"high","action":"Check Network Policies","detail":"Verify traffic is allowed.",
                "command":f"kubectl get networkpolicies -n {ns}"})
            recs.append({"priority":"high","action":"Check Service Endpoints","detail":"Verify services have healthy endpoints.",
                "command":f"kubectl get endpoints -n {ns}"})
        
        elif cat=="storage":
            recs.append({"priority":"critical","action":"Check PVC Status","detail":"Verify volumes are bound.",
                "command":f"kubectl get pvc -n {ns}"})
            recs.append({"priority":"high","action":"Check Volume Mounts","detail":"Verify mount paths are correct.",
                "command":f"kubectl get pod {name} -n {ns} -o jsonpath='{{.spec.containers[*].volumeMounts}}'"})
        
        elif cat=="scheduling":
            recs.append({"priority":"critical","action":"Check Node Resources","detail":"See available capacity.",
                "command":"kubectl top nodes && kubectl describe nodes | grep -A5 'Allocated resources'"})
            recs.append({"priority":"high","action":"Check Pod Resource Requests","detail":"May need to reduce requests.",
                "command":f"kubectl get pod {name} -n {ns} -o jsonpath='{{.spec.containers[*].resources}}'"})
            recs.append({"priority":"high","action":"Check Node Affinity/Taints","detail":"Pod may be restricted.",
                "command":f"kubectl get pod {name} -n {ns} -o yaml | grep -A10 'affinity\\|tolerations\\|nodeSelector'"})
        
        else:
            # Generic recommendations
            recs.append({"priority":"high","action":"View Full Logs","detail":"Check complete logs for errors.",
                "command":f"kubectl logs {name} -n {ns} --all-containers --tail=200"})
            recs.append({"priority":"high","action":"Describe Pod","detail":"Get full pod details and events.",
                "command":f"kubectl describe pod {name} -n {ns}"})
            recs.append({"priority":"medium","action":"Check Pod YAML","detail":"Review full specification.",
                "command":f"kubectl get pod {name} -n {ns} -o yaml"})
        
        return recs
    
    def generate_quick_fixes(analysis,ns,name,pod):
        """Generate one-click quick fixes that can be applied automatically"""
        fixes=[]
        cat=analysis.get("category","unknown")
        container=analysis.get("container",pod.spec.containers[0].name if pod.spec.containers else "main")
        
        # Find owner
        owner_kind,owner_name=None,None
        for ref in (pod.metadata.owner_references or []):
            if ref.kind=="ReplicaSet":
                try:
                    rs=apps_api.read_namespaced_replica_set(ref.name,ns)
                    for rs_ref in (rs.metadata.owner_references or []):
                        if rs_ref.kind=="Deployment":
                            owner_kind,owner_name="deployment",rs_ref.name
                            break
                except:pass
            elif ref.kind in["StatefulSet","DaemonSet"]:
                owner_kind,owner_name=ref.kind.lower(),ref.name
        
        if not owner_kind:
            return fixes
        
        if cat=="oom":
            mem_limit=analysis.get("memLimit","256Mi")
            try:
                val=int(''.join(filter(str.isdigit,str(mem_limit))))
                unit=mem_limit.replace(str(val),"")
                new_limit=f"{val*2}{unit}"
            except:
                new_limit="512Mi"
            
            fixes.append({
                "id":"increase_memory",
                "title":f"Double Memory Limit to {new_limit}",
                "description":"Increase memory limit to prevent OOM kills",
                "action":"patch",
                "target":{"kind":owner_kind,"name":owner_name,"namespace":ns},
                "patch":{"container":container,"resources":{"limits":{"memory":new_limit},"requests":{"memory":mem_limit}}},
                "risk":"low",
                "restartsPods":True
            })
        
        elif cat=="health":
            fixes.append({
                "id":"increase_probe_timeout",
                "title":"Increase Probe Timeout to 30s",
                "description":"Give the application more time to respond to health checks",
                "action":"patch_probe",
                "target":{"kind":owner_kind,"name":owner_name,"namespace":ns},
                "probeType":"liveness" if "Liveness" in analysis.get("rootCause","") else "readiness",
                "patch":{"timeoutSeconds":30,"periodSeconds":15,"failureThreshold":5},
                "risk":"low",
                "restartsPods":True
            })
        
        elif cat=="crashloop":
            fixes.append({
                "id":"restart_deployment",
                "title":"Restart Deployment",
                "description":"Force a fresh restart of all pods",
                "action":"restart",
                "target":{"kind":owner_kind,"name":owner_name,"namespace":ns},
                "risk":"medium",
                "restartsPods":True
            })
        
        # Always offer delete and recreate as last resort
        fixes.append({
            "id":"delete_pod",
            "title":"Delete Pod (Force Recreate)",
            "description":"Delete this pod and let Kubernetes recreate it",
            "action":"delete_pod",
            "target":{"namespace":ns,"name":name},
            "risk":"low",
            "restartsPods":True
        })
        
        return fixes
    
