            "root_cause":os.getenv("LLM_MODEL_ROOT_CAUSE",""),
            "security":os.getenv("LLM_MODEL_SECURITY",""),
            "optimization":os.getenv("LLM_MODEL_OPTIMIZATION",""),
            "code":os.getenv("LLM_MODEL_CODE","")
        },
        "history_days":30,
        "auto_delete_evicted":os.getenv("AUTO_DELETE_EVICTED","false").lower()=="true",
        "protected_namespaces":os.getenv("PROTECTED_NAMESPACES","kube-system,kube-public,kube-node-lease").split(","),
        "over_provisioned_threshold":float(os.getenv("OVER_PROVISIONED_THRESHOLD","0.5")),
        "under_provisioned_threshold":float(os.getenv("UNDER_PROVISIONED_THRESHOLD","0.8"))
    }
    
    state={"report":None,"pod_health":None,"resources":None,"alerts":[],"metrics_cache":{}}
    lock=threading.Lock()
    DB_PATH="/tmp/cluster-intel.db"
    
    # ═══════════════════════════════════════════════════════════════
    # CIS CHECKS & VULN DB
    # ═══════════════════════════════════════════════════════════════
    CIS_CHECKS={
