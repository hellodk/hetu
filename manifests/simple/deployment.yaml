        "5.1.3":{"title":"Minimize wildcard use in Roles","category":"RBAC","severity":"medium","remediation":"Review roles with: kubectl get roles,clusterroles -A -o yaml | grep -E '\"\\*\"'"},
        "5.2.1":{"title":"Minimize privileged containers","category":"Pod Security","severity":"critical","remediation":"Remove privileged: true from securityContext"},
