    def export_resources_csv(res):
        """Export resource recommendations as CSV for Excel"""
        lines=["Category,Namespace,Pod,Container,Current CPU Request,Current CPU Limit,Current Memory Request,Current Memory Limit,Actual CPU,Actual Memory,Recommended CPU Request,Recommended CPU Limit,Recommended Memory Request,Recommended Memory Limit,CPU Savings,Memory Savings,Issues"]
        for cat in["over_provisioned","under_provisioned","no_limits","optimal"]:
            for r in res.get(cat,[]):
                cur,rec,act=r.get("current",{}),r.get("recommended",{}),r.get("actual",{})
                sav=r.get("savings",{})
                lines.append(f'"{cat}","{r.get("namespace","")}","{r.get("pod","")}","{r.get("container","")}","{cur.get("cpu_request","")}","{cur.get("cpu_limit","")}","{cur.get("memory_request","")}","{cur.get("memory_limit","")}","{act.get("cpu","")}","{act.get("memory","")}","{rec.get("cpu_request","")}","{rec.get("cpu_limit","")}","{rec.get("memory_request","")}","{rec.get("memory_limit","")}","{sav.get("cpu","")}","{sav.get("memory","")}","{"; ".join(r.get("issues",[]))}"')
        return "\n".join(lines)
    
