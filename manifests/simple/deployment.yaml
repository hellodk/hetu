        "5.2.5":{"title":"Minimize hostPID","category":"Pod Security","severity":"high","remediation":"Remove hostPID: true"},
        "5.2.6":{"title":"Minimize hostIPC","category":"Pod Security","severity":"medium","remediation":"Remove hostIPC: true"},
