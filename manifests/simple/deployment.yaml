    HTML=open('/app/ui.html').read()if os.path.exists('/app/ui.html')else'<h1>Loading...</h1>'
    
    class Handler(BaseHTTPRequestHandler):
        def log_message(self,f,*a):pass
        def send_json(self,data,status=200):
            self.send_response(status)
            self.send_header("Content-Type","application/json")
            self.send_header("Access-Control-Allow-Origin","*")
            self.send_header("Access-Control-Allow-Methods","*")
            self.send_header("Access-Control-Allow-Headers","*")
            self.end_headers()
            self.wfile.write(json.dumps(data).encode())
        def read_body(self):
            length=int(self.headers.get('Content-Length',0))
            return json.loads(self.rfile.read(length).decode())if length>0 else{}
        def do_OPTIONS(self):self.send_json({})
        
        def do_GET(self):
            path=urlparse(self.path).path
            query=parse_qs(urlparse(self.path).query)
            
            if path in["/","/index.html"]:
                self.send_response(200)
                self.send_header("Content-Type","text/html")
                self.end_headers()
                self.wfile.write(HTML.encode())
            elif path=="/metrics":
                self.send_response(200)
                self.send_header("Content-Type","text/plain")
                self.end_headers()
                self.wfile.write(generate_prometheus_metrics().encode())
            elif path in["/healthz","/readyz"]:
                self.send_json({"status":"ok"})
            elif path=="/api/v1/health":
                with lock:r=state.get("report")
                self.send_json(r if r else{"error":"Initializing..."},200 if r else 503)
            elif path=="/api/v1/pods/health":
                with lock:r=state.get("pod_health")
                self.send_json(r if r else{"error":"Initializing..."},200 if r else 503)
            elif path=="/api/v1/resources":
                with lock:r=state.get("resources")
                self.send_json(r if r else{"error":"Initializing..."},200 if r else 503)
            elif path=="/api/v1/actions/log":
                self.send_json({"actions":get_action_log(int(query.get("limit",["50"])[0]))})
            elif path=="/api/v1/alerts":
                self.send_json({"alerts":get_alerts(int(query.get("limit",["50"])[0]))})
            elif path=="/api/v1/history":
                self.send_json(get_history(int(query.get("days",["7"])[0])))
            elif path=="/api/v1/ai/insights":
                self.send_json(get_ai_insights())
            elif path=="/api/v1/export":
                with lock:r=state.get("report")
                if r:
                    self.send_response(200)
                    self.send_header("Content-Type","application/json")
                    self.send_header("Content-Disposition","attachment; filename=report.json")
                    self.end_headers()
                    self.wfile.write(json.dumps(r,indent=2).encode())
                else:self.send_json({"error":"No data"},503)
            elif path=="/api/v1/resources/export/csv":
                with lock:res=state.get("resources",{})
                csv_data=export_resources_csv(res)
                self.send_response(200)
                self.send_header("Content-Type","text/csv")
                self.send_header("Content-Disposition",f"attachment; filename=resource_recommendations_{datetime.now(timezone.utc).strftime('%Y%m%d_%H%M')}.csv")
                self.end_headers()
                self.wfile.write(csv_data.encode())
            elif path=="/api/v1/resources/export/html":
                with lock:res=state.get("resources",{})
                html_data=export_resources_html(res)
                self.send_response(200)
                self.send_header("Content-Type","text/html")
                self.send_header("Content-Disposition",f"attachment; filename=resource_recommendations_{datetime.now(timezone.utc).strftime('%Y%m%d_%H%M')}.html")
                self.end_headers()
                self.wfile.write(html_data.encode())
            elif path=="/api/v1/config":
                safe_cfg={k:v for k,v in CFG.items()if "key" not in k.lower()and "webhook" not in k.lower()}
                self.send_json(safe_cfg)
            elif path=="/api/v1/llm/models":
                models={"default":CFG["llm_model"],"task_models":CFG.get("llm_models",{})}
                self.send_json(models)
            else:
                self.send_response(404);self.end_headers()
        
        def do_POST(self):
            path=self.path
            body=self.read_body()
            if path=="/api/v1/pods/delete":
                r=delete_pod(body.get("namespace"),body.get("name"),body.get("force",False))
                self.send_json(r)
            elif path=="/api/v1/pods/delete-bulk":
                pods=body.get("pods",[])
                cat=body.get("category")
                if cat and not pods:
                    with lock:h=state.get("pod_health")
                    if h:pods=[{"namespace":p["namespace"],"name":p["name"]}for p in h["categories"].get(cat,[])if not p["protected"]]
                self.send_json(delete_pods_bulk(pods)if pods else{"error":"No pods"})
            elif path=="/api/v1/deployments/restart":
                self.send_json(restart_deployment(body.get("namespace"),body.get("name")))
            elif path=="/api/v1/alerts/test":
                ch=body.get("channel","slack")
                sent=False
                if ch=="slack":sent=send_slack_alert("Test Alert","This is a test from Cluster Intelligence","info")
                elif ch=="teams":sent=send_teams_alert("Test Alert","This is a test","info")
                elif ch=="pagerduty":sent=send_pagerduty_alert("Test Alert","This is a test","info")
                self.send_json({"success":sent})
            elif path=="/api/v1/ai/analyze":
                ctx_type=body.get("type","root_cause")
                ctx_data=body.get("context",{})
                result=analyze_with_llm(ctx_type,ctx_data)
                self.send_json(result if result else{"error":"LLM not configured or failed"})
            elif path=="/api/v1/diagnose/pod":
                ns,name=body.get("namespace"),body.get("name")
                self.send_json(diagnose_pod(ns,name))
            elif path=="/api/v1/resources/patch":
                # Generate or apply resource patch
                ns=body.get("namespace")
                pod_name=body.get("pod")
                container=body.get("container")
                recommended=body.get("recommended",{})
                apply_now=body.get("apply",False)
                
                # Find the owner (deployment/statefulset/daemonset)
                try:
                    pod=core_api.read_namespaced_pod(pod_name,ns)
                    owner_kind,owner_name=None,None
                    for ref in (pod.metadata.owner_references or []):
                        if ref.kind=="ReplicaSet":
                            # Get the replicaset to find deployment
                            rs=apps_api.read_namespaced_replica_set(ref.name,ns)
                            for rs_ref in (rs.metadata.owner_references or []):
                                if rs_ref.kind=="Deployment":
                                    owner_kind,owner_name="deployment",rs_ref.name
                                    break
                        elif ref.kind in["StatefulSet","DaemonSet"]:
                            owner_kind=ref.kind.lower()
                            owner_name=ref.name
                    
                    if not owner_kind:
                        self.send_json({"error":"Cannot find owner deployment/statefulset","pod":pod_name})
                        return
                    
                    # Build the JSON patch
                    patch_json={
                        "spec":{
                            "template":{
                                "spec":{
                                    "containers":[{
                                        "name":container,
                                        "resources":{
                                            "requests":{
                                                "cpu":recommended.get("cpu_request","100m"),
                                                "memory":recommended.get("memory_request","128Mi")
                                            },
                                            "limits":{
                                                "cpu":recommended.get("cpu_limit","500m"),
                                                "memory":recommended.get("memory_limit","256Mi")
                                            }
                                        }
                                    }]
                                }
                            }
                        }
                    }
                    
                    # Generate kubectl command
                    patch_str=json.dumps(patch_json)
                    kubectl_cmd=f"kubectl patch {owner_kind} {owner_name} -n {ns} --type=strategic -p '{patch_str}'"
                    
                    result={
                        "success":True,
                        "owner_kind":owner_kind,
                        "owner_name":owner_name,
                        "namespace":ns,
                        "container":container,
                        "kubectl_command":kubectl_cmd,
                        "patch_json":patch_json,
                        "applied":False
                    }
                    
                    # Apply if requested
                    if apply_now:
                        try:
                            if owner_kind=="deployment":
                                apps_api.patch_namespaced_deployment(owner_name,ns,patch_json)
                            elif owner_kind=="statefulset":
                                apps_api.patch_namespaced_stateful_set(owner_name,ns,patch_json)
                            elif owner_kind=="daemonset":
                                apps_api.patch_namespaced_daemon_set(owner_name,ns,patch_json)
                            result["applied"]=True
                            result["message"]=f"Successfully patched {owner_kind}/{owner_name}"
                            log_action("resource_patch",f"Applied resource patch to {owner_kind}/{owner_name} in {ns}")
                        except Exception as e:
                            result["applied"]=False
                            result["error"]=str(e)
                    
                    self.send_json(result)
                except Exception as e:
                    self.send_json({"error":str(e)})
            else:
                self.send_response(404);self.end_headers()
        
        def do_DELETE(self):
            m=re.match(r'/api/v1/pods/([^/]+)/([^/]+)',self.path)
            if m:
                self.send_json(delete_pod(m.group(1),m.group(2),"force"in self.path))
            else:
                self.send_response(404);self.end_headers()
    
