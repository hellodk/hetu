        html+='<div class="footer"><p>Generated by K8s Cluster Intelligence Engine. Apply recommended configurations during your next deployment cycle.</p><p><strong>How to apply:</strong> Update your deployment manifests with the recommended YAML, then apply with kubectl apply -f</p></div></body></html>'
        return html
    
    def parse_memory(s):
        """Parse memory string to bytes"""
        if not s:return 0
        s=str(s).strip()
        if s.endswith("Gi"):return float(s[:-2])*1024*1024*1024
        if s.endswith("Mi"):return float(s[:-2])*1024*1024
        if s.endswith("Ki"):return float(s[:-2])*1024
        if s.endswith("G"):return float(s[:-1])*1000*1000*1000
        if s.endswith("M"):return float(s[:-1])*1000*1000
        if s.endswith("K"):return float(s[:-1])*1000
        try:return float(s)
        except:return 0
    
    def format_memory(b):
        """Format bytes to human readable"""
        if b>=1024*1024*1024:return f"{b/1024/1024/1024:.1f}Gi"
        if b>=1024*1024:return f"{b/1024/1024:.1f}Mi"
        if b>=1024:return f"{b/1024:.1f}Ki"
        return f"{b:.0f}"
    
    def build_report(data,analysis,vulns,cis):
        sev=lambda s:len([v for v in vulns if v["severity"]==s])
        by_img,by_cve=defaultdict(list),defaultdict(list)
        for v in vulns:by_img[v["image"]].append(v);by_cve[v["cve"]].append({"image":v["image"]})
        cis_cat=defaultdict(lambda:{"pass":0,"fail":0,"warn":0})
        for c in cis:cis_cat[c.get("category","Other")][c["status"].lower()]+=1
        return{
            "clusterId":CFG["cluster_id"],"timestamp":datetime.now(timezone.utc).isoformat()+"Z","scores":analysis["scores"],
            "summary":{"totalNodes":len(data["nodes"]),"totalPods":len(data["pods"]),"totalNamespaces":len(data.get("namespaces",[])),"totalImages":len(data["images"]),
                "healthyPods":len([p for p in data["pods"]if p["phase"]=="Running"and p["restarts"]<5]),"unhealthyPods":len([p for p in data["pods"]if p["phase"]!="Running"or p["restarts"]>=5])},
            "topIssues":analysis["issues"],"allPods":data["pods"],
            "vulnerabilities":{"stats":{"critical":sev("critical"),"high":sev("high"),"medium":sev("medium"),"low":sev("low"),"total":len(vulns),"uniqueCves":len(set(v["cve"]for v in vulns)),"imagesAffected":len(by_img)},"items":vulns},
            "cisBenchmark":{"stats":{"pass":len([c for c in cis if c["status"]=="PASS"]),"fail":len([c for c in cis if c["status"]=="FAIL"]),"warn":len([c for c in cis if c["status"]=="WARN"]),"total":len(cis)},"checks":cis},
            "history":get_history(7)
        }
    
