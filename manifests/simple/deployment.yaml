        "5.3.1":{"title":"Ensure NetworkPolicies defined","category":"Network","severity":"medium","remediation":"Create NetworkPolicy for each namespace"},
        "5.4.1":{"title":"Prefer using secrets as files","category":"Secrets","severity":"medium","remediation":"Mount secrets as volumes instead of env vars"},
        "5.7.1":{"title":"Create administrative boundaries","category":"Multi-tenancy","severity":"medium","remediation":"Use separate namespaces for teams"},
    }
    
    VULN_DB={
        "CVE-2024-21626":{"severity":"critical","package":"runc","fixed":"1.1.12","cvss":8.6,"description":"Container escape via /proc/self/fd"},
        "CVE-2024-24786":{"severity":"high","package":"protobuf","fixed":"1.33.0","cvss":7.5,"description":"DoS in protobuf unmarshaling"},
        "CVE-2024-3094":{"severity":"critical","package":"xz-utils","fixed":"5.6.1","cvss":10.0,"description":"Backdoor in xz library"},
        "CVE-2023-44487":{"severity":"high","package":"http2","fixed":"varies","cvss":7.5,"description":"HTTP/2 Rapid Reset Attack"},
        "CVE-2023-45853":{"severity":"critical","package":"zlib","fixed":"1.3","cvss":9.8,"description":"Buffer overflow in MiniZip"},
