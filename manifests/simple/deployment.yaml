    def get_age(ts):
        if not ts:return "?"
        if isinstance(ts,str):ts=datetime.fromisoformat(ts.replace('Z','+00:00'))
        d=(datetime.now(timezone.utc)-ts).total_seconds()
        return f"{int(d)}s"if d<60 else f"{int(d/60)}m"if d<3600 else f"{int(d/3600)}h"if d<86400 else f"{int(d/86400)}d"
    
    def get_age_seconds(ts):
        if not ts:return 0
        if isinstance(ts,str):ts=datetime.fromisoformat(ts.replace('Z','+00:00'))
        return(datetime.now(timezone.utc)-ts).total_seconds()
    
