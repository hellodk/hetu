    # ═══════════════════════════════════════════════════════════════
    # DATABASE
    # ═══════════════════════════════════════════════════════════════
    def init_db():
        try:
            conn=sqlite3.connect(DB_PATH)
            conn.execute('''CREATE TABLE IF NOT EXISTS history(
                id INTEGER PRIMARY KEY,timestamp TEXT,overall INTEGER,reliability INTEGER,
                security INTEGER,cost INTEGER,architecture INTEGER,vulns INTEGER,cis_pass INTEGER,cis_fail INTEGER)''')
            conn.execute('''CREATE TABLE IF NOT EXISTS action_log(
                id INTEGER PRIMARY KEY,timestamp TEXT,action TEXT,target TEXT,
                initiated_by TEXT,success INTEGER,message TEXT,details TEXT)''')
            conn.execute('''CREATE TABLE IF NOT EXISTS alerts(
                id INTEGER PRIMARY KEY,timestamp TEXT,name TEXT,severity TEXT,
                message TEXT,channel TEXT,sent INTEGER,acknowledged INTEGER)''')
            conn.commit();conn.close()
        except Exception as e:print(f"[DB] Error: {e}")
    
    def log_action(action,target,initiated_by,success,message,details=None):
        try:
            conn=sqlite3.connect(DB_PATH)
            conn.execute('INSERT INTO action_log(timestamp,action,target,initiated_by,success,message,details)VALUES(?,?,?,?,?,?,?)',
                (datetime.now(timezone.utc).isoformat(),action,target,initiated_by,1 if success else 0,message,json.dumps(details)if details else None))
            conn.commit();conn.close()
        except:pass
    
    def get_action_log(limit=50):
        try:
            conn=sqlite3.connect(DB_PATH)
            rows=conn.execute("SELECT timestamp,action,target,initiated_by,success,message FROM action_log ORDER BY timestamp DESC LIMIT ?",(limit,)).fetchall()
            conn.close()
            return [{"timestamp":r[0],"action":r[1],"target":r[2],"initiatedBy":r[3],"success":bool(r[4]),"message":r[5]}for r in rows]
        except:return []
    
    def save_history(scores,vulns,cis):
        try:
            conn=sqlite3.connect(DB_PATH)
            conn.execute('INSERT INTO history(timestamp,overall,reliability,security,cost,architecture,vulns,cis_pass,cis_fail)VALUES(?,?,?,?,?,?,?,?,?)',
                (datetime.now(timezone.utc).isoformat(),scores["overall"],scores["reliability"],scores["security"],scores["cost"],scores["architecture"],vulns,cis["pass"],cis["fail"]))
            conn.execute("DELETE FROM history WHERE timestamp < ?",(datetime.now(timezone.utc)-timedelta(days=CFG["history_days"])).isoformat())
            conn.commit();conn.close()
        except:pass
    
    def get_history(days=7):
        try:
            conn=sqlite3.connect(DB_PATH)
            rows=conn.execute("SELECT timestamp,overall,reliability,security,cost,architecture,vulns,cis_pass,cis_fail FROM history WHERE timestamp > ? ORDER BY timestamp",
                (datetime.now(timezone.utc)-timedelta(days=days)).isoformat()).fetchall()
            conn.close()
            return [{"timestamp":r[0],"overall":r[1],"reliability":r[2],"security":r[3],"cost":r[4],"architecture":r[5],"vulns":r[6],"cisPass":r[7],"cisFail":r[8]}for r in rows]
        except:return []
    
    def save_alert(name,severity,message,channel,sent):
        try:
            conn=sqlite3.connect(DB_PATH)
            conn.execute('INSERT INTO alerts(timestamp,name,severity,message,channel,sent,acknowledged)VALUES(?,?,?,?,?,?,0)',
                (datetime.now(timezone.utc).isoformat(),name,severity,message,channel,1 if sent else 0))
            conn.commit();conn.close()
        except:pass
    
    def get_alerts(limit=50):
        try:
            conn=sqlite3.connect(DB_PATH)
            rows=conn.execute("SELECT id,timestamp,name,severity,message,channel,sent,acknowledged FROM alerts ORDER BY timestamp DESC LIMIT ?",(limit,)).fetchall()
            conn.close()
            return [{"id":r[0],"timestamp":r[1],"name":r[2],"severity":r[3],"message":r[4],"channel":r[5],"sent":bool(r[6]),"acknowledged":bool(r[7])}for r in rows]
        except:return []
    
    # ═══════════════════════════════════════════════════════════════
    # PROMETHEUS METRICS
    # ═══════════════════════════════════════════════════════════════
    def query_prometheus(query):
        if not CFG["prometheus_url"]:return None
        try:
            url=f"{CFG['prometheus_url']}/api/v1/query?query={query}"
            with urlopen(url,timeout=10)as r:
                data=json.loads(r.read())
                if data.get("status")=="success":
                    return data.get("data",{}).get("result",[])
        except:pass
        return None
    
    def get_container_metrics():
        """Get CPU and memory usage from Prometheus."""
        metrics={}
        
        # CPU usage (cores)
        cpu_query='sum(rate(container_cpu_usage_seconds_total{container!="",container!="POD"}[5m])) by (namespace,pod,container)'
        cpu_results=query_prometheus(cpu_query)or[]
        for r in cpu_results:
            key=f"{r['metric'].get('namespace','')}/{r['metric'].get('pod','')}/{r['metric'].get('container','')}"
            if key not in metrics:metrics[key]={}
            metrics[key]["cpu_used"]=float(r["value"][1])
        
        # Memory usage (bytes)
        mem_query='sum(container_memory_working_set_bytes{container!="",container!="POD"}) by (namespace,pod,container)'
        mem_results=query_prometheus(mem_query)or[]
        for r in mem_results:
            key=f"{r['metric'].get('namespace','')}/{r['metric'].get('pod','')}/{r['metric'].get('container','')}"
            if key not in metrics:metrics[key]={}
            metrics[key]["memory_used"]=float(r["value"][1])
        
        return metrics
    
    def generate_prometheus_metrics():
        """Generate Prometheus exposition format metrics."""
        lines=[]
        lines.append("# HELP cluster_intel_health_score Cluster health score by type")
        lines.append("# TYPE cluster_intel_health_score gauge")
        
        report=state.get("report")
        if report:
            scores=report.get("scores",{})
            cid=CFG["cluster_id"]
            for t in["overall","reliability","security","cost","architecture"]:
                lines.append(f'cluster_intel_health_score{{cluster="{cid}",type="{t}"}} {scores.get(t,0)}')
        
        lines.append("")
        lines.append("# HELP cluster_intel_pod_health_total Count of pods by health category")
        lines.append("# TYPE cluster_intel_pod_health_total gauge")
        
        ph=state.get("pod_health")
        if ph:
            cid=CFG["cluster_id"]
            for cat,count in ph.get("summary",{}).items():
                if cat!="total":
                    lines.append(f'cluster_intel_pod_health_total{{cluster="{cid}",category="{cat}"}} {count}')
        
        lines.append("")
        lines.append("# HELP cluster_intel_vulnerabilities_total Vulnerability count by severity")
        lines.append("# TYPE cluster_intel_vulnerabilities_total gauge")
        
        if report:
            vs=report.get("vulnerabilities",{}).get("stats",{})
            cid=CFG["cluster_id"]
            for sev in["critical","high","medium","low"]:
                lines.append(f'cluster_intel_vulnerabilities_total{{cluster="{cid}",severity="{sev}"}} {vs.get(sev,0)}')
        
        lines.append("")
        lines.append("# HELP cluster_intel_cis_checks_total CIS benchmark check count by status")
        lines.append("# TYPE cluster_intel_cis_checks_total gauge")
        
        if report:
            cs=report.get("cisBenchmark",{}).get("stats",{})
            cid=CFG["cluster_id"]
            for status in["pass","fail","warn"]:
                lines.append(f'cluster_intel_cis_checks_total{{cluster="{cid}",status="{status}"}} {cs.get(status,0)}')
        
        lines.append("")
        lines.append("# HELP cluster_intel_resources_category_total Resource optimization category counts")
        lines.append("# TYPE cluster_intel_resources_category_total gauge")
        
        res=state.get("resources")
        if res:
            cid=CFG["cluster_id"]
            summary=res.get("summary",{})
            for cat in["over_provisioned","under_provisioned","no_limits","optimal"]:
                lines.append(f'cluster_intel_resources_category_total{{cluster="{cid}",category="{cat}"}} {summary.get(cat,0)}')
        
        lines.append("")
        lines.append(f'# HELP cluster_intel_last_scan_timestamp Last scan timestamp')
        lines.append(f'# TYPE cluster_intel_last_scan_timestamp gauge')
        lines.append(f'cluster_intel_last_scan_timestamp{{cluster="{CFG["cluster_id"]}"}} {int(time.time())}')
        
        return "\n".join(lines)+"\n"
    
    # ═══════════════════════════════════════════════════════════════
    # ALERTING
    # ═══════════════════════════════════════════════════════════════
    alert_cooldowns={}
    
    def should_alert(name,cooldown_minutes=30):
        """Check if alert should fire (not in cooldown)."""
        now=time.time()
        last=alert_cooldowns.get(name,0)
        if now-last<cooldown_minutes*60:
            return False
        alert_cooldowns[name]=now
        return True
    
    def send_slack_alert(title,message,severity="warning",fields=None):
        if not CFG["slack_webhook"]:return False
        color={"critical":"#dc2626","high":"#ea580c","warning":"#f59e0b","info":"#3b82f6"}.get(severity,"#6b7280")
        payload={
            "attachments":[{
                "color":color,
                "blocks":[
                    {"type":"header","text":{"type":"plain_text","text":f"🚨 {title}"}},
                    {"type":"section","text":{"type":"mrkdwn","text":message}},
                ]
            }]
        }
        if fields:
            payload["attachments"][0]["blocks"].append({
                "type":"section",
                "fields":[{"type":"mrkdwn","text":f"*{k}*\n{v}"}for k,v in fields.items()]
            })
        try:
            req=Request(CFG["slack_webhook"],data=json.dumps(payload).encode(),headers={"Content-Type":"application/json"})
            urlopen(req,timeout=10)
            return True
        except Exception as e:
            print(f"[Slack] Error: {e}")
            return False
    
    def send_teams_alert(title,message,severity="warning"):
        if not CFG["teams_webhook"]:return False
        color={"critical":"dc2626","high":"ea580c","warning":"f59e0b","info":"3b82f6"}.get(severity,"6b7280")
        payload={
            "@type":"MessageCard",
            "@context":"http://schema.org/extensions",
            "themeColor":color,
            "summary":title,
            "sections":[{"activityTitle":f"🚨 {title}","text":message}]
        }
        try:
            req=Request(CFG["teams_webhook"],data=json.dumps(payload).encode(),headers={"Content-Type":"application/json"})
            urlopen(req,timeout=10)
            return True
        except:return False
    
    def send_pagerduty_alert(title,message,severity="warning"):
        if not CFG["pagerduty_key"]:return False
        sev_map={"critical":"critical","high":"error","warning":"warning","info":"info"}
        payload={
            "routing_key":CFG["pagerduty_key"],
            "event_action":"trigger",
            "payload":{
                "summary":title,
                "severity":sev_map.get(severity,"warning"),
                "source":CFG["cluster_id"],
                "custom_details":{"message":message}
            }
        }
        try:
            req=Request("https://events.pagerduty.com/v2/enqueue",data=json.dumps(payload).encode(),headers={"Content-Type":"application/json"})
            urlopen(req,timeout=10)
            return True
        except:return False
    
    def check_and_send_alerts(report,pod_health,resources):
        """Evaluate alert rules and send notifications."""
        alerts_sent=[]
        
        # Rule 1: Critical health score
        if report:
            score=report.get("scores",{}).get("overall",100)
            if score<30 and should_alert("critical_health",60):
                title=f"Critical Health Score: {score}"
                msg=f"Cluster `{CFG['cluster_id']}` health score dropped to *{score}*. Immediate attention required."
                fields={"Reliability":str(report["scores"].get("reliability",0)),"Security":str(report["scores"].get("security",0))}
                sent=send_slack_alert(title,msg,"critical",fields)
                send_pagerduty_alert(title,msg,"critical")
                save_alert("critical_health","critical",msg,"slack",sent)
                alerts_sent.append({"name":"critical_health","severity":"critical"})
            elif score<50 and should_alert("low_health",30):
                title=f"Low Health Score: {score}"
                msg=f"Cluster `{CFG['cluster_id']}` health score is *{score}*."
                sent=send_slack_alert(title,msg,"warning")
                save_alert("low_health","warning",msg,"slack",sent)
                alerts_sent.append({"name":"low_health","severity":"warning"})
        
        # Rule 2: Critical vulnerabilities
        if report:
            crit_vulns=report.get("vulnerabilities",{}).get("stats",{}).get("critical",0)
            if crit_vulns>0 and should_alert("critical_vulns",120):
                title=f"Critical Vulnerabilities: {crit_vulns}"
                msg=f"Found *{crit_vulns}* critical vulnerabilities in cluster `{CFG['cluster_id']}`."
                sent=send_slack_alert(title,msg,"critical")
                save_alert("critical_vulns","critical",msg,"slack",sent)
                alerts_sent.append({"name":"critical_vulns","severity":"critical"})
        
        # Rule 3: Evicted pods threshold
        if pod_health:
            evicted=pod_health.get("summary",{}).get("evicted",0)
            if evicted>50 and should_alert("evicted_pods",60):
                title=f"High Evicted Pod Count: {evicted}"
                msg=f"Cluster `{CFG['cluster_id']}` has *{evicted}* evicted pods. Consider cleanup."
                sent=send_slack_alert(title,msg,"warning")
                save_alert("evicted_pods","warning",msg,"slack",sent)
                alerts_sent.append({"name":"evicted_pods","severity":"warning"})
        
        # Rule 4: Resource issues
        if resources:
            under=resources.get("summary",{}).get("under_provisioned",0)
            if under>10 and should_alert("under_provisioned",60):
                title=f"Under-Provisioned Pods: {under}"
                msg=f"*{under}* pods in cluster `{CFG['cluster_id']}` are using >80% of their resource limits. Risk of OOM/throttling."
                sent=send_slack_alert(title,msg,"warning")
                save_alert("under_provisioned","warning",msg,"slack",sent)
                alerts_sent.append({"name":"under_provisioned","severity":"warning"})
        
        return alerts_sent
    
    # ═══════════════════════════════════════════════════════════════
    # RESOURCE RIGHT-SIZING
    # ═══════════════════════════════════════════════════════════════
    def parse_resource(val):
        """Parse K8s resource string to float (CPU in cores, memory in bytes)."""
        if not val:return 0
        val=str(val)
        if val.endswith('m'):return float(val[:-1])/1000
        if val.endswith('Ki'):return float(val[:-2])*1024
        if val.endswith('Mi'):return float(val[:-2])*1024*1024
        if val.endswith('Gi'):return float(val[:-2])*1024*1024*1024
        if val.endswith('Ti'):return float(val[:-2])*1024*1024*1024*1024
        if val.endswith('k'):return float(val[:-1])*1000
        if val.endswith('M'):return float(val[:-1])*1000*1000
        if val.endswith('G'):return float(val[:-1])*1000*1000*1000
        try:return float(val)
        except:return 0
    
    def format_cpu(cores):
        if cores<0.001:return "0m"
        if cores<1:return f"{int(cores*1000)}m"
        return f"{cores:.2f}"
    
    def format_memory(bytes_val):
        if bytes_val<1024:return f"{int(bytes_val)}B"
        if bytes_val<1024*1024:return f"{int(bytes_val/1024)}Ki"
        if bytes_val<1024*1024*1024:return f"{int(bytes_val/1024/1024)}Mi"
        return f"{bytes_val/1024/1024/1024:.1f}Gi"
    
    def analyze_resources(pods):
        """Analyze resource usage and provide recommendations."""
        prom_metrics=get_container_metrics()if CFG["prometheus_url"]else{}
        
        results={"over_provisioned":[],"under_provisioned":[],"no_limits":[],"optimal":[],"summary":{}}
        
        for p in pods:
            ns,name=p["namespace"],p["name"]
            if p["phase"]!="Running":continue
            
            for c in p.get("raw_containers",[]):
                cname=c.get("name","")
                key=f"{ns}/{name}/{cname}"
                
                res=c.get("resources",{})
                req=res.get("requests",{})or{}
                lim=res.get("limits",{})or{}
                
                cpu_req=parse_resource(req.get("cpu"))
                cpu_lim=parse_resource(lim.get("cpu"))
                mem_req=parse_resource(req.get("memory"))
                mem_lim=parse_resource(lim.get("memory"))
                
                # Get actual usage from Prometheus
                actual=prom_metrics.get(key,{})
                cpu_used=actual.get("cpu_used",0)
                mem_used=actual.get("memory_used",0)
                
                # Categorize
                category="optimal"
                issues=[]
                
                if not cpu_lim or not mem_lim:
                    category="no_limits"
                    issues.append("Missing resource limits")
                elif cpu_req>0 or mem_req>0:
                    # Check over-provisioned (using <50% of requested)
                    cpu_ratio=cpu_used/cpu_req if cpu_req>0 else 1
                    mem_ratio=mem_used/mem_req if mem_req>0 else 1
                    
                    if cpu_ratio<CFG["over_provisioned_threshold"]and mem_ratio<CFG["over_provisioned_threshold"]:
                        category="over_provisioned"
                        issues.append(f"CPU usage {cpu_ratio*100:.0f}% of requested")
                        issues.append(f"Memory usage {mem_ratio*100:.0f}% of requested")
                    
                    # Check under-provisioned (using >80% of limits)
                    cpu_lim_ratio=cpu_used/cpu_lim if cpu_lim>0 else 0
                    mem_lim_ratio=mem_used/mem_lim if mem_lim>0 else 0
                    
                    if cpu_lim_ratio>CFG["under_provisioned_threshold"]or mem_lim_ratio>CFG["under_provisioned_threshold"]:
                        category="under_provisioned"
                        if cpu_lim_ratio>CFG["under_provisioned_threshold"]:
                            issues.append(f"CPU at {cpu_lim_ratio*100:.0f}% of limit")
                        if mem_lim_ratio>CFG["under_provisioned_threshold"]:
                            issues.append(f"Memory at {mem_lim_ratio*100:.0f}% of limit")
                
                # Calculate recommendations based on actual usage
                # Minimum baselines: 10m CPU, 64Mi memory (for idle pods)
                MIN_CPU_REQ=0.01  # 10m
                MIN_CPU_LIM=0.05  # 50m
                MIN_MEM_REQ=64*1024*1024   # 64Mi
                MIN_MEM_LIM=128*1024*1024  # 128Mi
                
                if cpu_used>0:
                    rec_cpu_req=max(cpu_used*1.2,MIN_CPU_REQ)
                    rec_cpu_lim=max(cpu_used*2,MIN_CPU_LIM)
                elif category=="over_provisioned":
                    # Usage is 0 but marked over-provisioned - recommend minimum
                    rec_cpu_req=MIN_CPU_REQ
                    rec_cpu_lim=MIN_CPU_LIM
                else:
                    rec_cpu_req=cpu_req
                    rec_cpu_lim=cpu_lim
                
                if mem_used>0:
                    rec_mem_req=max(mem_used*1.2,MIN_MEM_REQ)
                    rec_mem_lim=max(mem_used*1.5,MIN_MEM_LIM)
                elif category=="over_provisioned":
                    # Usage is 0 but marked over-provisioned - recommend minimum
                    rec_mem_req=MIN_MEM_REQ
                    rec_mem_lim=MIN_MEM_LIM
                else:
                    rec_mem_req=mem_req
                    rec_mem_lim=mem_lim
                
                # Estimate savings (over-provisioned)
                cpu_savings=max(0,(cpu_req-rec_cpu_req))if category=="over_provisioned"else 0
                mem_savings=max(0,(mem_req-rec_mem_req))if category=="over_provisioned"else 0
                
                entry={
                    "namespace":ns,
                    "pod":name,
                    "container":cname,
                    "category":category,
                    "issues":issues,
                    "current":{
                        "cpu_request":format_cpu(cpu_req),
                        "cpu_limit":format_cpu(cpu_lim),
                        "memory_request":format_memory(mem_req),
                        "memory_limit":format_memory(mem_lim)
                    },
                    "actual":{
                        "cpu":format_cpu(cpu_used),
                        "memory":format_memory(mem_used)
                    },
                    "recommended":{
                        "cpu_request":format_cpu(rec_cpu_req),
                        "cpu_limit":format_cpu(rec_cpu_lim),
                        "memory_request":format_memory(rec_mem_req),
                        "memory_limit":format_memory(rec_mem_lim)
                    },
                    "savings":{
                        "cpu":format_cpu(cpu_savings),
                        "memory":format_memory(mem_savings)
                    },
                    "yaml":f"""resources:
      requests:
        cpu: "{format_cpu(rec_cpu_req)}"
        memory: "{format_memory(rec_mem_req)}"
      limits:
        cpu: "{format_cpu(rec_cpu_lim)}"
        memory: "{format_memory(rec_mem_lim)}\""""
                }
                
                results[category].append(entry)
        
        results["summary"]={
            "over_provisioned":len(results["over_provisioned"]),
            "under_provisioned":len(results["under_provisioned"]),
            "no_limits":len(results["no_limits"]),
            "optimal":len(results["optimal"]),
            "total":sum(len(v)for v in[results["over_provisioned"],results["under_provisioned"],results["no_limits"],results["optimal"]])
        }
        
        return results
    
