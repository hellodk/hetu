apiVersion: v1
kind: Secret
metadata:
  name: pgadmin-secrets
  namespace: utilities
type: Opaque
stringData:
  PGADMIN_DEFAULT_EMAIL: admin@local.dev
  PGADMIN_DEFAULT_PASSWORD: admin123
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgadmin-servers
  namespace: utilities
data:
  servers.json: |
    {
      "Servers": {
        "1": {
          "Name": "Avika PostgreSQL",
          "Group": "Servers",
          "Host": "avika-postgresql.avika.svc.cluster.local",
          "Port": 5432,
          "MaintenanceDB": "avika",
          "Username": "admin",
          "SSLMode": "prefer",
          "PassFile": "/pgpassfile"
        }
      }
    }
  pgpassfile: |
    avika-postgresql.avika.svc.cluster.local:5432:avika:admin:HFN6KBWIiMSMVV2fUIZ1DQ02hZtQaamp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: utilities
  labels:
    app: pgadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:latest
          ports:
            - containerPort: 80
              name: http
          envFrom:
            - secretRef:
                name: pgadmin-secrets
          env:
            - name: PGADMIN_CONFIG_SERVER_MODE
              value: "False"
            - name: PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED
              value: "False"
          volumeMounts:
            - name: pgadmin-servers
              mountPath: /pgadmin4/servers.json
              subPath: servers.json
            - name: pgadmin-servers
              mountPath: /pgpassfile
              subPath: pgpassfile
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: pgadmin-servers
          configMap:
            name: pgadmin-servers
---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin
  namespace: utilities
  labels:
    app: pgadmin
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: pgadmin
