---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cluster-intel
  namespace: monitoring
  labels:
    app: cluster-intel
    release: monitoring
spec:
  selector:
    matchLabels:
      app: cluster-intel
  namespaceSelector:
    matchNames:
      - utilities
  endpoints:
    - port: http
      interval: 30s
      path: /metrics
