apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: utilities

# Production-specific image tags
images:
  - name: ghcr.io/your-org/cluster-intel-collector
    newTag: v1.0.0
  - name: ghcr.io/your-org/cluster-intel-analyzer
    newTag: v1.0.0
  - name: ghcr.io/your-org/cluster-intel-dashboard
    newTag: v1.0.0

# Production replica counts
replicas:
  - name: collector
    count: 2
  - name: analyzer
    count: 2
  - name: dashboard
    count: 3

# Production resource patches
patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 2000m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 2Gi
    target:
      kind: Deployment
      name: analyzer

# ConfigMap generation for production
configMapGenerator:
  - name: analyzer-config
    behavior: replace
    literals:
      - llm-backend=openai
      - llm-endpoint=https://api.openai.com/v1
      - llm-model=gpt-4-turbo

# Secret reference for external secrets
secretGenerator:
  - name: llm-credentials
    behavior: replace
    options:
      disableNameSuffixHash: true
    literals:
      - api-key=REPLACE_WITH_EXTERNAL_SECRET_REF
