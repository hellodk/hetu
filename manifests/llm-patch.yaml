apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-intel
  namespace: utilities
spec:
  template:
    spec:
      containers:
        - name: cluster-intel
          env:
            - name: LLM_BASE_URL
              value: "http://192.168.1.10:11434/v1"
            - name: LLM_PROVIDER
              value: "ollama"
            - name: LLM_MODEL
              value: "llama3"
