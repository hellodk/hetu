apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  namespace: utilities
  labels:
    app.kubernetes.io/name: collector
    app.kubernetes.io/component: collector
    app.kubernetes.io/part-of: k8s-ai-cluster-intelligence
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: collector
      app.kubernetes.io/component: collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: collector
        app.kubernetes.io/component: collector
        app.kubernetes.io/part-of: k8s-ai-cluster-intelligence
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: cluster-intel-collector
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: ghcr.io/your-org/cluster-intel-collector:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: CLUSTER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: METRICS_PORT
              value: "9090"
            - name: HEALTH_PORT
              value: "8080"
            - name: RESYNC_PERIOD
              value: "5m"
            - name: METRICS_SCRAPE_INTERVAL
              value: "30s"
            - name: BUFFER_SIZE
              value: "10000"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: collector
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: collector
---
apiVersion: v1
kind: Service
metadata:
  name: collector
  namespace: utilities
  labels:
    app.kubernetes.io/name: collector
    app.kubernetes.io/component: collector
    app.kubernetes.io/part-of: k8s-ai-cluster-intelligence
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  selector:
    app.kubernetes.io/name: collector
    app.kubernetes.io/component: collector
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: collector
  namespace: utilities
  labels:
    app.kubernetes.io/name: collector
    app.kubernetes.io/part-of: k8s-ai-cluster-intelligence
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: collector
      app.kubernetes.io/component: collector
