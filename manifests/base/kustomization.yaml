apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: cluster-intelligence

namespace: utilities

resources:
  - rbac.yaml
  - collector.yaml
  - analyzer.yaml
  - dashboard.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: k8s-ai-cluster-intelligence
      app.kubernetes.io/version: "6.0.0"
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

# Image configurations - override in overlays
images:
  - name: ghcr.io/your-org/cluster-intel-collector
    newName: hellodk/cluster-intel-collector
    newTag: "6.0.0"
  - name: ghcr.io/your-org/cluster-intel-analyzer
    newName: hellodk/cluster-intel-analyzer
    newTag: "6.0.0"
  - name: ghcr.io/your-org/cluster-intel-dashboard
    newName: hellodk/cluster-intel-dashboard
    newTag: "6.0.0"
