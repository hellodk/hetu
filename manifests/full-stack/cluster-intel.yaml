            <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-xl flex items-center justify-center shadow-lg">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold">Cluster Intelligence</h1>
                        <div class="text-sm text-slate-500 dark:text-slate-400"><span id="cid"></span> • v4.0</div>
                    </div>
                </div>
                <nav id="tabs" class="flex items-center gap-1"></nav>
                <div class="flex items-center gap-3">
                    <button onclick="toggleTheme()" class="btn p-2.5 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 rounded-xl" title="Toggle theme">
                        <svg id="theme-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                    </button>
                    <button onclick="exportReport()" class="btn px-4 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 rounded-xl text-sm font-medium">Export</button>
                    <button onclick="load()" class="btn p-2.5 bg-blue-500 hover:bg-blue-600 text-white rounded-xl"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg></button>
                    <span id="upd" class="text-sm text-slate-400"></span>
                </div>
            </div>
        </header>
        
        <main class="max-w-7xl mx-auto px-6 py-8" id="main"></main>
        
        <div id="modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4" onclick="if(event.target===this)closeModal()">
            <div class="card max-w-4xl w-full max-h-[90vh] overflow-hidden animate-fade">
                <div class="p-6 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center">
                    <h3 id="modal-title" class="text-xl font-bold"></h3>
                    <button onclick="closeModal()" class="btn p-2 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
                </div>
                <div id="modal-content" class="p-6 overflow-y-auto max-h-[calc(90vh-80px)]"></div>
            </div>
        </div>
        
        <script>
        let DATA=null,CHART=null;
        const TABS=[{id:'overview',label:'Overview',icon:'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6'},{id:'vulns',label:'Vulnerabilities',icon:'M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z'},{id:'cis',label:'CIS Compliance',icon:'M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z'},{id:'pods',label:'Workloads',icon:'M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10'},{id:'cleanup',label:'Cleanup',icon:'M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16'},{id:'trends',label:'Trends',icon:'M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z'}];
        let currentTab='overview';
        
        function gc(s){return s>=90?{c:'emerald',l:'Excellent'}:s>=75?{c:'lime',l:'Good'}:s>=60?{c:'amber',l:'Fair'}:s>=40?{c:'orange',l:'Poor'}:{c:'red',l:'Critical'}}
        function sevClass(s){return{critical:'sev-critical',high:'sev-high',medium:'sev-medium',low:'sev-low'}[s]||'bg-slate-100 text-slate-600'}
        
        function initTabs(){
            document.getElementById('tabs').innerHTML=TABS.map(t=>`<button onclick="switchTab('${t.id}')" class="tab ${t.id===currentTab?'active':''}" data-tab="${t.id}"><svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${t.icon}"/></svg>${t.label}</button>`).join('');
        }
        
        function switchTab(t){
            currentTab=t;
            document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
            render();
        }
        
        function toggleTheme(){
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme',document.documentElement.classList.contains('dark')?'dark':'light');
        }
        
        function showModal(title,html){
            document.getElementById('modal-title').textContent=title;
            document.getElementById('modal-content').innerHTML=html;
            document.getElementById('modal').classList.remove('hidden');
        }
        function closeModal(){document.getElementById('modal').classList.add('hidden')}
        
        function copyCmd(cmd,btn){
            navigator.clipboard.writeText(cmd);
            btn.innerHTML='<svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>';
            setTimeout(()=>btn.innerHTML='<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>',2000);
        }
        
        function exportReport(){
            window.open('/api/v1/export?format=json','_blank');
        }
        
        function renderOverview(){
            if(!DATA)return'<div class="text-center py-20 text-slate-400">Loading...</div>';
            const d=DATA,s=d.scores,mc=gc(s.overall),vs=d.vulnerabilities.stats,cs=d.cisBenchmark.stats;
            const cisPct=cs.total?Math.round(cs.pass/cs.total*100):0;
            return`
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
                <div class="card p-8 lg:col-span-2">
                    <div class="flex items-center gap-8">
                        <div class="relative">
                            <svg class="w-40 h-40 score-ring" viewBox="0 0 100 100">
                                <circle cx="50" cy="50" r="44" fill="none" stroke="var(--border)" stroke-width="8"/>
                                <circle cx="50" cy="50" r="44" fill="none" stroke="${s.overall>=60?'#10b981':s.overall>=40?'#f59e0b':'#ef4444'}" stroke-width="8" stroke-linecap="round" style="stroke-dasharray:276;stroke-dashoffset:${276-(s.overall/100)*276}"/>
                            </svg>
                            <div class="absolute inset-0 flex flex-col items-center justify-center">
                                <span class="text-5xl font-extrabold">${s.overall}</span>
                                <span class="text-sm text-slate-500">${mc.l}</span>
                            </div>
                        </div>
                        <div class="flex-1">
                            <h2 class="text-2xl font-bold mb-4">Security Posture</h2>
                            <div class="grid grid-cols-2 gap-4">
                                ${['Reliability','Security','Cost','Architecture'].map(n=>{const v=s[n.toLowerCase()],c=gc(v);return`<div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800"><div class="flex justify-between items-center"><span class="text-sm text-slate-500">${n}</span><span class="text-lg font-bold text-${c.c}-600">${v}</span></div><div class="h-2 bg-slate-200 dark:bg-slate-700 rounded-full mt-2"><div class="h-full bg-${c.c}-500 rounded-full" style="width:${v}%"></div></div></div>`}).join('')}
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card p-6 flex flex-col justify-between">
                    <div>
                        <h3 class="text-lg font-bold mb-4">Quick Stats</h3>
                        <div class="space-y-3">
                            <div class="flex justify-between"><span class="text-slate-500">Pods</span><span class="font-semibold">${d.summary.totalPods}</span></div>
                            <div class="flex justify-between"><span class="text-slate-500">Healthy</span><span class="font-semibold text-emerald-600">${d.summary.healthyPods}</span></div>
                            <div class="flex justify-between"><span class="text-slate-500">Issues</span><span class="font-semibold text-red-600">${d.summary.unhealthyPods}</span></div>
                            <div class="flex justify-between"><span class="text-slate-500">Images</span><span class="font-semibold">${d.summary.totalImages}</span></div>
                        </div>
                    </div>
                    <div class="pt-4 border-t border-slate-200 dark:border-slate-700 mt-4">
                        <div class="text-xs text-slate-400">Last scan: ${new Date(d.timestamp).toLocaleString()}</div>
                    </div>
                </div>
            </div>
            
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
                <div class="card p-6 cursor-pointer" onclick="switchTab('vulns')">
                    <div class="flex items-center gap-4 mb-4">
                        <div class="w-12 h-12 bg-gradient-to-br from-red-500 to-orange-500 rounded-xl flex items-center justify-center"><svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg></div>
                        <div><h3 class="text-lg font-bold">Vulnerabilities</h3><p class="text-sm text-slate-500">${vs.total} total • ${vs.uniqueCves||0} unique CVEs</p></div>
                    </div>
                    <div class="flex gap-2">${['critical','high','medium','low'].map(sev=>`<div class="flex-1 text-center p-3 ${sevClass(sev)} rounded-xl"><div class="text-xl font-bold">${vs[sev]}</div><div class="text-xs capitalize">${sev}</div></div>`).join('')}</div>
                </div>
                <div class="card p-6 cursor-pointer" onclick="switchTab('cis')">
                    <div class="flex items-center gap-4 mb-4">
                        <div class="w-12 h-12 bg-gradient-to-br from-blue-500 to-indigo-500 rounded-xl flex items-center justify-center"><svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg></div>
                        <div><h3 class="text-lg font-bold">CIS Benchmark</h3><p class="text-sm text-slate-500">${cisPct}% compliant</p></div>
                    </div>
                    <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden mb-3"><div class="h-full bg-emerald-500 rounded-full" style="width:${cisPct}%"></div></div>
                    <div class="flex gap-2"><div class="flex-1 text-center p-2 bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 rounded-lg">${cs.pass} Pass</div><div class="flex-1 text-center p-2 bg-red-50 dark:bg-red-900/30 text-red-600 rounded-lg">${cs.fail} Fail</div><div class="flex-1 text-center p-2 bg-amber-50 dark:bg-amber-900/30 text-amber-600 rounded-lg">${cs.warn} Warn</div></div>
                </div>
            </div>
            
            <div class="card p-6">
                <h3 class="text-lg font-bold mb-4">Active Issues <span class="ml-2 px-2 py-1 bg-red-100 dark:bg-red-900/30 text-red-600 text-sm rounded-full">${d.topIssues?.length||0}</span></h3>
                <div class="space-y-3">${d.topIssues?.length?d.topIssues.map(i=>`<div class="p-4 rounded-xl border border-slate-200 dark:border-slate-700 border-l-4 border-l-${i.severity==='critical'?'red':i.severity==='high'?'orange':'amber'}-500"><div class="flex justify-between items-start"><div><span class="${sevClass(i.severity)} px-2 py-0.5 rounded text-xs font-bold uppercase">${i.severity}</span><span class="ml-2 px-2 py-0.5 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 rounded text-xs">${i.category}</span><h4 class="font-semibold mt-2">${i.title}</h4><p class="text-sm text-slate-500 mt-1">${i.description}</p></div>${i.affectedPods?`<span class="text-sm text-slate-400">${i.affectedPods.length} pods</span>`:''}</div></div>`).join(''):'<div class="text-center py-8 text-emerald-600">No active issues</div>'}</div>
            </div>`;
        }
        
        function renderVulns(){
            if(!DATA)return'';
            const vs=DATA.vulnerabilities.stats,vulns=DATA.vulnerabilities.items;
            return`
            <div class="card p-6 mb-6">
                <h2 class="text-xl font-bold mb-6">Vulnerability Analysis</h2>
                <div class="grid grid-cols-2 lg:grid-cols-6 gap-4 mb-8">
                    ${[['Critical',vs.critical,'red'],['High',vs.high,'orange'],['Medium',vs.medium,'amber'],['Low',vs.low,'blue'],['Unique CVEs',vs.uniqueCves||0,'slate'],['Images',vs.imagesAffected||0,'slate']].map(([l,v,c])=>`<div class="p-4 bg-${c}-50 dark:bg-${c}-900/30 border border-${c}-200 dark:border-${c}-800 rounded-xl text-center"><div class="text-2xl font-bold text-${c}-600">${v}</div><div class="text-xs text-${c}-600">${l}</div></div>`).join('')}
                </div>
                <div class="space-y-3 max-h-[500px] overflow-y-auto">
                    ${vulns.slice(0,50).map(v=>`<div onclick="showVulnDetail('${v.cve}')" class="p-4 border border-slate-200 dark:border-slate-700 rounded-xl cursor-pointer hover:shadow-md transition"><div class="flex justify-between items-start"><div class="flex items-center gap-3"><span class="${sevClass(v.severity)} px-3 py-1 rounded-lg text-sm font-bold uppercase">${v.severity}</span><div><h4 class="font-mono font-semibold">${v.cve}</h4><p class="text-sm text-slate-500">${v.package} • ${v.description?.substring(0,60)||''}...</p></div></div><div class="text-right">${v.score?`<div class="font-semibold">${v.score}</div>`:''}<div class="text-xs text-slate-400">${v.image?.split('/').pop()?.split(':')[0]||''}</div></div></div></div>`).join('')||'<div class="text-center py-12 text-emerald-600">No vulnerabilities detected</div>'}
                </div>
            </div>`;
        }
        
        function renderCIS(){
            if(!DATA)return'';
            const cs=DATA.cisBenchmark.stats,checks=DATA.cisBenchmark.checks;
            const pct=cs.total?Math.round(cs.pass/cs.total*100):0;
            return`
            <div class="card p-6 mb-6">
                <h2 class="text-xl font-bold mb-6">CIS Kubernetes Benchmark</h2>
                <div class="flex items-center gap-8 p-6 bg-slate-50 dark:bg-slate-800 rounded-2xl mb-8">
                    <div class="relative w-32 h-32">
                        <svg class="w-full h-full score-ring" viewBox="0 0 100 100">
                            <circle cx="50" cy="50" r="42" fill="none" stroke="var(--border)" stroke-width="8"/>
                            <circle cx="50" cy="50" r="42" fill="none" stroke="${pct>=80?'#10b981':pct>=60?'#f59e0b':'#ef4444'}" stroke-width="8" stroke-linecap="round" style="stroke-dasharray:264;stroke-dashoffset:${264-(pct/100)*264}"/>
                        </svg>
                        <div class="absolute inset-0 flex items-center justify-center"><span class="text-3xl font-bold">${pct}%</span></div>
                    </div>
                    <div>
                        <h3 class="text-xl font-bold mb-2">Compliance Score</h3>
                        <p class="text-slate-500 mb-3">${cs.pass} of ${cs.total} controls passed</p>
                        <div class="flex gap-4">
                            <span class="text-emerald-600 font-medium">${cs.pass} Pass</span>
                            <span class="text-red-600 font-medium">${cs.fail} Fail</span>
                            <span class="text-amber-600 font-medium">${cs.warn} Warn</span>
                        </div>
                    </div>
                </div>
                <div class="space-y-4 max-h-[500px] overflow-y-auto">
                    ${checks.map(c=>{const col=c.status==='PASS'?'emerald':c.status==='FAIL'?'red':'amber';return`<div onclick="showCISDetail('${c.id}')" class="p-5 border border-slate-200 dark:border-slate-700 rounded-xl cursor-pointer hover:shadow-md transition"><div class="flex items-start justify-between gap-4"><div class="flex items-start gap-4"><span class="px-3 py-1 bg-${col}-50 dark:bg-${col}-900/30 text-${col}-600 border border-${col}-200 dark:border-${col}-800 rounded-lg text-sm font-bold">${c.status}</span><div><h4 class="font-semibold">${c.id}: ${c.title}</h4><p class="text-sm text-slate-500 mt-1">${c.category} • ${c.details}</p></div></div><span class="${sevClass(c.severity)} px-2 py-0.5 rounded text-xs uppercase">${c.severity}</span></div></div>`}).join('')}
                </div>
            </div>`;
        }
        
        function renderPods(){
            if(!DATA)return'';
            const pods=DATA.allPods;
            const unhealthy=pods.filter(p=>p.phase!=='Running'||p.restarts>=5||!p.containers.every(c=>c.ready));
            const healthy=pods.filter(p=>p.phase==='Running'&&p.restarts<5&&p.containers.every(c=>c.ready));
            return`
            <div class="card p-6 mb-6">
                <h2 class="text-xl font-bold mb-4">Unhealthy Pods (${unhealthy.length})</h2>
                <p class="text-sm text-slate-500 mb-4">Click "Diagnose" to analyze the actual problem</p>
                <div class="space-y-3">${unhealthy.length?unhealthy.slice(0,20).map(p=>`
                <div class="p-4 border border-red-200 dark:border-red-800 bg-red-50 dark:bg-red-900/20 rounded-xl">
                    <div class="flex items-center justify-between">
                        <div>
                            <code class="text-blue-600 font-medium">${p.namespace}/${p.name}</code>
                            <div class="text-sm text-slate-600 mt-1">
                                <span class="px-2 py-0.5 rounded ${p.phase==='Running'?'bg-emerald-100 text-emerald-700':'bg-red-100 text-red-700'}">${p.phase}</span>
                                <span class="ml-2">${p.restarts} restarts</span>
                                <span class="ml-2 text-slate-400">${p.node}</span>
                            </div>
                            ${p.containers.filter(c=>!c.ready||c.reason).map(c=>`<div class="text-sm text-red-600 mt-1">${c.name}: ${c.reason||'not ready'}</div>`).join('')}
                        </div>
                        <button onclick="diagnosePod('${p.namespace}','${p.name}')" class="btn bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium">🔍 Diagnose</button>
                    </div>
                </div>`).join(''):'<div class="text-center py-8 text-emerald-600">All pods are healthy!</div>'}</div>
            </div>
            <div class="card p-6">
                <h2 class="text-xl font-bold mb-6">All Workloads (${pods.length} pods)</h2>
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead><tr class="text-left text-sm text-slate-500 border-b border-slate-200 dark:border-slate-700"><th class="pb-4 pr-4">Status</th><th class="pb-4 pr-4">Pod</th><th class="pb-4 pr-4">Namespace</th><th class="pb-4 pr-4">Node</th><th class="pb-4 pr-4">Restarts</th><th class="pb-4 pr-4">Age</th><th class="pb-4">Actions</th></tr></thead>
                        <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                            ${pods.slice(0,100).map(p=>{const ok=p.phase==='Running'&&p.restarts<5&&p.containers.every(c=>c.ready);return`<tr class="hover:bg-slate-50 dark:hover:bg-slate-800"><td class="py-3 pr-4"><span class="w-3 h-3 rounded-full inline-block ${ok?'bg-emerald-500':'bg-red-500'}"></span></td><td class="py-3 pr-4 font-mono text-sm text-blue-600">${p.name}</td><td class="py-3 pr-4 text-violet-600">${p.namespace}</td><td class="py-3 pr-4 text-slate-500">${p.node}</td><td class="py-3 pr-4 ${p.restarts>=5?'text-red-600 font-semibold':'text-slate-500'}">${p.restarts}</td><td class="py-3 pr-4 text-slate-500">${p.age}</td><td class="py-3">${!ok?`<button onclick="diagnosePod('${p.namespace}','${p.name}')" class="text-blue-600 hover:underline text-sm">Diagnose</button>`:''}</td></tr>`}).join('')}
                        </tbody>
                    </table>
                </div>
            </div>`;
        }
        
        async function diagnosePod(ns,name){
            showModal('Diagnosing Pod...',`<div class="text-center py-12"><div class="animate-spin w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full mx-auto mb-4"></div><p class="text-slate-500">Fetching logs and analyzing ${ns}/${name}...</p></div>`);
            try{
                const r=await fetch('/api/v1/diagnose/pod',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({namespace:ns,name:name})});
                const d=await r.json();
                if(d.error){showModal('Error',`<div class="text-red-600">${d.error}</div>`);return;}
                showDiagnosis(d);
            }catch(e){showModal('Error',`<div class="text-red-600">${e}</div>`);}
        }
        
        function showDiagnosis(d){
            const a=d.analysis||{};
            const sevColor=a.severity==='critical'?'red':a.severity==='high'?'orange':'amber';
            const logs=(d.logs||'').split('\n').slice(-20).join('\n');
            showModal(`Diagnosis: ${d.namespace}/${d.name}`,`
            <div class="space-y-6">
                <div class="p-4 bg-${sevColor}-50 dark:bg-${sevColor}-900/30 border border-${sevColor}-200 dark:border-${sevColor}-800 rounded-xl">
                    <div class="flex items-center gap-3">
                        <span class="text-2xl">${a.category==='resources'?'💾':a.category==='application'?'💥':a.category==='configuration'?'⚙️':a.category==='image'?'🐳':a.category==='health'?'💓':a.category==='network'?'🌐':'❓'}</span>
                        <div>
                            <h3 class="font-bold text-lg text-${sevColor}-700 dark:text-${sevColor}-400">${a.rootCause||'Unknown Issue'}</h3>
                            <p class="text-sm text-${sevColor}-600 dark:text-${sevColor}-300 uppercase">${a.severity||'unknown'} severity • ${a.category||'unknown'} issue</p>
                        </div>
                    </div>
                    ${a.details?`<div class="mt-3 text-sm text-slate-700 dark:text-slate-300 whitespace-pre-wrap">${a.details}</div>`:''}
                </div>
                
                ${d.recommendations?.length?`<div>
                    <h4 class="font-bold mb-3">🎯 Recommended Actions</h4>
                    <div class="space-y-3">${d.recommendations.map((r,i)=>`
                    <div class="p-4 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700">
                        <div class="flex items-start gap-3">
                            <span class="w-6 h-6 flex items-center justify-center rounded-full ${r.priority==='high'?'bg-red-100 text-red-600':'bg-slate-200 text-slate-600'} text-sm font-bold">${i+1}</span>
                            <div class="flex-1">
                                <h5 class="font-semibold">${r.action}</h5>
                                <p class="text-sm text-slate-500 mt-1">${r.detail}</p>
                                ${r.command?`<div class="mt-2 bg-slate-900 rounded-lg p-3 flex justify-between items-center">
                                    <code class="text-emerald-400 text-sm overflow-x-auto">${r.command}</code>
                                    <button onclick="copyCmd(\`${r.command.replace(/`/g,'\\`')}\`,this)" class="ml-2 p-1 hover:bg-slate-700 rounded"><svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg></button>
                                </div>`:''}
                            </div>
                        </div>
                    </div>`).join('')}</div>
                </div>`:''}
                
                ${d.events?.length?`<div>
                    <h4 class="font-bold mb-3">📋 Recent Events</h4>
                    <div class="space-y-2 max-h-40 overflow-y-auto">${d.events.map(e=>`
                    <div class="text-sm p-2 rounded ${e.type==='Warning'?'bg-amber-50 dark:bg-amber-900/20':'bg-slate-50 dark:bg-slate-800'}">
                        <span class="font-medium ${e.type==='Warning'?'text-amber-600':'text-slate-600'}">${e.reason}</span>
                        <span class="text-slate-400 ml-2">${e.age}</span>
                        <p class="text-slate-600 dark:text-slate-400 mt-1">${e.message}</p>
                    </div>`).join('')}</div>
                </div>`:''}
                
                ${logs?`<div>
                    <h4 class="font-bold mb-3">📜 Container Logs (last 20 lines)</h4>
                    <pre class="bg-slate-900 text-slate-300 p-4 rounded-xl text-xs overflow-x-auto max-h-60 overflow-y-auto">${logs.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</pre>
                </div>`:''}
            </div>`);
        }
        
        function renderTrends(){
            if(!DATA||!DATA.history?.length)return'<div class="card p-6"><div class="text-center py-20 text-slate-400">Collecting historical data...</div></div>';
            const h=DATA.history;
            setTimeout(()=>{
                const ctx=document.getElementById('trend-chart')?.getContext('2d');
                if(!ctx)return;
                if(CHART)CHART.destroy();
                CHART=new Chart(ctx,{type:'line',data:{labels:h.map(x=>new Date(x.timestamp).toLocaleDateString()),datasets:[{label:'Overall',data:h.map(x=>x.overall),borderColor:'#3b82f6',tension:0.3},{label:'Security',data:h.map(x=>x.security),borderColor:'#ef4444',tension:0.3},{label:'Reliability',data:h.map(x=>x.reliability),borderColor:'#10b981',tension:0.3}]},options:{responsive:true,plugins:{legend:{position:'bottom'}},scales:{y:{min:0,max:100}}}});
            },100);
            return`
            <div class="card p-6 mb-6">
                <h2 class="text-xl font-bold mb-6">Score Trends (7 days)</h2>
                <canvas id="trend-chart" height="100"></canvas>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="card p-6">
                    <h3 class="text-lg font-bold mb-4">Vulnerability Trend</h3>
                    <div class="space-y-2">${h.slice(-7).map(x=>`<div class="flex justify-between text-sm"><span class="text-slate-500">${new Date(x.timestamp).toLocaleDateString()}</span><span class="font-medium">${x.vulns} vulns</span></div>`).join('')}</div>
                </div>
                <div class="card p-6">
                    <h3 class="text-lg font-bold mb-4">Compliance Trend</h3>
                    <div class="space-y-2">${h.slice(-7).map(x=>`<div class="flex justify-between text-sm"><span class="text-slate-500">${new Date(x.timestamp).toLocaleDateString()}</span><span class="font-medium text-emerald-600">${x.cisPass} pass</span><span class="font-medium text-red-600">${x.cisFail} fail</span></div>`).join('')}</div>
                </div>
            </div>`;
        }
        
        function showVulnDetail(cve){
            const v=DATA.vulnerabilities.items.find(x=>x.cve===cve);if(!v)return;
            const affected=DATA.vulnerabilities.byCve?.[cve]||[];
            showModal(cve,`
                <div class="space-y-6">
                    <div class="flex items-center gap-4"><span class="${sevClass(v.severity)} px-4 py-2 rounded-xl font-bold uppercase">${v.severity}</span>${v.score?`<span class="text-slate-500">CVSS: <strong>${v.score}</strong></span>`:''}</div>
                    <div class="bg-slate-50 dark:bg-slate-800 rounded-xl p-4"><h4 class="font-semibold mb-2">Description</h4><p class="text-slate-700 dark:text-slate-300">${v.description}</p></div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-slate-50 dark:bg-slate-800 rounded-xl p-4"><h4 class="text-sm text-slate-500 mb-1">Package</h4><p class="font-mono">${v.package}</p></div>
                        <div class="bg-emerald-50 dark:bg-emerald-900/30 border border-emerald-200 dark:border-emerald-800 rounded-xl p-4"><h4 class="text-sm text-emerald-600 mb-1">Fixed Version</h4><p class="font-mono">${v.fixedVersion||'N/A'}</p></div>
                    </div>
                    <div class="bg-slate-50 dark:bg-slate-800 rounded-xl p-4"><h4 class="font-semibold mb-3">Affected Images (${affected.length})</h4><div class="space-y-2 max-h-40 overflow-y-auto">${affected.map(a=>`<div class="bg-white dark:bg-slate-900 rounded-lg px-4 py-2 border border-slate-200 dark:border-slate-700"><code class="text-blue-600 text-sm">${a.image}</code></div>`).join('')}</div></div>
                    ${v.primaryLink?`<a href="${v.primaryLink}" target="_blank" class="inline-block px-4 py-2 bg-blue-500 text-white rounded-xl hover:bg-blue-600">View CVE Details →</a>`:''}
                </div>
            `);
        }
        
        function showCISDetail(id){
            const c=DATA.cisBenchmark.checks.find(x=>x.id===id);if(!c)return;
            const col=c.status==='PASS'?'emerald':c.status==='FAIL'?'red':'amber';
            showModal(`CIS ${c.id}`,`
                <div class="space-y-6">
                    <div class="flex items-center gap-3"><span class="px-4 py-2 bg-${col}-50 dark:bg-${col}-900/30 text-${col}-600 border border-${col}-200 dark:border-${col}-800 rounded-xl font-bold">${c.status}</span><span class="px-4 py-2 bg-slate-100 dark:bg-slate-700 rounded-xl">${c.category}</span><span class="${sevClass(c.severity)} px-3 py-1 rounded-lg text-sm uppercase">${c.severity}</span></div>
                    <h3 class="text-xl font-bold">${c.title}</h3>
                    ${c.description?`<div class="bg-slate-50 dark:bg-slate-800 rounded-xl p-4"><p class="text-slate-700 dark:text-slate-300">${c.description}</p></div>`:''}
                    ${c.impact?`<div class="bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 rounded-xl p-4"><h4 class="font-semibold text-red-600 mb-2">Security Impact</h4><p class="text-slate-700 dark:text-slate-300">${c.impact}</p></div>`:''}
                    <div class="bg-slate-50 dark:bg-slate-800 rounded-xl p-4"><h4 class="font-semibold mb-2">Current Status</h4><p class="text-slate-700 dark:text-slate-300">${c.details}</p></div>
                    ${c.affectedResources?.length?`<div class="bg-slate-50 dark:bg-slate-800 rounded-xl p-4"><h4 class="font-semibold mb-3">Affected Resources (${c.affectedResources.length})</h4><div class="space-y-2 max-h-40 overflow-y-auto">${c.affectedResources.map(r=>`<div class="bg-white dark:bg-slate-900 rounded-lg px-4 py-2 border border-slate-200 dark:border-slate-700 font-mono text-sm text-blue-600">${r}</div>`).join('')}</div></div>`:''}
                    ${c.status!=='PASS'&&c.remediation?`<div class="border-t border-slate-200 dark:border-slate-700 pt-6"><h4 class="font-semibold text-emerald-600 mb-3">Remediation</h4><div class="bg-slate-900 text-slate-100 rounded-xl p-4 font-mono text-sm flex justify-between items-center"><code>${c.remediation}</code><button onclick="copyCmd('${c.remediation.replace(/'/g,"\\'")}',this)" class="btn p-2 hover:bg-slate-700 rounded"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg></button></div></div>`:''}
                </div>
            `);
        }
        
        function renderCleanup(){
            if(!DATA?.cleanup)return'<div class="text-center py-20 text-slate-400">No cleanup data available</div>';
            const c=DATA.cleanup,s=c.summary||{};
            const cats=[
                {key:'staleReplicaSets',label:'Stale ReplicaSets',desc:'Old ReplicaSets with 0 replicas (>1 day)',icon:'📦',color:'amber',endpoint:'replicaset'},
                {key:'evictedPods',label:'Evicted Pods',desc:'Pods evicted due to resource pressure',icon:'💀',color:'red',endpoint:'pod'},
                {key:'completedJobs',label:'Completed Jobs',desc:'Finished jobs older than 1 day',icon:'✅',color:'emerald',endpoint:'job'},
                {key:'failedJobs',label:'Failed Jobs',desc:'Failed jobs older than 1 hour',icon:'❌',color:'red',endpoint:'job'},
                {key:'orphanedPVCs',label:'Orphaned PVCs',desc:'Pending/Lost PVCs older than 1 hour',icon:'💾',color:'orange',endpoint:'pvc'},
                {key:'oldConfigMaps',label:'Unused ConfigMaps',desc:'Unreferenced ConfigMaps older than 30 days',icon:'📄',color:'slate',endpoint:'configmap'},
                {key:'unusedSecrets',label:'Unused Secrets',desc:'Unreferenced Secrets older than 30 days',icon:'🔐',color:'slate',endpoint:'secret'},
                {key:'emptyNamespaces',label:'Empty Namespaces',desc:'Namespaces with no pods (>7 days)',icon:'📁',color:'slate',endpoint:'namespace'}
            ];
            return`
            <div class="card p-6 mb-6">
                <div class="flex items-center justify-between mb-4">
                    <div><h2 class="text-2xl font-bold">Cluster Cleanup</h2><p class="text-slate-500">${s.total||0} items can be cleaned up</p></div>
                </div>
                <div class="grid grid-cols-4 gap-4">${cats.map(cat=>`<div class="p-4 rounded-xl bg-${cat.color}-50 dark:bg-${cat.color}-900/20 text-center"><span class="text-2xl">${cat.icon}</span><div class="text-2xl font-bold mt-1">${s[cat.key]||0}</div><div class="text-xs text-slate-500">${cat.label}</div></div>`).join('')}</div>
            </div>
            ${cats.filter(cat=>(c[cat.key]||[]).length>0).map(cat=>`
            <div class="card p-6 mb-4">
                <div class="flex justify-between items-center mb-4">
                    <div><h3 class="font-bold text-lg">${cat.icon} ${cat.label} (${c[cat.key].length})</h3><p class="text-sm text-slate-500">${cat.desc}</p></div>
                    <button onclick="cleanupBulk('${cat.key}')" class="btn bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm">Delete All</button>
                </div>
                <div class="space-y-2 max-h-64 overflow-y-auto">${c[cat.key].slice(0,15).map(item=>`
                <div class="flex items-center justify-between p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800">
                    <div>
                        <code class="text-blue-600 text-sm">${item.namespace}/${item.name}</code>
                        <div class="text-xs text-slate-400">${item.age}${item.ownerDeployment?' • Deployment: '+item.ownerDeployment:''}${item.phase?' • '+item.phase:''}${item.message?' • '+item.message.substring(0,50):''}</div>
                    </div>
                    <button onclick="cleanupItem('${cat.endpoint}','${item.namespace}','${item.name}')" class="btn bg-red-100 hover:bg-red-200 text-red-600 px-3 py-1 rounded text-xs">🗑️ Delete</button>
                </div>`).join('')}</div>
            </div>`).join('')}
            ${s.total===0?'<div class="card p-12 text-center"><span class="text-6xl mb-4 block">✨</span><h3 class="text-xl font-bold text-emerald-600">Cluster is Clean!</h3><p class="text-slate-500">No stale resources found</p></div>':''}`;
        }
        
        async function cleanupItem(type,ns,name){
            if(!confirm('Delete '+ns+'/'+name+'?'))return;
            try{
                const r=await fetch('/api/v1/cleanup/'+type,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({namespace:ns,name:name})});
                const d=await r.json();
                alert(d.message||'Done');
                load();
            }catch(e){alert('Error: '+e)}
        }
        
        async function cleanupBulk(category){
            const count=DATA?.cleanup?.[category]?.length||0;
            if(!confirm('Delete all '+count+' '+category+'?'))return;
            try{
                const r=await fetch('/api/v1/cleanup/bulk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({category:category})});
                const d=await r.json();
                alert('Deleted: '+(d.deleted||0)+', Failed: '+(d.failed||0));
                load();
            }catch(e){alert('Error: '+e)}
        }
        
        function render(){
            const main=document.getElementById('main');
            main.innerHTML={overview:renderOverview,vulns:renderVulns,cis:renderCIS,pods:renderPods,cleanup:renderCleanup,trends:renderTrends}[currentTab]?.()??'';
        }
        
        async function load(){
            try{
                const r=await fetch('/api/v1/health');
                if(!r.ok)return;
                DATA=await r.json();
                document.getElementById('loading').style.display='none';
                document.getElementById('cid').textContent=DATA.clusterId;
                document.getElementById('upd').textContent=new Date(DATA.timestamp).toLocaleTimeString();
                render();
            }catch(e){console.error(e)}
        }
        
        // Init
        if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark');
        initTabs();
        load();
        setInterval(load,30000);
        document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
        </script>
    </body>
    </html>
---
# ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-intel
  namespace: utilities
---
# ClusterRole - Read-only access to cluster resources
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-intel-reader
rules:
  - apiGroups: [""]
    resources: [pods, nodes, events, namespaces, configmaps, secrets, serviceaccounts, persistentvolumeclaims]
    verbs: [get, list, watch, delete]
  - apiGroups: ["apps"]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch, delete]
  - apiGroups: ["batch"]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, delete]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: [roles, rolebindings, clusterroles, clusterrolebindings]
    verbs: [get, list, watch]
  - apiGroups: ["networking.k8s.io"]
    resources: [networkpolicies, ingresses]
    verbs: [get, list, watch]
  - apiGroups: ["policy"]
    resources: [podsecuritypolicies, poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: ["aquasecurity.github.io"]
    resources: [vulnerabilityreports, configauditreports, exposedsecretreports]
    verbs: [get, list, watch]
  - apiGroups: ["metrics.k8s.io"]
    resources: [pods, nodes]
    verbs: [get, list]
---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-intel-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-intel-reader
subjects:
  - kind: ServiceAccount
    name: cluster-intel
    namespace: utilities
---
# PersistentVolumeClaim for historical data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cluster-intel-data
  namespace: utilities
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-intel
  namespace: utilities
  labels:
    app.kubernetes.io/name: cluster-intel
    app.kubernetes.io/version: "4.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-intel
  template:
    metadata:
      labels:
        app: cluster-intel
    spec:
      serviceAccountName: cluster-intel
      securityContext:
        runAsNonRoot: false
        fsGroup: 1000
      containers:
        - name: cluster-intel
          image: python:3.11-slim
          command:
            - /bin/sh
            - -c
            - |
              pip install kubernetes --quiet
              python /app/app.py
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: CLUSTER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ANALYSIS_INTERVAL
              value: "60"
            - name: PROMETHEUS_URL
              value: ""
            - name: ALERT_WEBHOOK_URL
              value: ""
            - name: ALERT_THRESHOLD
              value: "50"
            - name: HISTORY_RETENTION_DAYS
              value: "30"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: app-code
              mountPath: /app
            - name: ui-code
              mountPath: /config
            - name: data
              mountPath: /data
      volumes:
        - name: app-code
          configMap:
            name: cluster-intel-app
        - name: ui-code
          configMap:
            name: cluster-intel-ui
        - name: data
          persistentVolumeClaim:
            claimName: cluster-intel-data
---
# Service
apiVersion: v1
kind: Service
metadata:
  name: cluster-intel
  namespace: utilities
  labels:
    app.kubernetes.io/name: cluster-intel
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: cluster-intel
---
# NetworkPolicy - Allow ingress only on port 8080
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cluster-intel
  namespace: utilities
spec:
  podSelector:
    matchLabels:
      app: cluster-intel
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    - {}  # Allow all egress for API access
