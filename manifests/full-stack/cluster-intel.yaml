    def init_db():
        try:
            os.makedirs(os.path.dirname(DB_PATH),exist_ok=True)
            conn=sqlite3.connect(DB_PATH)
            conn.execute('''CREATE TABLE IF NOT EXISTS history(
                id INTEGER PRIMARY KEY,timestamp TEXT,overall INTEGER,reliability INTEGER,
                security INTEGER,cost INTEGER,architecture INTEGER,vulns INTEGER,cis_pass INTEGER,cis_fail INTEGER)''')
            conn.execute('''CREATE TABLE IF NOT EXISTS alerts(
                id INTEGER PRIMARY KEY,timestamp TEXT,type TEXT,message TEXT,score INTEGER)''')
            conn.commit()
            conn.close()
            print("[DB] Initialized")
        except Exception as e:print(f"[DB] Init error: {e}")
    
    def save_history(scores,vulns,cis):
        try:
            conn=sqlite3.connect(DB_PATH)
            conn.execute('''INSERT INTO history(timestamp,overall,reliability,security,cost,architecture,vulns,cis_pass,cis_fail)
                VALUES(?,?,?,?,?,?,?,?,?)''',(datetime.utcnow().isoformat(),scores["overall"],scores["reliability"],
                scores["security"],scores["cost"],scores["architecture"],vulns,cis["pass"],cis["fail"]))
            # Cleanup old records
            cutoff=(datetime.utcnow()-timedelta(days=CFG["history_days"])).isoformat()
            conn.execute("DELETE FROM history WHERE timestamp < ?", (cutoff,))
            conn.commit()
            conn.close()
        except Exception as e:print(f"[DB] Save error: {e}")
    
    def get_history(days=7):
        try:
            conn=sqlite3.connect(DB_PATH)
            cutoff=(datetime.utcnow()-timedelta(days=days)).isoformat()
            rows=conn.execute("SELECT timestamp,overall,reliability,security,cost,architecture,vulns,cis_pass,cis_fail FROM history WHERE timestamp > ? ORDER BY timestamp",(cutoff,)).fetchall()
            conn.close()
            return [{"timestamp":r[0],"overall":r[1],"reliability":r[2],"security":r[3],"cost":r[4],"architecture":r[5],"vulns":r[6],"cisPass":r[7],"cisFail":r[8]} for r in rows]
        except:return []
    
