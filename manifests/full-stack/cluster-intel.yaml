    # ALERTING
    # ═══════════════════════════════════════════════════════════════
    def send_alert(score,issues):
        if not CFG["alert_webhook"]:return
        if score>=CFG["alert_threshold"]:return
        try:
            payload=json.dumps({
                "text":f"⚠️ *Cluster Health Alert*\nCluster: {CFG['cluster_id']}\nScore: {score}/100 (threshold: {CFG['alert_threshold']})\nIssues: {len(issues)}\n" + "\n".join([f"• [{i['severity']}] {i['title']}" for i in issues[:5]])
            }).encode()
            req=Request(CFG["alert_webhook"],data=payload,headers={"Content-Type":"application/json"})
            urlopen(req,timeout=10)
            print(f"[Alert] Sent (score={score})")
        except Exception as e:print(f"[Alert] Error: {e}")
    
    # ═══════════════════════════════════════════════════════════════
    # PROMETHEUS INTEGRATION
    # ═══════════════════════════════════════════════════════════════
    def query_prometheus(query):
        if not CFG["prometheus_url"]:return None
        try:
            url=f"{CFG['prometheus_url']}/api/v1/query?query={query}"
            r=urlopen(url,timeout=5)
            data=json.loads(r.read())
            if data["status"]=="success":
                return data["data"]["result"]
        except:pass
        return None
    
    def get_resource_metrics():
        metrics={"cpu_usage":{},"memory_usage":{},"cpu_requests":{},"memory_requests":{}}
        
        # CPU usage by pod
        result=query_prometheus('sum(rate(container_cpu_usage_seconds_total{container!=""}[5m]))by(namespace,pod)')
        if result:
            for r in result:
                key=f"{r['metric'].get('namespace','')}/{r['metric'].get('pod','')}"
                metrics["cpu_usage"][key]=float(r["value"][1])
        
        # Memory usage by pod
        result=query_prometheus('sum(container_memory_usage_bytes{container!=""})by(namespace,pod)')
        if result:
            for r in result:
                key=f"{r['metric'].get('namespace','')}/{r['metric'].get('pod','')}"
                metrics["memory_usage"][key]=float(r["value"][1])
        
        return metrics
    
