    # ═══════════════════════════════════════════════════════════════
    # CLUSTER CLEANUP DETECTION
    # ═══════════════════════════════════════════════════════════════
    def collect_cleanup(core,apps,batch_api=None):
        cleanup={"staleReplicaSets":[],"completedJobs":[],"failedJobs":[],"orphanedPVCs":[],"evictedPods":[],"emptyNamespaces":[],"oldConfigMaps":[],"unusedSecrets":[],"summary":{}}
        protected=CFG.get("protected_namespaces",["kube-system","kube-public","kube-node-lease"])
        try:
            # Stale ReplicaSets (0 replicas, old)
            for rs in apps.list_replica_set_for_all_namespaces().items:
                if rs.metadata.namespace in protected:continue
                if rs.spec.replicas==0 and (rs.status.replicas or 0)==0:
                    age_sec=get_age_seconds(rs.metadata.creation_timestamp)
                    if age_sec>86400:  # Older than 1 day
                        cleanup["staleReplicaSets"].append({"name":rs.metadata.name,"namespace":rs.metadata.namespace,"age":get_age(rs.metadata.creation_timestamp),"ageSeconds":age_sec,"ownerDeployment":rs.metadata.owner_references[0].name if rs.metadata.owner_references else None})
            
            # Completed and Failed Jobs
            if batch_api:
                for job in batch_api.list_job_for_all_namespaces().items:
                    if job.metadata.namespace in protected:continue
                    age_sec=get_age_seconds(job.metadata.creation_timestamp)
                    if job.status.succeeded and age_sec>86400:
                        cleanup["completedJobs"].append({"name":job.metadata.name,"namespace":job.metadata.namespace,"age":get_age(job.metadata.creation_timestamp),"completedAt":job.status.completion_time.isoformat() if job.status.completion_time else None})
                    elif job.status.failed and age_sec>3600:
                        cleanup["failedJobs"].append({"name":job.metadata.name,"namespace":job.metadata.namespace,"age":get_age(job.metadata.creation_timestamp),"reason":"Failed"})
            
            # Evicted Pods
            for pod in core.list_pod_for_all_namespaces().items:
                if pod.metadata.namespace in protected:continue
                if pod.status.phase=="Failed" and pod.status.reason=="Evicted":
                    cleanup["evictedPods"].append({"name":pod.metadata.name,"namespace":pod.metadata.namespace,"age":get_age(pod.metadata.creation_timestamp),"message":pod.status.message or"Evicted"})
            
            # Orphaned PVCs (not bound or pending for >1h)
            for pvc in core.list_persistent_volume_claim_for_all_namespaces().items:
                if pvc.metadata.namespace in protected:continue
                age_sec=get_age_seconds(pvc.metadata.creation_timestamp)
                if pvc.status.phase in["Pending","Lost"] and age_sec>3600:
                    cleanup["orphanedPVCs"].append({"name":pvc.metadata.name,"namespace":pvc.metadata.namespace,"phase":pvc.status.phase,"age":get_age(pvc.metadata.creation_timestamp),"storage":pvc.spec.resources.requests.get("storage","") if pvc.spec.resources and pvc.spec.resources.requests else ""})
            
            # Empty namespaces (no pods, not system)
            ns_with_pods=set(p.metadata.namespace for p in core.list_pod_for_all_namespaces().items)
            for ns in core.list_namespace().items:
                if ns.metadata.name in protected or ns.metadata.name.startswith("kube-"):continue
                if ns.metadata.name not in ns_with_pods:
                    age_sec=get_age_seconds(ns.metadata.creation_timestamp)
                    if age_sec>86400*7:  # Older than 7 days
                        cleanup["emptyNamespaces"].append({"name":ns.metadata.name,"age":get_age(ns.metadata.creation_timestamp)})
            
            # Old ConfigMaps (not referenced by any pod, >30 days old)
            used_cms=set()
            for p in core.list_pod_for_all_namespaces().items:
                for v in(p.spec.volumes or[]):
                    if v.config_map:used_cms.add(f"{p.metadata.namespace}/{v.config_map.name}")
                for c in(p.spec.containers or[]):
                    for ef in(c.env_from or[]):
                        if ef.config_map_ref:used_cms.add(f"{p.metadata.namespace}/{ef.config_map_ref.name}")
                    for e in(c.env or[]):
                        if e.value_from and e.value_from.config_map_key_ref:used_cms.add(f"{p.metadata.namespace}/{e.value_from.config_map_key_ref.name}")
            for cm in core.list_config_map_for_all_namespaces().items:
                if cm.metadata.namespace in protected:continue
                key=f"{cm.metadata.namespace}/{cm.metadata.name}"
                age_sec=get_age_seconds(cm.metadata.creation_timestamp)
                if key not in used_cms and age_sec>86400*30 and not cm.metadata.name.startswith("kube-"):
                    cleanup["oldConfigMaps"].append({"name":cm.metadata.name,"namespace":cm.metadata.namespace,"age":get_age(cm.metadata.creation_timestamp)})
            
            # Unused Secrets (not referenced, >30 days, not service-account)
            used_secrets=set()
            for p in core.list_pod_for_all_namespaces().items:
                for v in(p.spec.volumes or[]):
                    if v.secret:used_secrets.add(f"{p.metadata.namespace}/{v.secret.secret_name}")
                if p.spec.image_pull_secrets:
                    for s in p.spec.image_pull_secrets:used_secrets.add(f"{p.metadata.namespace}/{s.name}")
            for sec in core.list_secret_for_all_namespaces().items:
                if sec.metadata.namespace in protected:continue
                if sec.type in["kubernetes.io/service-account-token","kubernetes.io/dockercfg","kubernetes.io/dockerconfigjson"]:continue
                key=f"{sec.metadata.namespace}/{sec.metadata.name}"
                age_sec=get_age_seconds(sec.metadata.creation_timestamp)
                if key not in used_secrets and age_sec>86400*30 and not sec.metadata.name.startswith("default-token"):
                    cleanup["unusedSecrets"].append({"name":sec.metadata.name,"namespace":sec.metadata.namespace,"age":get_age(sec.metadata.creation_timestamp),"type":sec.type})
        except Exception as e:
            print(f"[Cleanup] Error: {e}")
            import traceback;traceback.print_exc()
        
        cleanup["summary"]={
            "staleReplicaSets":len(cleanup["staleReplicaSets"]),
            "completedJobs":len(cleanup["completedJobs"]),
            "failedJobs":len(cleanup["failedJobs"]),
            "orphanedPVCs":len(cleanup["orphanedPVCs"]),
            "evictedPods":len(cleanup["evictedPods"]),
            "emptyNamespaces":len(cleanup["emptyNamespaces"]),
            "oldConfigMaps":len(cleanup["oldConfigMaps"]),
            "unusedSecrets":len(cleanup["unusedSecrets"]),
            "total":sum([len(cleanup["staleReplicaSets"]),len(cleanup["completedJobs"]),len(cleanup["failedJobs"]),len(cleanup["orphanedPVCs"]),len(cleanup["evictedPods"]),len(cleanup["emptyNamespaces"]),len(cleanup["oldConfigMaps"]),len(cleanup["unusedSecrets"])])
        }
        return cleanup
    
    # ═══════════════════════════════════════════════════════════════
    # POD DIAGNOSIS - Actually fetch and analyze pod issues
    # ═══════════════════════════════════════════════════════════════
    def diagnose_pod(core,ns,name):
        """Actually diagnose a pod by fetching logs, events, and analyzing the problem"""
        result={"namespace":ns,"name":name,"logs":None,"events":[],"status":{},"analysis":{},"recommendations":[]}
        try:
            # Get pod details
            pod=core.read_namespaced_pod(name,ns)
            result["status"]={
                "phase":pod.status.phase,
                "reason":pod.status.reason,
                "message":pod.status.message,
                "startTime":pod.status.start_time.isoformat() if pod.status.start_time else None,
                "containers":[]
            }
            
            # Analyze each container
            for cs in(pod.status.container_statuses or[]):
                container_info={"name":cs.name,"ready":cs.ready,"restarts":cs.restart_count,"state":None,"lastState":None}
                if cs.state.running:
                    container_info["state"]={"status":"running","startedAt":cs.state.running.started_at.isoformat() if cs.state.running.started_at else None}
                elif cs.state.waiting:
                    container_info["state"]={"status":"waiting","reason":cs.state.waiting.reason,"message":cs.state.waiting.message}
                elif cs.state.terminated:
                    container_info["state"]={"status":"terminated","reason":cs.state.terminated.reason,"exitCode":cs.state.terminated.exit_code,"message":cs.state.terminated.message}
                if cs.last_state and cs.last_state.terminated:
                    lt=cs.last_state.terminated
                    container_info["lastState"]={"reason":lt.reason,"exitCode":lt.exit_code,"message":lt.message,"finishedAt":lt.finished_at.isoformat() if lt.finished_at else None}
                result["status"]["containers"].append(container_info)
            
            # Get container logs (previous instance if crashed)
            try:
                logs=core.read_namespaced_pod_log(name,ns,previous=True,tail_lines=50)
                result["logs"]=logs[-3000:] if logs else None  # Limit size
            except:
                try:
                    logs=core.read_namespaced_pod_log(name,ns,tail_lines=50)
                    result["logs"]=logs[-3000:] if logs else None
                except:
                    result["logs"]=None
            
            # Get events
            events=core.list_namespaced_event(ns,field_selector=f"involvedObject.name={name}")
            for e in sorted(events.items,key=lambda x:x.metadata.creation_timestamp or datetime.min.replace(tzinfo=timezone.utc),reverse=True)[:10]:
                result["events"].append({"type":e.type,"reason":e.reason,"message":e.message,"count":e.count,"age":get_age(e.last_timestamp or e.metadata.creation_timestamp)})
            
            # Get resource configuration
            for c in(pod.spec.containers or[]):
                if c.resources:
                    result["status"]["resources"]={"limits":c.resources.limits,"requests":c.resources.requests}
            
            # ANALYZE THE ACTUAL PROBLEM
            analysis=analyze_pod_problem(result)
            result["analysis"]=analysis
            result["recommendations"]=generate_recommendations(analysis,ns,name)
            
        except Exception as e:
            result["error"]=str(e)
            import traceback;traceback.print_exc()
        return result
    
    def analyze_pod_problem(diag):
        """Analyze diagnostic data and determine the actual root cause"""
        analysis={"rootCause":"Unknown","severity":"medium","details":"","category":"unknown"}
        
        containers=diag.get("status",{}).get("containers",[])
        logs=diag.get("logs","") or ""
        events=diag.get("events",[])
        
        for c in containers:
            state=c.get("state",{})
            last_state=c.get("lastState",{})
            
            # Check for OOMKilled
            if last_state.get("reason")=="OOMKilled" or state.get("reason")=="OOMKilled":
                analysis["rootCause"]="Out of Memory (OOMKilled)"
                analysis["severity"]="high"
                analysis["category"]="resources"
                analysis["details"]=f"Container '{c['name']}' was killed because it exceeded its memory limit. Exit code: {last_state.get('exitCode', 137)}"
                return analysis
            
            # Check exit codes
            exit_code=last_state.get("exitCode") or state.get("exitCode")
            if exit_code:
                if exit_code==137:
                    analysis["rootCause"]="Out of Memory (SIGKILL)"
                    analysis["severity"]="high"
                    analysis["category"]="resources"
                    analysis["details"]="Container received SIGKILL (exit 137), typically due to OOM or external kill signal"
                    return analysis
                elif exit_code==1:
                    analysis["rootCause"]="Application Error"
                    analysis["severity"]="high"
                    analysis["category"]="application"
                    # Extract error from logs
                    error_lines=[l for l in logs.split('\n') if 'error' in l.lower() or 'exception' in l.lower() or 'fatal' in l.lower()][-5:]
                    analysis["details"]=f"Application exited with error code 1.\n\nLast errors from logs:\n"+('\n'.join(error_lines) if error_lines else "No obvious errors in logs")
                    return analysis
                elif exit_code==127:
                    analysis["rootCause"]="Command Not Found"
                    analysis["severity"]="critical"
                    analysis["category"]="configuration"
                    analysis["details"]="The container's entrypoint or command was not found. Check the image and command configuration."
                    return analysis
                elif exit_code==126:
                    analysis["rootCause"]="Permission Denied"
                    analysis["severity"]="critical"
                    analysis["category"]="configuration"
                    analysis["details"]="The container's entrypoint exists but is not executable. Check file permissions in the image."
                    return analysis
            
            # Check waiting state reasons
            wait_reason=state.get("reason","")
            if wait_reason=="CrashLoopBackOff":
                # Dig deeper into why
                if "error" in logs.lower() or "exception" in logs.lower():
                    error_lines=[l for l in logs.split('\n') if 'error' in l.lower() or 'exception' in l.lower() or 'failed' in l.lower()][-5:]
                    analysis["rootCause"]="Application Crash"
                    analysis["severity"]="high"
                    analysis["category"]="application"
                    analysis["details"]="Application is crashing repeatedly.\n\nErrors from logs:\n"+('\n'.join(error_lines) if error_lines else "Check full logs for details")
                    return analysis
            elif wait_reason in["ImagePullBackOff","ErrImagePull"]:
                analysis["rootCause"]="Image Pull Failure"
                analysis["severity"]="critical"
                analysis["category"]="image"
                img_events=[e["message"] for e in events if "pull" in e.get("message","").lower()]
                analysis["details"]=f"Cannot pull container image.\n\n{img_events[0] if img_events else 'Check image name and registry credentials'}"
                return analysis
            elif wait_reason=="CreateContainerConfigError":
                analysis["rootCause"]="Configuration Error"
                analysis["severity"]="critical"
                analysis["category"]="configuration"
                cfg_events=[e["message"] for e in events if "config" in e.get("message","").lower() or "secret" in e.get("message","").lower() or "configmap" in e.get("message","").lower()]
                analysis["details"]=f"Container configuration error.\n\n{cfg_events[0] if cfg_events else 'Missing ConfigMap or Secret reference'}"
                return analysis
        
        # Check events for clues - prioritize by severity
        # First check for OOM (highest priority)
        for e in events:
            msg=e.get("message","").lower()
            if "oom" in msg or "memory" in msg:
                analysis["rootCause"]="Memory Issue"
                analysis["severity"]="high"
                analysis["category"]="resources"
                analysis["details"]=e.get("message","")
                return analysis
        
        # Check for liveness probe failures (cause restarts - high severity)
        liveness_events=[e for e in events if "liveness probe failed" in e.get("message","").lower()]
        if liveness_events:
            e=max(liveness_events,key=lambda x:x.get("count",0))  # Get most frequent
            analysis["rootCause"]="Liveness Probe Failure"
            analysis["severity"]="high"
            analysis["category"]="health"
            analysis["details"]=f"Health check failing repeatedly ({e.get('count',1)} times).\n\n{e.get('message','')}\n\nThe container is being killed and restarted because it's not responding to health checks."
            return analysis
        
        # Check for readiness probe failures (medium severity)
        readiness_events=[e for e in events if "readiness probe failed" in e.get("message","").lower()]
        if readiness_events:
            e=max(readiness_events,key=lambda x:x.get("count",0))
            analysis["rootCause"]="Readiness Probe Failure"
            analysis["severity"]="medium"
            analysis["category"]="health"
            analysis["details"]=f"Readiness check failing ({e.get('count',1)} times).\n\n{e.get('message','')}"
            return analysis
        
        # Fallback - check logs for common patterns
        if logs:
            if "connection refused" in logs.lower() or "connection timed out" in logs.lower():
                analysis["rootCause"]="Connection Failure"
                analysis["severity"]="high"
                analysis["category"]="network"
                analysis["details"]="Application cannot connect to a required service (database, API, etc.)"
                return analysis
            if "permission denied" in logs.lower():
                analysis["rootCause"]="Permission Error"
                analysis["severity"]="high"
                analysis["category"]="security"
                analysis["details"]="Application lacks required permissions"
                return analysis
            if "no such file" in logs.lower() or "file not found" in logs.lower():
                analysis["rootCause"]="Missing File/Config"
                analysis["severity"]="high"
                analysis["category"]="configuration"
                analysis["details"]="Application cannot find required configuration file or resource"
                return analysis
        
        return analysis
    
    def generate_recommendations(analysis,ns,name):
        """Generate specific, actionable recommendations based on the analysis"""
        recs=[]
        cat=analysis.get("category","unknown")
        
        if cat=="resources":
            recs.append({"priority":"high","action":"Increase Memory Limit","detail":"The container is running out of memory. Increase the memory limit in the deployment.","command":f"kubectl set resources deployment/$(kubectl get pod {name} -n {ns} -o jsonpath='{{.metadata.ownerReferences[0].name}}' | sed 's/-[a-z0-9]*$//') -n {ns} --limits=memory=1Gi"})
            recs.append({"priority":"medium","action":"Check Current Usage","detail":"View actual memory consumption to right-size the limit.","command":f"kubectl top pod {name} -n {ns}"})
            recs.append({"priority":"low","action":"Look for Memory Leaks","detail":"If the app slowly consumes more memory over time, there may be a memory leak.","command":f"kubectl logs {name} -n {ns} --tail=100 | grep -i 'memory\\|heap\\|gc'"})
        elif cat=="application":
            recs.append({"priority":"high","action":"Check Application Logs","detail":"Review the full logs to understand the crash reason.","command":f"kubectl logs {name} -n {ns} --previous --tail=200"})
            recs.append({"priority":"medium","action":"Check Environment Variables","detail":"Verify all required environment variables are set.","command":f"kubectl get pod {name} -n {ns} -o jsonpath='{{.spec.containers[0].env}}' | python3 -m json.tool"})
            recs.append({"priority":"medium","action":"Verify Dependencies","detail":"Ensure all services the app depends on are available.","command":f"kubectl get endpoints -n {ns}"})
        elif cat=="configuration":
            recs.append({"priority":"high","action":"Check ConfigMaps","detail":"Verify referenced ConfigMaps exist.","command":f"kubectl describe pod {name} -n {ns} | grep -A5 'ConfigMap'"})
            recs.append({"priority":"high","action":"Check Secrets","detail":"Verify referenced Secrets exist.","command":f"kubectl get secrets -n {ns}"})
            recs.append({"priority":"medium","action":"Verify Volume Mounts","detail":"Check if all volumes are properly mounted.","command":f"kubectl describe pod {name} -n {ns} | grep -A10 'Volumes:'"})
        elif cat=="image":
            recs.append({"priority":"high","action":"Verify Image Exists","detail":"Check if the image name and tag are correct.","command":f"kubectl get pod {name} -n {ns} -o jsonpath='{{.spec.containers[*].image}}'"})
            recs.append({"priority":"high","action":"Check Pull Secrets","detail":"Verify image pull credentials are configured.","command":f"kubectl get pod {name} -n {ns} -o jsonpath='{{.spec.imagePullSecrets}}'"})
        elif cat=="health":
            recs.append({"priority":"high","action":"Test Health Endpoint","detail":"Manually test if the health endpoint responds.","command":f"kubectl exec {name} -n {ns} -- wget -qO- http://localhost:8080/health 2>/dev/null || echo 'Health endpoint not responding'"})
            recs.append({"priority":"medium","action":"Increase Probe Timeout","detail":"The app may need more time to respond. Edit the deployment to increase timeoutSeconds.","command":f"kubectl get deploy -n {ns} -o yaml | grep -A10 'livenessProbe'"})
        elif cat=="network":
            recs.append({"priority":"high","action":"Check Service Connectivity","detail":"Verify the pod can reach required services.","command":f"kubectl exec {name} -n {ns} -- nslookup kubernetes.default"})
            recs.append({"priority":"medium","action":"Check Network Policies","detail":"Network policies may be blocking traffic.","command":f"kubectl get networkpolicies -n {ns}"})
        else:
            recs.append({"priority":"high","action":"View Full Logs","detail":"Check the complete logs for error messages.","command":f"kubectl logs {name} -n {ns} --previous --tail=200"})
            recs.append({"priority":"medium","action":"Describe Pod","detail":"Get full pod details including events.","command":f"kubectl describe pod {name} -n {ns}"})
        
        return recs
    
    # ═══════════════════════════════════════════════════════════════
    # CIS BENCHMARK CHECKS
    # ═══════════════════════════════════════════════════════════════
    def run_cis_checks(core,rbac,pods):
        results=[]
        
        def add_result(id,status,details,affected=[]):
            c=CIS_CHECKS.get(id,{})
            results.append({"id":id,"status":status,"details":details,"affectedResources":affected[:15],
                "title":c.get("title",""),"category":c.get("category",""),"severity":c.get("severity","medium"),
                "description":c.get("description",""),"impact":c.get("impact",""),"remediation":c.get("remediation","")})
        
        # 5.1.1 - cluster-admin bindings
        try:
            bindings=rbac.list_cluster_role_binding()
            admin_bindings=[b for b in bindings.items if b.role_ref.name=="cluster-admin"and b.subjects]
            subjects=[s.name for b in admin_bindings for s in(b.subjects or[])]
            add_result("5.1.1","FAIL"if len(admin_bindings)>3 else"PASS",f"{len(admin_bindings)} cluster-admin bindings ({len(subjects)} subjects)",subjects)
        except:add_result("5.1.1","WARN","Could not check")
        
        # 5.1.3 - wildcards in roles
        try:
            roles=rbac.list_cluster_role()
            wildcard_roles=[]
            for r in roles.items:
                for rule in(r.rules or[]):
                    if '*'in str(rule.resources or[])or'*'in str(rule.verbs or[]):
                        wildcard_roles.append(r.metadata.name)
                        break
            add_result("5.1.3","FAIL"if len(wildcard_roles)>5 else"WARN"if wildcard_roles else"PASS",f"{len(wildcard_roles)} roles with wildcards",wildcard_roles)
        except:add_result("5.1.3","WARN","Could not check")
        
        # 5.1.6 - auto-mounted service account tokens
        auto_mount=[p for p in pods if p.get("automountServiceAccountToken")!=False and p.get("serviceAccount")!="default"]
        add_result("5.1.6","WARN"if len(auto_mount)>len(pods)*0.5 else"PASS",f"{len(auto_mount)}/{len(pods)} pods auto-mount SA token",[f"{p['namespace']}/{p['name']}"for p in auto_mount])
        
        # 5.2.1 - privileged containers
        priv=[p for p in pods if any((c.get("securityContext") or {}).get("privileged")for c in p.get("raw_containers",[]))]
        add_result("5.2.1","FAIL"if priv else"PASS",f"{len(priv)} privileged pods",[f"{p['namespace']}/{p['name']}"for p in priv])
        
        # 5.2.2 - allowPrivilegeEscalation
        esc=[p for p in pods if any((c.get("securityContext") or {}).get("allowPrivilegeEscalation")!=False for c in p.get("raw_containers",[]))]
        add_result("5.2.2","WARN"if len(esc)>len(pods)*0.5 else"PASS",f"{len(esc)}/{len(pods)} allow privilege escalation",[f"{p['namespace']}/{p['name']}"for p in esc])
        
        # 5.2.3 - root containers
        root=[p for p in pods if not (p.get("podSecurityContext") or {}).get("runAsNonRoot") and not any((c.get("securityContext") or {}).get("runAsNonRoot")for c in p.get("raw_containers",[]))]
        add_result("5.2.3","WARN"if len(root)>len(pods)*0.3 else"PASS",f"{len(root)}/{len(pods)} may run as root",[f"{p['namespace']}/{p['name']}"for p in root])
        
        # 5.2.4 - hostNetwork
        hostnet=[p for p in pods if p.get("hostNetwork")]
        add_result("5.2.4","FAIL"if len(hostnet)>2 else"PASS",f"{len(hostnet)} pods with hostNetwork",[f"{p['namespace']}/{p['name']}"for p in hostnet])
        
        # 5.2.5 - hostPID
        hostpid=[p for p in pods if p.get("hostPID")]
        add_result("5.2.5","FAIL"if hostpid else"PASS",f"{len(hostpid)} pods with hostPID",[f"{p['namespace']}/{p['name']}"for p in hostpid])
        
        # 5.2.6 - hostIPC
        hostipc=[p for p in pods if p.get("hostIPC")]
        add_result("5.2.6","FAIL"if hostipc else"PASS",f"{len(hostipc)} pods with hostIPC",[f"{p['namespace']}/{p['name']}"for p in hostipc])
        
        # 5.2.7 - hostPath volumes
        hostpath=[p for p in pods if any(v.get("type")=="hostPath"for v in p.get("volumes",[]))]
        add_result("5.2.7","FAIL"if len(hostpath)>3 else"WARN"if hostpath else"PASS",f"{len(hostpath)} pods with hostPath volumes",[f"{p['namespace']}/{p['name']}"for p in hostpath])
        
        # 5.2.10 - seccomp
        noseccomp=[p for p in pods if not p.get("podSecurityContext",{}).get("seccompProfile")]
        add_result("5.2.10","WARN"if len(noseccomp)>len(pods)*0.5 else"PASS",f"{len(noseccomp)}/{len(pods)} without seccomp profile",[f"{p['namespace']}/{p['name']}"for p in noseccomp])
        
        # 5.2.11 - capabilities
        caps=[p for p in pods if not any(((c.get("securityContext") or {}).get("capabilities") or {}).get("drop")for c in p.get("raw_containers",[]))]
        add_result("5.2.11","WARN"if len(caps)>len(pods)*0.5 else"PASS",f"{len(caps)}/{len(pods)} don't drop capabilities",[f"{p['namespace']}/{p['name']}"for p in caps])
        
        # 5.2.12 - readOnlyRootFilesystem
        rw=[p for p in pods if not any((c.get("securityContext") or {}).get("readOnlyRootFilesystem")for c in p.get("raw_containers",[]))]
        add_result("5.2.12","WARN"if len(rw)>len(pods)*0.7 else"PASS",f"{len(rw)}/{len(pods)} without read-only root filesystem",[f"{p['namespace']}/{p['name']}"for p in rw])
        
        # 5.3.1 - NetworkPolicies
        try:
            net_api=client.NetworkingV1Api()
            policies=net_api.list_network_policy_for_all_namespaces()
            namespaces=set(p["namespace"]for p in pods)
            covered=set(p.metadata.namespace for p in policies.items)
            uncovered=list(namespaces-covered-{"kube-system","kube-public","kube-node-lease"})
            add_result("5.3.1","FAIL"if len(uncovered)>2 else"WARN"if uncovered else"PASS",f"{len(uncovered)} namespaces without NetworkPolicy",uncovered)
        except:add_result("5.3.1","WARN","Could not check")
        
        # 5.7.2 - securityContext set
        nosc=[p for p in pods if not p.get("podSecurityContext")and not any(c.get("securityContext")for c in p.get("raw_containers",[]))]
        add_result("5.7.2","WARN"if len(nosc)>len(pods)*0.3 else"PASS",f"{len(nosc)}/{len(pods)} without securityContext",[f"{p['namespace']}/{p['name']}"for p in nosc])
        
        # 5.7.4 - default service accounts
        default_sa=[p for p in pods if p.get("serviceAccount")=="default"and p.get("namespace")not in["kube-system"]]
        add_result("5.7.4","WARN"if default_sa else"PASS",f"{len(default_sa)} pods using default ServiceAccount",[f"{p['namespace']}/{p['name']}"for p in default_sa])
        
        return results
    
    # ═══════════════════════════════════════════════════════════════
    # ANALYSIS ENGINE
    # ═══════════════════════════════════════════════════════════════
    def analyze(data,vulns,cis,metrics):
        pods=data["pods"]
        total=max(len(pods),1)
        
        # Reliability Score
        healthy=len([p for p in pods if p["phase"]=="Running"and p["restarts"]<5 and all(c["ready"]for c in p["containers"])])
        crash=len([p for p in pods if any(c.get("reason")=="CrashLoopBackOff"for c in p["containers"])])
        pending=len([p for p in pods if p["phase"]=="Pending"])
        reliability=max(0,min(100,int((healthy/total)*100-crash*10-pending*5-len(data["events"])*0.5)))
        
        # Security Score
        crit_vulns=len([v for v in vulns if v["severity"]=="critical"])
        high_vulns=len([v for v in vulns if v["severity"]=="high"])
        cis_fails=len([c for c in cis if c["status"]=="FAIL"])
        cis_warns=len([c for c in cis if c["status"]=="WARN"])
        priv=len([p for p in pods if any((c.get("securityContext") or {}).get("privileged")for c in p.get("raw_containers",[]))])
        security=max(0,min(100,100-crit_vulns*5-high_vulns*2-cis_fails*8-cis_warns*3-priv*10))
        
        # Cost Score (requires Prometheus for accuracy)
        cost=70
        if metrics and metrics.get("cpu_usage"):
            # Basic utilization analysis
            cost=75
        
        # Architecture Score
        no_limits=len([p for p in pods if not any(c.get("resources",{}).get("limits")for c in p.get("raw_containers",[]))])
        no_probes=len([p for p in pods if not any(c.get("livenessProbe")or c.get("readinessProbe")for c in p.get("raw_containers",[]))])
        single_replica=len([d for d in data.get("deployments",[])if d["replicas"]==1])
        architecture=max(0,min(100,85-no_limits*2-no_probes-single_replica*3-cis_fails*5))
        
        overall=int(reliability*0.25+security*0.40+cost*0.15+architecture*0.20)
        
        # Detect Issues
        issues=[]
        
        crash_pods=[p for p in pods if any(c.get("reason")=="CrashLoopBackOff"for c in p["containers"])]
        if crash_pods:
            issues.append({"id":"crash","severity":"critical","category":"reliability","title":f"CrashLoopBackOff ({len(crash_pods)} pods)",
                "description":"Containers crashing repeatedly","affectedPods":[{"name":p["name"],"namespace":p["namespace"],"restarts":p["restarts"]}for p in crash_pods],
                "resolution":RESOLUTIONS["CrashLoopBackOff"],"confidence":0.95})
        
        oom=[p for p in pods if any(c.get("reason")=="OOMKilled"for c in p["containers"])]
        if oom:
            issues.append({"id":"oom","severity":"critical","category":"reliability","title":f"OOMKilled ({len(oom)} pods)",
                "description":"Containers killed due to memory limits","affectedPods":[{"name":p["name"],"namespace":p["namespace"]}for p in oom],
                "resolution":RESOLUTIONS["OOMKilled"],"confidence":0.98})
        
        high_restart=[p for p in pods if p["restarts"]>=5 and p not in crash_pods]
        if high_restart:
            issues.append({"id":"restarts","severity":"medium","category":"reliability","title":f"High Restart Count ({len(high_restart)} pods)",
                "description":"Pods with 5+ restarts indicate instability","affectedPods":[{"name":p["name"],"namespace":p["namespace"],"restarts":p["restarts"]}for p in high_restart],
                "resolution":RESOLUTIONS["HighRestarts"],"confidence":0.85})
        
        if crit_vulns>0:
            issues.append({"id":"crit-vulns","severity":"critical","category":"security","title":f"Critical Vulnerabilities ({crit_vulns})",
                "description":"Container images contain critical CVEs requiring immediate attention","confidence":0.98})
        
        if cis_fails>0:
            issues.append({"id":"cis-fails","severity":"high","category":"compliance","title":f"CIS Benchmark Failures ({cis_fails})",
                "description":"Cluster fails security benchmark controls","confidence":0.95})
        
        if no_limits>total*0.3:
            issues.append({"id":"no-limits","severity":"medium","category":"architecture","title":f"Missing Resource Limits ({no_limits} pods)",
                "description":"Pods without resource limits risk node resource exhaustion","confidence":0.90})
        
        return{
            "scores":{"overall":overall,"reliability":reliability,"security":security,"cost":cost,"architecture":architecture},
            "issues":issues,
            "summary":f"{len(issues)} issues. {crit_vulns} critical vulns. {cis_fails} CIS failures."
        }
    
    # ═══════════════════════════════════════════════════════════════
    # REPORT BUILDER
    # ═══════════════════════════════════════════════════════════════
    def build_report(data,analysis,vulns,cis):
        sev_count=lambda s:len([v for v in vulns if v["severity"]==s])
        unique_cves=len(set(v["cve"]for v in vulns))
        images_affected=len(set(v["image"]for v in vulns))
        
        vuln_by_image=defaultdict(list)
        vuln_by_cve=defaultdict(list)
        for v in vulns:
            vuln_by_image[v["image"]].append(v)
            vuln_by_cve[v["cve"]].append({"image":v["image"],"namespace":v["namespace"]})
        
        cis_by_cat=defaultdict(lambda:{"pass":0,"fail":0,"warn":0})
        for c in cis:
            cis_by_cat[c.get("category","Other")][c["status"].lower()]+=1
        
        return{
            "clusterId":CFG["cluster_id"],"timestamp":datetime.utcnow().isoformat()+"Z",
            "scores":analysis["scores"],
            "summary":{
                "totalNodes":len(data["nodes"]),"totalPods":len(data["pods"]),
                "totalNamespaces":len(data.get("namespaces",[])),"totalImages":len(data["images"]),
                "healthyPods":len([p for p in data["pods"]if p["phase"]=="Running"and p["restarts"]<5]),
                "unhealthyPods":len([p for p in data["pods"]if p["phase"]!="Running"or p["restarts"]>=5])
            },
            "topIssues":analysis["issues"],"allPods":data["pods"],
            "vulnerabilities":{
                "stats":{"critical":sev_count("critical"),"high":sev_count("high"),"medium":sev_count("medium"),"low":sev_count("low"),"total":len(vulns),"uniqueCves":unique_cves,"imagesAffected":images_affected},
                "items":vulns,"byImage":dict(vuln_by_image),"byCve":dict(vuln_by_cve)
            },
            "cisBenchmark":{
                "stats":{"pass":len([c for c in cis if c["status"]=="PASS"]),"fail":len([c for c in cis if c["status"]=="FAIL"]),"warn":len([c for c in cis if c["status"]=="WARN"]),"total":len(cis),"byCategory":dict(cis_by_cat)},
                "checks":cis
            },
            "history":get_history(7),
            "aiSummary":analysis["summary"]
        }
    
    # ═══════════════════════════════════════════════════════════════
    # MAIN WORKER
    # ═══════════════════════════════════════════════════════════════
    def worker():
        core,apps,rbac,custom,batch=init_k8s()
        init_db()
        while True:
            try:
                print(f"\n[{datetime.utcnow().isoformat()}] Starting analysis...")
                data=collect(core,apps)
                vulns=get_trivy_vulns(custom)if custom else[]
                if not vulns:
                    vulns=scan_images_fallback(data["images"])
                    print(f"[Scan] Fallback: {len(vulns)} vulnerabilities")
                metrics=get_resource_metrics()
                cis=run_cis_checks(core,rbac,data["pods"])if core else[]
                cleanup=collect_cleanup(core,apps,batch)if core else{}
                analysis=analyze(data,vulns,cis,metrics)
                report=build_report(data,analysis,vulns,cis)
                report["cleanup"]=cleanup
                
                with lock:state["report"]=report
                
                # Save history
                cis_stats=report["cisBenchmark"]["stats"]
                save_history(analysis["scores"],len(vulns),cis_stats)
                print(f"[Cleanup] Found {cleanup.get('summary',{}).get('total',0)} items for cleanup")
                
                # Send alerts if score is low
                send_alert(analysis["scores"]["overall"],analysis["issues"])
                
                print(f"[{datetime.utcnow().isoformat()}] Done: Score={report['scores']['overall']} Vulns={len(vulns)} CIS={len(cis)}")
            except Exception as e:
                import traceback;traceback.print_exc()
            time.sleep(CFG["interval"])
    
    # ═══════════════════════════════════════════════════════════════
    # HTTP SERVER
    # ═══════════════════════════════════════════════════════════════
    HTML=open('/config/ui.html').read()if os.path.exists('/config/ui.html')else(open('/app/ui.html').read()if os.path.exists('/app/ui.html')else'<h1>Loading...</h1>')
    
    class H(BaseHTTPRequestHandler):
        def log_message(self,f,*a):pass
        def j(self,d,s=200):
            self.send_response(s)
            self.send_header("Content-Type","application/json")
            self.send_header("Access-Control-Allow-Origin","*")
            self.end_headers()
            self.wfile.write(json.dumps(d).encode())
        
        def do_GET(self):
            parsed=urlparse(self.path)
            p=parsed.path
            q=parse_qs(parsed.query)
            
            if p in["/","/index.html"]:
                self.send_response(200)
                self.send_header("Content-Type","text/html")
                self.end_headers()
                self.wfile.write(HTML.encode())
            elif p in["/healthz","/readyz"]:
                self.j({"status":"ok"})
            elif p=="/api/v1/health":
                with lock:r=state.get("report")
                self.j(r if r else{"error":"Initializing..."},200 if r else 503)
            elif p=="/api/v1/scores":
                with lock:r=state.get("report")
                self.j(r["scores"]if r else{})
            elif p=="/api/v1/history":
                days=int(q.get("days",["7"])[0])
                self.j(get_history(days))
            elif p=="/api/v1/export":
                fmt=q.get("format",["json"])[0]
                with lock:r=state.get("report")
                if r:
                    self.send_response(200)
                    self.send_header("Content-Type","application/json")
                    self.send_header("Content-Disposition",f"attachment; filename=cluster-report-{r['timestamp'][:10]}.json")
                    self.end_headers()
                    self.wfile.write(json.dumps(r,indent=2).encode())
                else:
                    self.j({"error":"No data"},503)
            else:
                self.send_response(404)
                self.end_headers()
        
        def do_POST(self):
            if self.path=="/api/v1/alerts/test":
                send_alert(0,[{"severity":"test","title":"Test Alert"}])
                self.j({"status":"sent"})
            elif self.path=="/api/v1/scan":
                self.j({"status":"triggered"})
            elif self.path=="/api/v1/diagnose/pod":
                # Actually diagnose a pod - fetch logs, events, and analyze
                try:
                    data=json.loads(self.rfile.read(int(self.headers.get("Content-Length",0))))
                    ns,name=data.get("namespace"),data.get("name")
                    core,apps,_,_,_=init_k8s()
                    diagnosis=diagnose_pod(core,ns,name)
                    self.j(diagnosis)
                except Exception as e:
                    import traceback;traceback.print_exc()
                    self.j({"error":str(e)})
            elif self.path=="/api/v1/cleanup/replicaset":
                try:
                    data=json.loads(self.rfile.read(int(self.headers.get("Content-Length",0))))
                    ns,name=data.get("namespace"),data.get("name")
                    if ns in CFG.get("protected_namespaces",[]):
                        self.j({"success":False,"message":"Protected namespace"})
                    else:
                        core,apps,_,_,_=init_k8s()
                        apps.delete_namespaced_replica_set(name,ns)
                        self.j({"success":True,"message":f"Deleted ReplicaSet {ns}/{name}"})
                except Exception as e:self.j({"success":False,"message":str(e)})
            elif self.path=="/api/v1/cleanup/job":
                try:
                    data=json.loads(self.rfile.read(int(self.headers.get("Content-Length",0))))
                    ns,name=data.get("namespace"),data.get("name")
                    if ns in CFG.get("protected_namespaces",[]):
                        self.j({"success":False,"message":"Protected namespace"})
                    else:
                        core,_,_,_,batch=init_k8s()
                        batch.delete_namespaced_job(name,ns,propagation_policy="Background")
                        self.j({"success":True,"message":f"Deleted Job {ns}/{name}"})
                except Exception as e:self.j({"success":False,"message":str(e)})
            elif self.path=="/api/v1/cleanup/pod":
                try:
                    data=json.loads(self.rfile.read(int(self.headers.get("Content-Length",0))))
                    ns,name=data.get("namespace"),data.get("name")
                    if ns in CFG.get("protected_namespaces",[]):
                        self.j({"success":False,"message":"Protected namespace"})
                    else:
                        core,_,_,_,_=init_k8s()
                        core.delete_namespaced_pod(name,ns)
                        self.j({"success":True,"message":f"Deleted Pod {ns}/{name}"})
                except Exception as e:self.j({"success":False,"message":str(e)})
            elif self.path=="/api/v1/cleanup/pvc":
                try:
                    data=json.loads(self.rfile.read(int(self.headers.get("Content-Length",0))))
                    ns,name=data.get("namespace"),data.get("name")
                    if ns in CFG.get("protected_namespaces",[]):
                        self.j({"success":False,"message":"Protected namespace"})
                    else:
                        core,_,_,_,_=init_k8s()
                        core.delete_namespaced_persistent_volume_claim(name,ns)
                        self.j({"success":True,"message":f"Deleted PVC {ns}/{name}"})
                except Exception as e:self.j({"success":False,"message":str(e)})
            elif self.path=="/api/v1/cleanup/configmap":
                try:
                    data=json.loads(self.rfile.read(int(self.headers.get("Content-Length",0))))
                    ns,name=data.get("namespace"),data.get("name")
                    if ns in CFG.get("protected_namespaces",[]):
                        self.j({"success":False,"message":"Protected namespace"})
                    else:
                        core,_,_,_,_=init_k8s()
                        core.delete_namespaced_config_map(name,ns)
                        self.j({"success":True,"message":f"Deleted ConfigMap {ns}/{name}"})
                except Exception as e:self.j({"success":False,"message":str(e)})
            elif self.path=="/api/v1/cleanup/secret":
                try:
                    data=json.loads(self.rfile.read(int(self.headers.get("Content-Length",0))))
                    ns,name=data.get("namespace"),data.get("name")
                    if ns in CFG.get("protected_namespaces",[]):
                        self.j({"success":False,"message":"Protected namespace"})
                    else:
                        core,_,_,_,_=init_k8s()
                        core.delete_namespaced_secret(name,ns)
                        self.j({"success":True,"message":f"Deleted Secret {ns}/{name}"})
                except Exception as e:self.j({"success":False,"message":str(e)})
            elif self.path=="/api/v1/cleanup/bulk":
                try:
                    data=json.loads(self.rfile.read(int(self.headers.get("Content-Length",0))))
                    category=data.get("category")
                    core,apps,_,_,batch=init_k8s()
                    with lock:r=state.get("report",{})
                    cleanup=r.get("cleanup",{})
                    deleted,failed=0,0
                    items=cleanup.get(category,[])
                    for item in items:
                        ns,name=item.get("namespace"),item.get("name")
                        if ns in CFG.get("protected_namespaces",[]):continue
                        try:
                            if category=="staleReplicaSets":apps.delete_namespaced_replica_set(name,ns)
                            elif category in["completedJobs","failedJobs"]:batch.delete_namespaced_job(name,ns,propagation_policy="Background")
                            elif category=="evictedPods":core.delete_namespaced_pod(name,ns)
                            elif category=="orphanedPVCs":core.delete_namespaced_persistent_volume_claim(name,ns)
                            elif category=="oldConfigMaps":core.delete_namespaced_config_map(name,ns)
                            elif category=="unusedSecrets":core.delete_namespaced_secret(name,ns)
                            deleted+=1
                        except:failed+=1
                    self.j({"success":True,"deleted":deleted,"failed":failed})
                except Exception as e:self.j({"success":False,"message":str(e)})
            else:
                self.send_response(404)
                self.end_headers()
        
        def do_OPTIONS(self):
            self.send_response(200)
            self.send_header("Access-Control-Allow-Origin","*")
            self.send_header("Access-Control-Allow-Methods","GET,POST,OPTIONS")
            self.end_headers()
    
    if __name__=="__main__":
        print(f'''
    ╔═══════════════════════════════════════════════════════════════╗
    ║         K8s Cluster Intelligence Engine v4.0                  ║
    ║         Full-Stack Security & Compliance Platform             ║
    ╠═══════════════════════════════════════════════════════════════╣
    ║  Cluster: {CFG["cluster_id"]:<20}                             ║
    ║  Port: {CFG["port"]:<24}                                      ║
    ║  Interval: {CFG["interval"]}s                                         ║
    ╚═══════════════════════════════════════════════════════════════╝
        ''')
        threading.Thread(target=worker,daemon=True).start()
        HTTPServer(("0.0.0.0",CFG["port"]),H).serve_forever()
