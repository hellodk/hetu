---
# ClusterRole - Read-only access to cluster resources
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-intel-reader
rules:
  - apiGroups: [""]
    resources: [pods, nodes, events, namespaces, configmaps, secrets, serviceaccounts, persistentvolumeclaims]
    verbs: [get, list, watch, delete]
  - apiGroups: ["apps"]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch, delete]
  - apiGroups: ["batch"]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, delete]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: [roles, rolebindings, clusterroles, clusterrolebindings]
    verbs: [get, list, watch]
  - apiGroups: ["networking.k8s.io"]
    resources: [networkpolicies, ingresses]
    verbs: [get, list, watch]
  - apiGroups: ["policy"]
    resources: [podsecuritypolicies, poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: ["aquasecurity.github.io"]
    resources: [vulnerabilityreports, configauditreports, exposedsecretreports]
    verbs: [get, list, watch]
  - apiGroups: ["metrics.k8s.io"]
    resources: [pods, nodes]
    verbs: [get, list]
