---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-intel
  namespace: utilities
  labels:
    app.kubernetes.io/name: cluster-intel
    app.kubernetes.io/version: "4.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-intel
  template:
    metadata:
      labels:
        app: cluster-intel
    spec:
      serviceAccountName: cluster-intel
      securityContext:
        runAsNonRoot: false
        fsGroup: 1000
      containers:
        - name: cluster-intel
          image: python:3.11-slim
          command:
            - /bin/sh
            - -c
            - |
              pip install kubernetes --quiet
              python /app/app.py
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: CLUSTER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ANALYSIS_INTERVAL
              value: "60"
            - name: PROMETHEUS_URL
              value: ""
            - name: ALERT_WEBHOOK_URL
              value: ""
            - name: ALERT_THRESHOLD
              value: "50"
            - name: HISTORY_RETENTION_DAYS
              value: "30"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: app-code
              mountPath: /app
            - name: ui-code
              mountPath: /config
            - name: data
              mountPath: /data
      volumes:
        - name: app-code
          configMap:
            name: cluster-intel-app
        - name: ui-code
          configMap:
            name: cluster-intel-ui
        - name: data
          persistentVolumeClaim:
            claimName: cluster-intel-data
