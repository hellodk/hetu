---
# NetworkPolicy - Allow ingress only on port 8080
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cluster-intel
  namespace: utilities
spec:
  podSelector:
    matchLabels:
      app: cluster-intel
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    - {}  # Allow all egress for API access
