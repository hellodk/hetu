# Grafana Folder Provisioning for LLM Dashboards
# This ensures the "llm" folder exists in Grafana
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-folder-llm
  namespace: monitoring
  labels:
    grafana_folder: "1"
    app: grafana
data:
  llm-folder.yaml: |
    apiVersion: 1
    folders:
      - name: llm
        uid: llm-folder
        title: LLM Monitoring
        orgId: 1
---
# Dashboard provider configuration for LLM folder
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider-llm
  namespace: monitoring
  labels:
    grafana_dashboard_provider: "1"
    app: grafana
data:
  llm-provider.yaml: |
    apiVersion: 1
    providers:
      - name: 'llm'
        orgId: 1
        folder: 'llm'
        folderUid: 'llm-folder'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/llm
