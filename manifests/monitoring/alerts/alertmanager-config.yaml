# AlertManager Configuration for Slack Integration
# This Secret contains the AlertManager configuration with Slack webhooks
# 
# IMPORTANT: Replace YOUR_SLACK_WEBHOOK_URL with your actual Slack webhook URL
# You can create a webhook at: https://api.slack.com/messaging/webhooks
#
# To apply this secret with your webhook:
#   kubectl create secret generic alertmanager-config \
#     --from-literal=alertmanager.yaml="$(cat alertmanager-config.yaml | sed 's|YOUR_SLACK_WEBHOOK_URL|https://hooks.slack.com/services/XXX/YYY/ZZZ|g')" \
#     -n monitoring
---
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-slack-config
  namespace: monitoring
  labels:
    app: alertmanager
stringData:
  slack-webhook-url: "YOUR_SLACK_WEBHOOK_URL"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config-template
  namespace: monitoring
  labels:
    app: alertmanager
data:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
      slack_api_url_file: /etc/alertmanager/secrets/slack-webhook-url

    # Route tree
    route:
      receiver: 'slack-notifications'
      group_by: ['alertname', 'severity', 'team']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      
      routes:
        # Critical alerts - immediate notification
        - receiver: 'slack-critical'
          match:
            severity: critical
          group_wait: 10s
          repeat_interval: 1h
          continue: true
        
        # Warning alerts
        - receiver: 'slack-warnings'
          match:
            severity: warning
          group_wait: 1m
          repeat_interval: 4h
          continue: true
        
        # Ollama specific alerts
        - receiver: 'slack-ollama'
          match_re:
            alertname: "^Ollama.*"
          continue: true
        
        # LLM application alerts  
        - receiver: 'slack-llm'
          match_re:
            alertname: "^LLM.*"
          continue: true

    # Inhibition rules - suppress related alerts
    inhibit_rules:
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname']
      
      - source_match:
          alertname: 'OllamaDown'
        target_match_re:
          alertname: '^Ollama.*'
        equal: ['instance']

    # Receivers
    receivers:
      - name: 'slack-notifications'
        slack_configs:
          - channel: '#k8s-alerts'
            send_resolved: true
            title: '{{ template "slack.default.title" . }}'
            text: '{{ template "slack.default.text" . }}'
            color: '{{ if eq .Status "firing" }}{{ if eq .CommonLabels.severity "critical" }}danger{{ else }}warning{{ end }}{{ else }}good{{ end }}'
            actions:
              - type: button
                text: 'Runbook :book:'
                url: '{{ (index .Alerts 0).Annotations.runbook_url }}'
              - type: button
                text: 'Dashboard :chart_with_upwards_trend:'
                url: 'http://grafana.monitoring.svc:3000/d/ollama-monitoring'
      
      - name: 'slack-critical'
        slack_configs:
          - channel: '#k8s-critical'
            send_resolved: true
            title: ':rotating_light: CRITICAL: {{ .CommonLabels.alertname }}'
            text: |
              *Alert:* {{ .CommonLabels.alertname }}
              *Severity:* {{ .CommonLabels.severity }}
              *Description:* {{ (index .Alerts 0).Annotations.description }}
              
              *Affected:*
              {{ range .Alerts }}
              - {{ .Labels.instance }}
              {{ end }}
            color: 'danger'
            actions:
              - type: button
                text: 'Acknowledge :white_check_mark:'
                url: 'http://alertmanager.monitoring.svc:9093/#/silences/new'
              - type: button
                text: 'Runbook :book:'
                url: '{{ (index .Alerts 0).Annotations.runbook_url }}'
      
      - name: 'slack-warnings'
        slack_configs:
          - channel: '#k8s-alerts'
            send_resolved: true
            title: ':warning: {{ .CommonLabels.alertname }}'
            text: |
              *Alert:* {{ .CommonLabels.alertname }}
              *Description:* {{ (index .Alerts 0).Annotations.description }}
            color: 'warning'
      
      - name: 'slack-ollama'
        slack_configs:
          - channel: '#ollama-alerts'
            send_resolved: true
            title: ':robot_face: Ollama: {{ .CommonLabels.alertname }}'
            text: |
              *Status:* {{ .Status | toUpper }}
              *Alert:* {{ .CommonLabels.alertname }}
              *Severity:* {{ .CommonLabels.severity }}
              
              *Summary:* {{ (index .Alerts 0).Annotations.summary }}
              *Description:* {{ (index .Alerts 0).Annotations.description }}
              
              *Labels:*
              {{ range .CommonLabels.SortedPairs }}• {{ .Name }}: {{ .Value }}
              {{ end }}
            color: '{{ if eq .Status "firing" }}{{ if eq .CommonLabels.severity "critical" }}danger{{ else }}warning{{ end }}{{ else }}good{{ end }}'
            actions:
              - type: button
                text: 'Ollama Dashboard'
                url: 'http://grafana.monitoring.svc:3000/d/ollama-monitoring'
              - type: button
                text: 'Silence Alert'
                url: 'http://alertmanager.monitoring.svc:9093/#/silences/new'
      
      - name: 'slack-llm'
        slack_configs:
          - channel: '#llm-alerts'
            send_resolved: true
            title: ':brain: LLM: {{ .CommonLabels.alertname }}'
            text: |
              *Status:* {{ .Status | toUpper }}
              *Alert:* {{ .CommonLabels.alertname }}
              
              *Description:* {{ (index .Alerts 0).Annotations.description }}
            color: '{{ if eq .Status "firing" }}warning{{ else }}good{{ end }}'

    # Templates
    templates:
      - '/etc/alertmanager/templates/*.tmpl'
---
# AlertManager templates for better formatting
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-templates
  namespace: monitoring
  labels:
    app: alertmanager
data:
  slack.tmpl: |
    {{ define "slack.default.title" }}
    [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
    {{ end }}

    {{ define "slack.default.text" }}
    {{ range .Alerts }}
    *Alert:* {{ .Labels.alertname }}
    *Severity:* {{ .Labels.severity }}
    *Description:* {{ .Annotations.description }}
    *Details:*
    {{ range .Labels.SortedPairs }}  • {{ .Name }}: `{{ .Value }}`
    {{ end }}
    {{ end }}
    {{ end }}
