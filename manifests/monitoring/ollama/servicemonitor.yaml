# ServiceMonitor for Ollama metrics scraping
# Ollama exposes Prometheus metrics at /metrics endpoint
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ollama
  namespace: monitoring
  labels:
    app: ollama
    release: monitoring
    component: llm
spec:
  selector:
    matchLabels:
      app: ollama
  namespaceSelector:
    matchNames:
      - ai-system
  endpoints:
    - port: http
      interval: 15s
      path: /metrics
      scrapeTimeout: 10s
---
# Service for external Ollama (if running outside K8s)
# Update the IP address to match your Ollama deployment
apiVersion: v1
kind: Service
metadata:
  name: ollama-external
  namespace: ai-system
  labels:
    app: ollama
spec:
  type: ExternalName
  externalName: "100.89.50.27"
  ports:
    - name: http
      port: 11434
      targetPort: 11434
---
# Endpoints for external Ollama service
apiVersion: v1
kind: Endpoints
metadata:
  name: ollama
  namespace: ai-system
  labels:
    app: ollama
subsets:
  - addresses:
      - ip: 100.89.50.27
    ports:
      - name: http
        port: 11434
        protocol: TCP
---
# Service to expose the endpoints
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ai-system
  labels:
    app: ollama
spec:
  ports:
    - name: http
      port: 11434
      targetPort: 11434
      protocol: TCP
