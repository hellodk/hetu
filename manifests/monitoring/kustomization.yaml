# Kustomization for Ollama Monitoring Stack
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  # Grafana folder configuration (deploy first)
  - grafana/folder-provisioning.yaml
  
  # Ollama monitoring
  - ollama/servicemonitor.yaml
  - ollama/grafana-dashboard.yaml
  
  # Alerts
  - alerts/ollama-alerts.yaml
  - alerts/alertmanager-config.yaml
  
  # Tracing
  - tempo/tempo-deployment.yaml
  - tempo/grafana-datasource.yaml
  - tempo/otel-collector.yaml
  
  # LLM Traces Dashboard
  - grafana/llm-traces-dashboard.yaml

commonLabels:
  app.kubernetes.io/part-of: cluster-intel-monitoring
  app.kubernetes.io/managed-by: kustomize

