# =============================================================================
# Environment overlay for the `hetu` release on the k0s homelab cluster.
# FRESH INSTALL 2026-08-23 — the previous release was deleted; this file no
# longer relies on --reuse-values (the old release carried the LLM/embedding
# endpoints and they are gone).
#
# Context: worker node `typhoon` has a BROKEN ClusterIP dataplane — traffic to
# pods hosted on typhoon via a Service ClusterIP times out, and the CoreDNS
# replica on typhoon black-holes ~half of all DNS lookups from other nodes.
# Until that is repaired, every component is pinned to the healthy control-
# plane node `cylon` so analyzer→collector / analyzer→stores hops stay on-node.
#
# The previous overlay hardcoded the collector Service ClusterIP
# (10.96.218.169). That IP died with the old release; this install uses the
# regular service DNS name instead — both pods are co-located on cylon, so
# the hop never crosses nodes. Re-pin a direct ClusterIP here only if DNS
# proves flaky again.
#
# Install:
#   helm upgrade --install hetu deploy/helm/hetu -n hetu --create-namespace \
#     -f values-hetu-cylon.yaml
# =============================================================================

cluster:
  id: "cylon"
  displayName: "Cylon Dev Cluster"

collector:
  image:
    repository: docker.io/hellodk/hetu-collector
    tag: "7.5.0-phase1"
    pullPolicy: IfNotPresent
  prometheusUrl: "http://monitoring-prometheus.monitoring.svc.cluster.local:9090"
  nodeSelector:
    kubernetes.io/hostname: cylon

analyzer:
  image:
    repository: docker.io/hellodk/hetu-analyzer
    tag: "7.6.3-version"
    pullPolicy: IfNotPresent
  nodeSelector:
    kubernetes.io/hostname: cylon
  # Remaining DNS lookups (utilities postgres, monitoring) fail over fast to
  # the healthy CoreDNS replica instead of hanging on the typhoon one.
  dnsConfig:
    options:
      - name: timeout
        value: "1"
      - name: attempts
        value: "5"
      - name: rotate

dashboard:
  image:
    repository: docker.io/hellodk/hetu-dashboard
    tag: "7.6.0-responsive"
    pullPolicy: IfNotPresent
    # NOTE: image must be built with --build-arg NEXT_BASE_PATH=/hetu —
    # basePath is a BUILD-TIME Next.js setting. The 7.5.0-phase1 image was.
  nodeSelector:
    kubernetes.io/hostname: cylon
  service:
    type: NodePort
    nodePort: 30303

# --- Stores ------------------------------------------------------------------
# Postgres: reuse the shared cluster instance in `utilities` (never deploy a
# duplicate). DB/role `hetu` were created there 2026-08-23; credentials live
# in Secret hetu/hetu-postgres.
stores:
  postgres:
    bundled: false
    external:
      host: postgres.utilities.svc.cluster.local
      port: 5432
      db: hetu
      user: hetu
      existingSecret: hetu-postgres
      existingSecretPasswordKey: password
    sslMode: disable
  redis:
    bundled: true          # lean standalone StatefulSet (redis:7-alpine)
    nodeSelector:
      kubernetes.io/hostname: cylon

bus:
  nats:
    bundled: true

# --- LLM ----------------------------------------------------------------------
# Placeholder so the chart renders — ollama is NOT reachable at 127.0.0.1
# from inside the pod. Configure the real endpoint from the dashboard
# Settings UI (runtime config API), or edit this file and upgrade.
llm:
  provider: ollama
  endpoint: "http://192.168.1.5:8000"
  model: llama3
  dailyTokenBudget: 1000000

# --- Safety rails ---------------------------------------------------------------
# exec: pod log/exec terminal available (protected namespaces still guarded).
# writeActions: scale/restart/delete stay OFF until application-level auth
# ships (review finding C5 — the analyzer API has no token validation of its
# own; the SSO ingress only protects the dashboard route).
exec:
  enabled: true
writeActions:
  enabled: false

protectedNamespaces:
  - kube-system
  - kube-public
  - kube-node-lease
  - utilities
  - monitoring

# --- HTTPS + Keycloak SSO path (in ADDITION to the NodePort at :30303/hetu) ----
# https://thecylon.local:32443/hetu behind the shared homelab-sso oauth2-proxy,
# Traefik built-in default TLS cert. Middlewares live in `utilities`.
ssoIngress:
  enabled: true
  host: thecylon.local

# --- Observability ---------------------------------------------------------------
serviceMonitor:
  enabled: true
# NOTE: monitoring.enabled intentionally stays false — it would ship chart-local
# Tempo + OTEL Collector deployments into `monitoring`, duplicating the
# existing avika-tempo and cluster OTEL gateway. PrometheusRule + Grafana
# dashboard ConfigMaps land in Phase 2 once their release-label wiring is fixed.
monitoring:
  enabled: false
  ollama:
    enabled: false

logging:
  level: info
  format: json
