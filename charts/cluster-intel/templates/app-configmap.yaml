    def categorize_pod(pod):
        phase=pod.status.phase
        reason=pod.status.reason or ""
        if phase=="Failed" and reason=="Evicted":return "evicted"
        if pod.metadata.deletion_timestamp:
            if get_age_seconds(pod.metadata.deletion_timestamp)>300:return "terminating"
        for cs in(pod.status.container_statuses or[]):
            if cs.state.waiting:
                r=cs.state.waiting.reason or""
                if r=="CrashLoopBackOff":return "crashloop"
                if r in["ImagePullBackOff","ErrImagePull"]:return "imagepull"
                if r=="CreateContainerConfigError":return "configerror"
            if cs.state.terminated:
                r=cs.state.terminated.reason or""
                if r=="OOMKilled":return "oomkilled"
                if cs.state.terminated.exit_code!=0:return "error"
        if phase=="Failed":return "failed"
        if phase=="Pending":return "pending"
        if phase=="Unknown":return "unknown"
        if phase=="Succeeded":return "completed"
        return "running"
    
    def get_pod_events(namespace,name):
        try:
            events=core_api.list_namespaced_event(namespace,field_selector=f"involvedObject.name={name}")
            return[{"type":e.type,"reason":e.reason,"message":e.message,"age":get_age(e.last_timestamp or e.metadata.creation_timestamp)}
                   for e in sorted(events.items,key=lambda x:x.metadata.creation_timestamp or datetime.min.replace(tzinfo=timezone.utc),reverse=True)[:5]]
        except:return[]
    
    def analyze_pending_reason(events):
        for e in events:
            msg=e.get("message","").lower()
            if "insufficient cpu" in msg:return{"reason":"Insufficient CPU","detail":"Not enough CPU on nodes"}
            if "insufficient memory" in msg:return{"reason":"Insufficient Memory","detail":"Not enough memory on nodes"}
            if "no nodes available" in msg:return{"reason":"No Nodes","detail":"No schedulable nodes"}
            if "taint" in msg:return{"reason":"Taint/Toleration","detail":"Pod doesn't tolerate taints"}
            if "affinity" in msg:return{"reason":"Affinity","detail":"No matching nodes"}
            if "persistentvolumeclaim" in msg:return{"reason":"PVC Pending","detail":"Volume not bound"}
        return{"reason":"Unknown","detail":"Check events"}
    
    def analyze_crashloop_reason(pod, events, last_status):
        """Analyze CrashLoopBackOff to find root cause"""
        exit_code = last_status.get("exitCode") if last_status else None
        term_reason = last_status.get("reason", "") if last_status else ""
        
        # Check for OOMKilled
        if term_reason == "OOMKilled" or exit_code == 137:
            return {"reason": "OOMKilled", "detail": "Container exceeded memory limit", "remediation": "oomkilled"}
        
        # Check events for common issues
        for e in events:
            msg = e.get("message", "").lower()
            reason = e.get("reason", "")
            if "liveness probe failed" in msg:
                return {"reason": "Liveness Probe Failed", "detail": "Health check failing - app may be slow or deadlocked", "remediation": "liveness"}
            if "readiness probe failed" in msg:
                return {"reason": "Readiness Probe Failed", "detail": "Readiness check failing", "remediation": "readiness"}
            if "back-off" in msg and "pulling" in msg:
                return {"reason": "Image Pull Issue", "detail": "Failed to pull container image", "remediation": "imagepull"}
            if "error" in msg and ("configmap" in msg or "secret" in msg):
                return {"reason": "Missing Config", "detail": "ConfigMap or Secret not found", "remediation": "config"}
            if "mounting" in msg or "volume" in msg:
                return {"reason": "Volume Mount Error", "detail": "Failed to mount volume", "remediation": "volume"}
        
        # Analyze exit codes
        if exit_code is not None:
            if exit_code == 1:
                return {"reason": "Application Error", "detail": f"Exit code 1 - general application error", "remediation": "app_error"}
            if exit_code == 2:
                return {"reason": "Shell Error", "detail": "Exit code 2 - misuse of shell command", "remediation": "shell_error"}
            if exit_code == 126:
                return {"reason": "Permission Denied", "detail": "Exit code 126 - command not executable", "remediation": "permission"}
            if exit_code == 127:
                return {"reason": "Command Not Found", "detail": "Exit code 127 - command/binary not found", "remediation": "not_found"}
            if exit_code == 128:
                return {"reason": "Invalid Exit Code", "detail": "Exit code 128 - invalid argument to exit", "remediation": "app_error"}
            if exit_code >= 129 and exit_code <= 165:
                signal = exit_code - 128
                signals = {9: "SIGKILL", 15: "SIGTERM", 6: "SIGABRT", 11: "SIGSEGV"}
                sig_name = signals.get(signal, f"Signal {signal}")
                return {"reason": f"Killed ({sig_name})", "detail": f"Exit code {exit_code} - terminated by {sig_name}", "remediation": "signal"}
            if exit_code != 0:
                return {"reason": "Application Crash", "detail": f"Exit code {exit_code} - check application logs", "remediation": "app_error"}
        
        return {"reason": "Unknown", "detail": "Check container logs for details", "remediation": "unknown"}
    
