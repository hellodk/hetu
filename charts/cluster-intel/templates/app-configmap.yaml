    def delete_pod(namespace,name,force=False,initiated_by="manual"):
        if is_protected(namespace):return{"success":False,"message":f"Namespace {namespace} is protected"}
        try:
            body=client.V1DeleteOptions(grace_period_seconds=0)if force else client.V1DeleteOptions()
            core_api.delete_namespaced_pod(name,namespace,body=body)
            log_action("delete_pod",f"{namespace}/{name}",initiated_by,True,"Deleted")
            return{"success":True,"message":"Pod deleted"}
        except ApiException as e:
            log_action("delete_pod",f"{namespace}/{name}",initiated_by,False,e.reason)
            return{"success":False,"message":e.reason}
    
    def delete_pods_bulk(pods,initiated_by="manual"):
        results={"deleted":0,"failed":0,"skipped":0}
        for p in pods:
            if is_protected(p["namespace"]):results["skipped"]+=1;continue
            r=delete_pod(p["namespace"],p["name"],initiated_by=initiated_by)
            results["deleted" if r["success"]else "failed"]+=1
        return results
    
    def restart_deployment(namespace,name,initiated_by="manual"):
        if is_protected(namespace):return{"success":False,"message":"Protected namespace"}
        try:
            patch={"spec":{"template":{"metadata":{"annotations":{"kubectl.kubernetes.io/restartedAt":datetime.now(timezone.utc).isoformat(){{ "}}" }}{{ "}}" }}}
            apps_api.patch_namespaced_deployment(name,namespace,patch)
            log_action("restart",f"{namespace}/{name}",initiated_by,True,"Restarted")
            return{"success":True,"message":"Restart initiated"}
        except ApiException as e:
            return{"success":False,"message":e.reason}
    
