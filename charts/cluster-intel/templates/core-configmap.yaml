apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cluster-intel.fullname" . }}-config
  labels:
    {{- include "cluster-intel.labels" . | nindent 4 }}
data:
  config.yaml: |
    cluster_id: {{ .Values.config.clusterId | quote }}
    analysis_interval: {{ .Values.config.analysisInterval }}
    history_retention_days: {{ .Values.config.historyRetentionDays }}
    theme: {{ .Values.config.theme | quote }}
    
    prometheus:
      enabled: {{ .Values.config.prometheus.enabled }}
      url: {{ .Values.config.prometheus.url | quote }}
      
    alerts:
      enabled: {{ .Values.config.alerts.enabled }}
      threshold: {{ .Values.config.alerts.threshold }}
      webhooks:
{{ toYaml .Values.config.alerts.webhooks | indent 6 }}
    
    scoring:
      weights:
        reliability: {{ .Values.config.scoring.weights.reliability }}
        security: {{ .Values.config.scoring.weights.security }}
        cost: {{ .Values.config.scoring.weights.cost }}
        architecture: {{ .Values.config.scoring.weights.architecture }}
