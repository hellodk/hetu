apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cluster-intel.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-intel.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cluster-intel.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  egress:
    - {}  # Allow all egress for API access
